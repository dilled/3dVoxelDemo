      blending: THREE.AdditiveBlending, depthWrite: false,
    }),
    unsloth: null, // set in KIT.init once textures exist
    city: null,    // set in KIT.init
    core: null,    // set in KIT.init
  },
};

/* ---- instancing builders (capacity up front, no per-frame allocation) ---- */

function makeInstanced(geo, material, capacity) {
  const mesh = new THREE.InstancedMesh(geo, material, capacity);
  mesh.count = 0;
  mesh.frustumCulled = false;      // instance spread > single-geo bounds
  const m4 = new THREE.Matrix4();
  const pos = new THREE.Vector3();
  const q = new THREE.Quaternion();
  const scl = new THREE.Vector3();
  const col = new THREE.Color();
  const Y = new THREE.Vector3(0, 1, 0);
  const B = {
    mesh,
    capacity,
    count: 0,
    /* add(x, y, z, scale| [sx,sy,sz], color, rotY) — returns self */
    add(x, y, z, scale = 1, color = null, rotY = 0) {
      if (B.count >= capacity) return B;
      pos.set(x, y, z);
      if (rotY) q.setFromAxisAngle(Y, rotY); else q.identity();
      if (typeof scale === 'number') scl.set(scale, scale, scale);
      else scl.set(scale[0], scale[1], scale[2]);
      m4.compose(pos, q, scl);
      mesh.setMatrixAt(B.count, m4);
      if (color !== null) mesh.setColorAt(B.count, col.set(color));
      B.count++;
      return B;
    },
    commit() {
      mesh.count = B.count;
      if (B.count) {
        mesh.instanceMatrix.needsUpdate = true;
        if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      }
      return B;
    },
  };
  return B;
}

/* ---- merged-geometry batcher: many placed primitives → one static mesh ---- */

function mergeGeometries(parts) {
  // parts: [{ geo, matrix? }] → one non-indexed BufferGeometry (position/normal/uv)
  const geos = [];
  let vTotal = 0;
  for (const { geo, matrix } of parts) {
    const g = geo.index ? geo.toNonIndexed() : geo.clone();
    if (matrix) g.applyMatrix4(matrix);
    geos.push(g);
    vTotal += g.attributes.position.count;
  }
  const out = new THREE.BufferGeometry();
  for (const name of ['position', 'normal', 'uv']) {
    const itemSize = geos[0].attributes[name].itemSize;
    const arr = new Float32Array(vTotal * itemSize);
    let off = 0;
    for (const g of geos) {
      const a = g.attributes[name];
      arr.set(a.array.subarray(0, a.count * itemSize), off);
      off += a.count * itemSize;
    }
    out.setAttribute(name, new THREE.BufferAttribute(arr, itemSize));
  }
  for (const g of geos) g.dispose();
  return out;
}

/* ---- the KIT system ---- */

const KIT = {
  name: 'KIT',
  MATS,
  tex: null,
  hemi: null,
  moon: null,
  heroLights: [],          // reserved point lights for hero moments
  testRig: null,
  glowSprite: null,
  _acc: 0,
  _acc2: 0,
  _tag: 0,

  init() {
    /* lighting rig: hemi fill + one key directional (moon / anti-sun) */
    const L = CFG.lights;
    KIT.hemi = new THREE.HemisphereLight(L.hemiSky, L.hemiGround, L.hemiIntensity);
    KIT.moon = new THREE.DirectionalLight(L.moonColor, L.moonIntensity);
    KIT.moon.position.set(L.moonPos[0], L.moonPos[1], L.moonPos[2]);
    scene.add(KIT.hemi, KIT.moon);
    // two point lights reserved for hero moments — cost is only the light
    // slot while intensity is 0
    for (let i = 0; i < 2; i++) {
      const p = new THREE.PointLight(0xffffff, 0, L.heroPointDist, L.heroPointDecay);
      p.position.set(0, 24, 0);
      scene.add(p);
      KIT.heroLights.push(p);
    }

    /* textures (LED faces, holo signs, glow) */
    /* holo-sign billboard materials (shared across chunks, FrontSide) */
    MATS.signMat.unsloth = new THREE.MeshBasicMaterial({
      transparent: true, side: THREE.FrontSide,
      blending: THREE.AdditiveBlending, depthWrite: false,
    });
    MATS.signMat.city = MATS.signMat.unsloth.clone();
    MATS.signMat.core = MATS.signMat.unsloth.clone();

    KIT.tex = {
      ledA: makeLedGrid(48, 24, 0.0, ['#41e0ff', '#59f0ff', '#2fa8ff', '#9ff2ff', '#ffd166']),
      ledB: makeLedGrid(24, 16, 7.3, ['#41e0ff', '#2fa8ff', '#59f0ff']),
      signQwen: makeHoloSign('QWEN', 'FLASH // AWAKENING', '#7fe6ff', 256, 96),
      signUnsloth: makeHoloSign('UNSLOTH', () => KIT._tagline(), '#ffb3d9', 256, 96),
      glow: makeGlowTexture(128, '150,235,255'),
      /* M10.2: the relaxed holo-sloth silhouette (billboard, additive) */
      slothHolo: makeSlothHolo('#ffb3d9'),
      /* M4: shared city-sign faces for the WORLD holo-sign billboards */
      signCity: makeHoloSign('UNSLOTH', () => KIT._tagline(), '#ff9ecb', 256, 96),
      signCore: makeHoloSign('QWEN', 'CORE COMPUTE', '#7fe6ff', 256, 96),
    };
    /* bind the shared sign materials to their textures (WORLD reuses them)
     * — each material is bound once, so per-chunk signs stay one draw call */
    MATS.signMat.qwen.map = KIT.tex.signQwen.tex;
    MATS.signMat.unsloth.map = KIT.tex.signUnsloth.tex;
    MATS.signMat.city.map = KIT.tex.signCity.tex;
    MATS.signMat.core.map = KIT.tex.signCore.tex;

    KIT.buildTestRig();
  },

  _tagline() {
    return ['LOCAL ≠ SLOW', 'WHY RUSH?'][KIT._tag];
  },

  /* M2 gate demo: test wall/tower — 8 draw calls total:
   * tower boxes (1) + cylinders (1) + wall boxes (1) + LED planes (2)
   * + holo signs (2) + glow sprite (1) */
  buildTestRig() {
    const g = new THREE.Group();
    const P = CFG.kit.testTower;
    const X = P.x, Z = P.z;

    /* tower body — one InstancedMesh with per-instance tint */
    const tower = KIT.InstancedBox(12, [1, 1, 1], MATS.metalDark);
    tower.add(X, 0.5, Z, [16, 1, 16], 0xcfd8e8);          // base slab
    tower.add(X, 13, Z, [10, 24, 10], 0xe8eef8);          // main mass
    tower.add(X, 28, Z, [6, 8, 6], 0xd3dcef);             // upper stage
    tower.add(X, 33.2, Z, [3, 2.4, 3], 0xbcc7de);         // roof block
    tower.add(X, 35.2, Z, [1.2, 1.6, 1.2], 0xd8e0f0);     // crown
    tower.commit();
    g.add(tower.mesh);

    /* legs + antenna — one instanced cylinder mesh */
    const cyl = KIT.InstancedCylinder(8, 0.5, 0.5, 1, 10, MATS.cable);
    for (const [dx, dz] of [[6, 6], [-6, 6], [6, -6], [-6, -6]]) {
      cyl.add(X + dx, 1.5, Z + dz, [1, 3, 1], 0x9fb4d8);   // leg pillars
    }
    cyl.add(X, 39.5, Z, [1, 9, 1], 0x8090b0);               // antenna mast
    cyl.commit();
    g.add(cyl.mesh);

    /* test wall — one instanced box row */
    const wall = KIT.InstancedBox(16, [1, 1, 1], MATS.server);
    const WX = X - 22, WZ = Z + 14;
    for (let i = 0; i < 12; i++) {
      wall.add(WX - 11 + i * 2.2, 1.6, WZ, [2, 3.2, 1.2],
        i % 3 ? 0xd8e4f8 : 0xb8c8e8);
    }
    wall.commit();
    g.add(wall.mesh);

    /* animated LED faces — two unlit planes, one material each */
    const ledA = new THREE.Mesh(
      new THREE.PlaneGeometry(9.6, 5.4),
      new THREE.MeshBasicMaterial({ map: KIT.tex.ledA.tex }),
    );
    ledA.position.set(X, 12.5, Z + 5.06);
    g.add(ledA);
    const ledB = new THREE.Mesh(
      new THREE.PlaneGeometry(5.6, 3.6),
      new THREE.MeshBasicMaterial({ map: KIT.tex.ledB.tex }),
    );
    ledB.position.set(X + 5.06, 16, Z);
    ledB.rotation.y = Math.PI / 2;
    g.add(ledB);

    /* holo signs — additive billboard planes */
    const mkSign = (w, h, T, x, y, z) => {
      const m = new THREE.Mesh(
        new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({
          /* FrontSide: viewer-facing billboards — transparent DoubleSide
             objects render in two passes (extra draw call per sign) */
          map: T.tex, transparent: true, side: THREE.FrontSide,
          blending: THREE.AdditiveBlending, depthWrite: false,
        }),
      );
      m.position.set(x, y, z);
      g.add(m);
    };
    mkSign(8.4, 3.2, KIT.tex.signQwen, X, 37.4, Z + 3.2);
    mkSign(5.2, 2.2, KIT.tex.signUnsloth, WX, 4.9, WZ + 0.8);

    /* soft glow sprite at the antenna tip */
    const glow = new THREE.Sprite(
      new THREE.SpriteMaterial({
        map: KIT.tex.glow.tex, transparent: true,
        blending: THREE.AdditiveBlending, depthWrite: false,
      }),
    );
    glow.position.set(X, 44.5, Z);
    glow.scale.set(3.4, 3.4, 1);
    g.add(glow);
    KIT.glowSprite = glow;

    scene.add(g);
    KIT.testRig = g;
  },

  /* builders (attached so later milestones share them) */
  InstancedBox: (capacity, size = [1, 1, 1], material = MATS.metalDark) =>
    makeInstanced(new THREE.BoxGeometry(size[0], size[1], size[2]), material, capacity),

  InstancedCylinder: (capacity, r1 = 0.5, r2 = 0.5, h = 1, radial = 10,
    material = MATS.metalDark) =>
    makeInstanced(new THREE.CylinderGeometry(r1, r2, h, radial), material, capacity),

  mergeGeometries: parts => mergeGeometries(parts),
  makeCanvasTexture: (w, h, draw) => makeCanvasTexture(w, h, draw),
  makeLedGrid: (cols, rows, seed, palette) => makeLedGrid(cols, rows, seed, palette),
  makeHoloSign: (text, sub, color, w, h) => makeHoloSign(text, sub, color, w, h),
  makeGlowTexture: (size, rgb) => makeGlowTexture(size, rgb),

  update(dt, t) {
    /* LED faces: 15 Hz canvas redraw (small canvases, cheap) */
    KIT._acc += dt;
    const ledStep = 1 / CFG.kit.ledHz;
    if (KIT._acc >= ledStep) {
      KIT._acc %= ledStep;
      KIT.tex.ledA.redraw(t);
      KIT.tex.ledB.redraw(t + 137.2);
    }
    /* holo signs: 8 Hz flicker redraw + slow tagline cycle */
    KIT._acc2 += dt;
    const signStep = 1 / CFG.kit.signHz;
    if (KIT._acc2 >= signStep) {
      KIT._acc2 %= signStep;
      KIT.tex.signQwen.redraw(t);
      KIT.tex.signUnsloth.redraw(t);
    }
    const tagN = Math.floor(t / CFG.kit.signTagCycle) & 1;
    if (tagN !== KIT._tag) KIT._tag = tagN;
    /* glow sprite pulse */
    if (KIT.glowSprite) {
      const s = 3.4 * (1 + 0.1 * Math.sin(t * 2.3));
      KIT.glowSprite.scale.set(s, s, 1);
    }
  },

  dispose() {},
};

/* ==================================================================== *
 * WORLD — chunked city generation, far layer (M3)
 *
 *  - seeded PRNG (mulberry32): every block seed derives from WORLD.seed,
 *    so the city is identical on every run/refresh and a chunk rebuilt
 *    later is byte-identical (no visible duplication, no shimmer)
 *  - city grid: 24 m blocks; avenues every 5 blocks — they radiate from
 *    the central plaza and therefore trace the ring roads; the central
 *    plaza (±2 blocks) stays clear for the M5 creature; a small keep-out
 *    preserves the M2 test rig
 *  - chunk = 16×16 blocks (384 m); generated on demand around the
 *    player, retired outside the 5×5 keep-set; per-chunk budget =
 *    building density by distance ring
 *  - 8 building archetypes, weights by zone (core / mid / outer),
 *    height falloff with radius from the plaza
 *  - distance LOD: 3 rings — dense mass / mid mass / hazed silhouettes
 *  - each chunk costs ≤ 3 draw calls (structural boxes / emissive boxes /
 *    cylinders — one InstancedMesh each), each mesh frustum-culled with
 *    its own bounding sphere → draw calls stay flat as you fly out
 * --------------------------------------------------------------------- */

/* deterministic PRNG — the whole city derives from these seeds */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* allocation-free tint helpers (numbers in, number out) */
function _tintShade(hex, v) {   // brightness × v
  const r = Math.min(255, Math.floor(((hex >> 16) & 255) * v));
  const g = Math.min(255, Math.floor(((hex >> 8) & 255) * v));
  const b = Math.min(255, Math.floor((hex & 255) * v));
  return (r << 16) | (g << 8) | b;
}
function _tintHaze(hex, k, haze) {   // lerp toward the city-haze tint
  const r = Math.round(((hex >> 16) & 255) * (1 - k) + ((haze >> 16) & 255) * k);
  const g = Math.round(((hex >> 8) & 255) * (1 - k) + ((haze >> 8) & 255) * k);
  const b = Math.round((hex & 255) * (1 - k) + (haze & 255) * k);
  return (r << 16) | (g << 8) | b;
}
/* M9.4 beat 4: the awakening wave's per-instance brightness envelope.
 * tau = s since the wavefront passed this instance (<= 0 = not yet).
 * smoothstep attack over `atk` s, lit hold for `hold` s, smoothstep
 * release over `rel` s ⇒ back to exactly 0. */
function _waveEnv(tau, atk, hold, rel) {
  if (tau <= 0) return 0;
  let a = tau / atk;
  if (a > 1) a = 1;
  let env = a * a * (3 - 2 * a);
  const h = tau - atk;
  if (h > hold) {
    let rl = (h - hold) / rel;
    if (rl > 1) rl = 1;
    env *= 1 - (rl * rl * (3 - 2 * rl));
  }
  return env;
}

const WORLD = {
  name: 'WORLD',
  mulberry: mulberry32,
  seed: CFG.city.seed,
  BLOCK: CFG.city.block,
  CHUNK: CFG.city.chunkBlocks,
  RADIUS: CFG.city.radius,
  root: null,
  ground: null,
  chunks: new Map(),      // "cx,cz" -> chunk
  _pool: [],               // retired chunks (buffers reused, never disposed)
  _pcx: NaN, _pcz: NaN,    // last player chunk (triggers _sync on change)
  playerKey: '',
  _farTint: {},
  /* M4 near-layer detail pass */
  _detailAssets: null,
  _cool: null,            // per _fill: cooling-tower anchor list (pipes)
  _nLed: 0,
  _nSign: 0,
  _nDash: 0,
  /* M9.4 beat 4: the city holo-signs + building LED facades follow the
   * awakening wave — per-instance color ramp scheduled by distance from
   * the plaza. Restores EXACTLY (1.0) at wave end / DORMANT entry. */
  _waveT0: 0,
  _waveActive: false,
  _m4: new THREE.Matrix4(),
  _p4: new THREE.Vector3(),
  _q4: new THREE.Quaternion(),
  _s4: new THREE.Vector3(),
  _y4: new THREE.Vector3(0, 1, 0),
  _z4: new THREE.Vector3(0, 0, 1),
  _c4: new THREE.Color(),
  _camDir4: new THREE.Vector3(),
  _monD: new THREE.Vector3(),  // M10.1: monument sign billboard scratch
  /* M10.2: sloth-drone instance scratch (zero per-frame allocation) */
  _slothM: new THREE.Matrix4(),
  _slothP: new THREE.Vector3(),
  _slothQ: new THREE.Quaternion(),
  _slothQ2: new THREE.Quaternion(),
  _slothS: new THREE.Vector3(1, 1, 1),
  _slothY: new THREE.Vector3(0, 1, 0),
  monument: null,              // M10.1: { g, body, neon, sign, neonMat, neonBase, bx, bz, x, z, hTop, w }
  stats: { chunks: 0, instances: 0, ring: [0, 0, 0], meters: 0 },

  init() {
    const C = CFG.city;
    WORLD.root = new THREE.Group();
    scene.add(WORLD.root);
    /* M4: shared detail geometries/materials (one of each, pooled chunks
     * attach their own InstancedMesh on top — zero per-frame allocation). */
    WORLD._detailAssets = {
      fanGeo: mergeGeometries([
        { geo: new THREE.CylinderGeometry(0.5, 0.5, 0.22, 8) },
        { geo: new THREE.BoxGeometry(3.7, 0.2, 0.42), matrix: new THREE.Matrix4().makeTranslation(1.0, 0, 0) },
        { geo: new THREE.BoxGeometry(3.7, 0.2, 0.42), matrix: new THREE.Matrix4().makeTranslation(-1.0, 0, 0) },
        { geo: new THREE.BoxGeometry(3.7, 0.2, 0.42), matrix: new THREE.Matrix4().makeRotationY(Math.PI / 2).multiply(new THREE.Matrix4().makeTranslation(1.0, 0, 0)) },
        { geo: new THREE.BoxGeometry(3.7, 0.2, 0.42), matrix: new THREE.Matrix4().makeRotationY(-Math.PI / 2).multiply(new THREE.Matrix4().makeTranslation(1.0, 0, 0)) },
      ]),
      fanCap: 64,
      dishGeo: (() => {
        const g = new THREE.CylinderGeometry(0.55, 1.2, 0.5, 10);
        g.rotateZ(-1.15);   // tilted dish face, swept by the per-frame rotY
        return g;
      })(),
      dishCap: 40,
      pulseGeo: new THREE.BoxGeometry(1, 1, 1),
      pulseCap: 48,
      signGeo: new THREE.PlaneGeometry(1, 1),
      signCap: 8,
      ledGeo: new THREE.PlaneGeometry(1, 1),
      ledCap: 64,
      signMats: { qwen: MATS.signMat.qwen, unsloth: MATS.signMat.unsloth, city: MATS.signMat.city, core: MATS.signMat.core },
      ledMats: {
        a: new THREE.MeshBasicMaterial({ map: KIT.tex.ledA.tex, side: THREE.FrontSide }),
        b: new THREE.MeshBasicMaterial({ map: KIT.tex.ledB.tex, side: THREE.FrontSide }),
      },
    };
    /* far-ring silhouette tints (hazed once, not per-building) */
    for (const k in C.archetypes) {
      WORLD._farTint[k] = _tintHaze(C.archetypes[k].tint, C.hazeAmount, C.haze);
    }
    /* ground: one big plane with a repeating block-grid texture.
     * 6240 m = 26 avenue periods of 120 m; corner at -3120 m sits on the
     * 24 m block grid, so texture lines stay world-aligned to the city. */
    const gt = makeCanvasTexture(250, 250, (ctx, w, h) => {
      ctx.fillStyle = '#0a0f17';
      ctx.fillRect(0, 0, w, h);
      const cell = 50;                        // 5 block-cells per avenue period
      ctx.strokeStyle = 'rgba(90,140,190,0.15)';
      ctx.lineWidth = 2;
      for (let i = 1; i < 5; i++) {
        ctx.beginPath(); ctx.moveTo(i * cell + 0.5, 0); ctx.lineTo(i * cell + 0.5, h); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * cell + 0.5); ctx.lineTo(w, i * cell + 0.5); ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(110,190,255,0.28)';   // avenue / ring-road line
      ctx.lineWidth = 3;
      ctx.strokeRect(1.5, 1.5, w - 3, h - 3);
    });
    gt.tex.wrapS = gt.tex.wrapT = THREE.RepeatWrapping;
    gt.tex.repeat.set(52, 52);               // 6240 m / 120 m period
    gt.tex.anisotropy = 8;
    WORLD.ground = new THREE.Mesh(
      new THREE.PlaneGeometry(6240, 6240),
      new THREE.MeshLambertMaterial({ map: gt.tex }),
    );
    WORLD.ground.rotation.x = -Math.PI / 2;
    WORLD.root.add(WORLD.ground);
    WORLD._buildMonument();
  },

  /* public API — M9.4 beat 4: arm the city holo-sign / LED-facade
   * wave (t = the wavefront's t0). Idempotent per sequence — ENTITY
   * fires it once, gated on _ignited. */
  awakenWave(t) {
    WORLD._waveT0 = t;
    WORLD._waveActive = true;
  },

  /* public API — M9.4: end the wave EXACTLY (every visible chunk's
   * sign/ledWin instance colors restored to 1.0). Idempotent. Called
   * at DORMANT entry (and by the wave's own completion). */
  awakenWaveEnd() {
    if (!WORLD._waveActive) return;
    WORLD._waveActive = false;
    WORLD._waveRestore();
  },

  /* M9.4: restore every visible chunk's sign/ledWin instance colors to
   * exactly 1.0 (idle). One pass, only ever called at wave end. */
  _waveRestore() {
    for (const ch of WORLD.chunks.values()) {
      for (const b of [ch.sign, ch.ledWin]) {
        if (b.count === 0 || !b.mesh.instanceColor) continue;
        const a = b.mesh.instanceColor.array;
        for (let i = 0; i < b.count * 3; i++) a[i] = 1;
        b.mesh.instanceColor.needsUpdate = true;
      }
    }
  },

  /* per-block seed — deterministic for (bx, bz) forever */
  _seedFor(bx, bz) {
    let h = WORLD.seed
      ^ Math.imul(bx + 131, 0x9E3779B1)
      ^ Math.imul(bz + 397, 0x85EBCA77);
    h = Math.imul(h ^ (h >>> 15), 0xC2B2AE3D) >>> 0;
    return h;
  },

  /* avenues every 5 blocks (they radiate from the plaza ⇒ ring roads);
   * central plaza kept clear; keep-out preserves the M2 test rig */
  _skipBlock(bx, bz) {
    const m5 = n => ((n % 5) + 5) % 5;
    if (m5(bx) === 0 || m5(bz) === 0) return true;
    if (Math.max(Math.abs(bx), Math.abs(bz)) <= CFG.city.plazaBlocks) return true;
    const P = CFG.kit.testTower;
    const wx = (bx + 0.5) * WORLD.BLOCK, wz = (bz + 0.5) * WORLD.BLOCK;
    if (Math.abs(wx - P.x) < 16 && Math.abs(wz - P.z) < 16) return true;
    return false;
  },

  /* M6.2 — replay one block's building seed without building geometry.
   * Runs the EXACT seeded path of _fill (occupancy → archetype → mass)
   * into a no-op sink, so drone routes land where mass actually is.
   * Pure: no chunk state touched. `ring` must be the block's current
   * player-relative chunk ring (occupancy depends on it, like _fill).
   * M6.4: `archs` / `minH` are overridable (defaults keep the drone-
   * dock behaviour) so emitters can source other archetypes (cool,
   * sub) at any height. */
  _sink: { add() {} },
  _sinkCh: null,   // pre-allocated sink chunk (no per-call allocation)
  buildingAt(bx, bz, ring,
             archs = CFG.traffic.drone.dockArchetypes,
             minH = CFG.traffic.drone.minH) {
    if (WORLD._sinkCh === null) {
      WORLD._sinkCh = {
        boxA: WORLD._sink, boxG: WORLD._sink, cyl: WORLD._sink,
      };
    }
    if (WORLD._skipBlock(bx, bz)) return null;
    const rng = mulberry32(WORLD._seedFor(bx, bz));
    if (rng() >= CFG.city.occupancy[ring]) return null;
    const B = WORLD.BLOCK;
    const wx = (bx + 0.5) * B, wz = (bz + 0.5) * B;
    const dist = Math.hypot(wx, wz);
    const zone = dist < 220 ? 'core' : dist < 520 ? 'mid' : 'outer';
    const fall = 0.35 + 0.65 * Math.exp(-dist * 0.0045);
    const arch = WORLD._pick(rng, zone);
    if (!archs.includes(arch)) return null;
    const info = WORLD._mass(rng, WORLD._sinkCh, arch,
      CFG.city.archetypes[arch], wx, wz, fall, ring);
    if (info.h < minH) return null;
    return info;
  },

  update(dt, t) {
    const p = CAMERA.pos;
    const bx = Math.floor(p.x / WORLD.BLOCK);
    const bz = Math.floor(p.z / WORLD.BLOCK);
    const cx = Math.floor(bx / WORLD.CHUNK);
    const cz = Math.floor(bz / WORLD.CHUNK);
    WORLD.playerKey = cx + ',' + cz;
    if (cx === WORLD._pcx && cz === WORLD._pcz) {
      WORLD._updateDetail(t);
    } else {
      WORLD._pcx = cx; WORLD._pcz = cz;
      WORLD._sync();
      WORLD._updateDetail(t);
    }
    WORLD._updateMonument(dt, t);
  },

  /* M10.1 — pick the monument tower: one side-avenue compute tower.
   * Deterministic scan of the seeded city (same pick every run/refresh):
   * first `server` block on the plaza's south side (bz > 0 ⇒ behind the
   * spawn camera ⇒ outside the default intro-reveal framing), adjacent to
   * an avenue (so it reads from the street), at mid distance, tall enough
   * to be a landmark. */
  _pickMonument() {
    const B = WORLD.BLOCK;
    const m5 = n => ((n % 5) + 5) % 5;
    for (let bz = 3; bz <= 12; bz++) {
      for (let bx = -8; bx <= 8; bx++) {
        if (m5(bx) === 0 || m5(bz) === 0) continue;        // avenues
        if (m5(bx) !== 1 && m5(bx) !== 4 &&
            m5(bz) !== 1 && m5(bz) !== 4) continue;         // not on an avenue
        const wx = (bx + 0.5) * B, wz = (bz + 0.5) * B;
        const d = Math.hypot(wx, wz);
        if (d < 100 || d > 300) continue;                  // mid-distance
        const info = WORLD.buildingAt(bx, bz, 0,
          ['server'], CFG.kit.slothMonument.minH);
        if (info) return { bx, bz, wx, wz, info };
      }
    }
    return null;
  },

  /* M10.1 — build the voxel neon sloth + rooftop UNSLOTH sign on the
   * picked tower's crown. Standalone (outside the chunk pools ⇒ chunk
   * regen / LOD / wave-restore never touch it): pedestal + body merged
   * into one dark mesh, neon trim merged into one basic mesh, sign =
   * one plane on the shared unsloth holo texture (the tagline cycle is
   * KIT._tagline's — the sign animates for free). +3 draw calls, zero
   * per-frame allocation. */
  _buildMonument() {
    const P = WORLD._pickMonument();
    if (!P) { WORLD.monument = null; return; }
    const θ = Math.atan2(-P.wx, -P.wz);              // face the plaza
    const T = (x, y, z) => new THREE.Matrix4().makeTranslation(x, y, z);
    const darkParts = [
      { geo: new THREE.BoxGeometry(5, 0.5, 5), matrix: T(0, 0.25, 0) },       // pedestal
      { geo: new THREE.BoxGeometry(3.4, 2.8, 3.2), matrix: T(0, 1.9, -0.2) }, // body
      { geo: new THREE.BoxGeometry(2.4, 2.2, 2.2), matrix: T(0, 4.4, 0.7) },  // head
      { geo: new THREE.BoxGeometry(0.8, 3.0, 0.8), matrix: T(-2.1, 2.0, 1.3) }, // arms
      { geo: new THREE.BoxGeometry(0.8, 3.0, 0.8), matrix: T(2.1, 2.0, 1.3) },
      { geo: new THREE.BoxGeometry(1.2, 0.8, 1.8), matrix: T(-1.1, 0.9, 1.6) }, // legs
      { geo: new THREE.BoxGeometry(1.2, 0.8, 1.8), matrix: T(1.1, 0.9, 1.6) },
      { geo: new THREE.BoxGeometry(0.6, 0.6, 1.0), matrix: T(0, 1.4, -1.9) }, // tail
      { geo: new THREE.BoxGeometry(0.35, 0.35, 0.12), matrix: T(-0.55, 4.85, 2.05) }, // eyes
      { geo: new THREE.BoxGeometry(0.35, 0.35, 0.12), matrix: T(0.55, 4.85, 2.05) },
      { geo: new THREE.BoxGeometry(0.35, 0.3, 0.12), matrix: T(0, 4.15, 2.03) }, // nose
    ];
    const neonParts = [
      { geo: new THREE.BoxGeometry(1.9, 1.7, 0.35), matrix: T(0, 4.5, 1.85) },  // face
      { geo: new THREE.BoxGeometry(1.6, 1.4, 0.25), matrix: T(0, 2.0, 1.42) },  // chest
      { geo: new THREE.BoxGeometry(5.2, 0.12, 5.2), matrix: T(0, 0.5, 0) },     // pedestal trim
    ];
    const darkGeo = mergeGeometries(darkParts); darkGeo.rotateY(θ);
    const neonGeo = mergeGeometries(neonParts); neonGeo.rotateY(θ);
    const g = new THREE.Group();
    g.position.set(P.wx, P.info.hTop, P.wz);
    const body = new THREE.Mesh(darkGeo, MATS.metalDark);
    const neonMat = new THREE.MeshBasicMaterial({
      color: CFG.kit.slothMonument.neon });
    const neon = new THREE.Mesh(neonGeo, neonMat);
    const sign = new THREE.Mesh(WORLD._detailAssets.signGeo, MATS.signMat.unsloth);
    sign.scale.set(8, 3, 1);
    sign.position.set(0, 7.2, 0);
    g.add(body, neon, sign);
    WORLD.root.add(g);

    /* M10.2: relaxed holo-sloth hologram — a billboard canvas sprite
     * (additive) hanging on the tower's antenna arm, above the sign.
     * Standalone child of WORLD.root (world space) so the monument group
     * keeps its 3 meshes; breathing is a per-frame sprite scale. */
    const H = CFG.kit.slothHolo;
    const holoMat = new THREE.SpriteMaterial({
      map: KIT.tex.slothHolo.tex, transparent: true,
      blending: THREE.AdditiveBlending, depthWrite: false,
    });
    const holo = new THREE.Sprite(holoMat);
    holo.scale.set(H.scale, H.scale * (176 / 140), 1);
    holo.position.set(P.wx, P.info.hTop + 13, P.wz);
    holo.name = 'sloth-holo';
    WORLD.root.add(holo);

    /* M10.2: sloth-themed maintenance drones — bigger, soft pink, extra
     * slow — patrolling the monument's street only (one avenue line).
     * Standalone InstancedMesh in world space (patrols in world coords). */
    const D = CFG.kit.slothDrone;
    const droneGeo = KIT.mergeGeometries([
      { geo: new THREE.BoxGeometry(1.0, 0.24, 1.0) },
      { geo: new THREE.BoxGeometry(0.44, 0.06, 0.44),
        matrix: new THREE.Matrix4().makeTranslation(0.55, 0.14, 0.55) },
      { geo: new THREE.BoxGeometry(0.44, 0.06, 0.44),
        matrix: new THREE.Matrix4().makeTranslation(-0.55, 0.14, 0.55) },
      { geo: new THREE.BoxGeometry(0.44, 0.06, 0.44),
        matrix: new THREE.Matrix4().makeTranslation(0.55, 0.14, -0.55) },
      { geo: new THREE.BoxGeometry(0.44, 0.06, 0.44),
        matrix: new THREE.Matrix4().makeTranslation(-0.55, 0.14, -0.55) },
      { geo: new THREE.BoxGeometry(0.3, 0.16, 0.3),
        matrix: new THREE.Matrix4().makeTranslation(0, -0.18, 0.3) },
    ]);
    const droneMesh = new THREE.InstancedMesh(
      droneGeo, new THREE.MeshBasicMaterial({ color: 0xffffff }), D.count);
    droneMesh.frustumCulled = false;
    droneMesh.count = 0;
    droneMesh.name = 'sloth-drones';
    WORLD.root.add(droneMesh);
    /* patrol line = the monument's avenue (same priority as the M10.1
     * street pose): m5(bz)∈{1,4} → runs along x at z; else runs along z
     * at x. Staggered start positions along the street. */
    const B = WORLD.BLOCK;
    const m5 = n => ((n % 5) + 5) % 5;
    let streetAxis, streetC;
    if (m5(P.bz) === 1) { streetC = (P.bz - 1 + 0.5) * B; streetAxis = 'x'; }
    else if (m5(P.bz) === 4) { streetC = (P.bz + 1 + 0.5) * B; streetAxis = 'x'; }
    else if (m5(P.bx) === 1) { streetC = (P.bx - 1 + 0.5) * B; streetAxis = 'z'; }
    else { streetC = (P.bx + 1 + 0.5) * B; streetAxis = 'z'; }
    const streetAlong = streetAxis === 'z' ? P.wz : P.wx;
    const EG = CFG.kit.slothEgg;
    const drones = [];
    for (let i = 0; i < D.count; i++) {
      const sgn = i % 2 ? 1 : -1;
      drones.push({
        axis: streetAxis,
        c: streetC,
        along: streetAlong + sgn * D.span * 0.4 * (i + 1),
        dir: sgn,
        speed: D.speed * (0.85 + 0.3 * ((i * 37) % 10) / 10),
        phase: i * 2.4,
        aMin: streetAlong - D.span,
        aMax: streetAlong + D.span,
        tint: new THREE.Color(D.color),
        /* M10.3: hover point — above the tower (near the holo),
         * staggered along the street, facing the plaza like the body */
        hoverX: streetAxis === 'z' ? P.wx + sgn * EG.hoverOff : P.wx,
        hoverY: P.info.hTop + EG.hoverAlt,
        hoverZ: streetAxis === 'z' ? P.wz : P.wz + sgn * EG.hoverOff,
        hoverYaw: θ,
      });
    }

    WORLD.monument = {
      g, body, neon, sign, neonMat,
      neonBase: new THREE.Color(CFG.kit.slothMonument.neon),
      bx: P.bx, bz: P.bz, x: P.wx, z: P.wz,
      hTop: P.info.hTop, w: P.info.w,
      /* M10.2: holo sloth + sloth drones (M10.3 hooks through these) */
      holo, holoMat,
      droneMesh, drones, streetAxis, streetC,
      /* M10.3: the awakening reaction state (driven from the
       * ENTITY.eggReact seam — see WORLD.wireEgg) */
      egg: { on: false, t0: 0, endT: 0, stretchT0: -1 },
    };
  },

  /* M10.3 — wire the monument's awakening reaction to the ENTITY.eggReact
   * seam. Called from boot AFTER all systems init (ENTITY._eggReact is
   * created in ENTITY.init, and WORLD boots before ENTITY): 'start' at
   * the beat-6 fire during AWAKE, 'end' at DORMANT entry. */
  wireEgg() {
    const m = WORLD.monument;
    if (!m) return;
    const e = m.egg;
    ENTITY.eggReact((ph, t) => {
      if (ph === 'start') { e.on = true; e.t0 = t; e.stretchT0 = t; }
      else { e.on = false; e.endT = t; }
    });
  },

  /* M10.1 — per-frame: billboard the UNSLOTH sign to the camera
   * (horizontal, like the M4 signs) + a slow neon pulse. */
  _updateMonument(dt, t) {
    const m = WORLD.monument;
    if (!m) return;
    const D = WORLD._monD;
    D.set(CAMERA.pos.x - m.x, 0, CAMERA.pos.z - m.z);
    if (D.lengthSq() > 1e-4) {
      D.normalize();
      m.sign.quaternion.setFromUnitVectors(WORLD._z4, D);
    }
    /* M10.3: the awakening reaction — eased level 0..1 (ramps in on
     * 'start' at the beat-6 fire, holds through AWAKE/DECAY, eases back
     * on 'end' at DORMANT entry). Sign flares, holo brightens + one slow
     * stretch, drones rise to hover nearby for the pulse. */
    const EG = CFG.kit.slothEgg;
    const e = m.egg;
    let lvl = 0;
    if (e.on) lvl = Math.min(1, (t - e.t0) / EG.ramp);
    else if (e.endT > 0) lvl = Math.max(0, 1 - (t - e.endT) / EG.settle);
    lvl = lvl * lvl * (3 - 2 * lvl);
    const k = (0.8 + 0.2 * Math.sin(t * 1.3)) * (1 + EG.signBoost * lvl);
    m.neonMat.color.copy(m.neonBase).multiplyScalar(k);
    /* sign flare — MATS.signMat.unsloth is monument-only (city/core are
     * clones), so the boost never leaks to the city signs */
    m.sign.material.color.setScalar(1 + EG.signBoost * 0.75 * lvl);

    /* M10.2: holo sloth — slow breathing (per-frame sprite scale) */
    const H = CFG.kit.slothHolo;
    const br = 1 + H.breathAmp * Math.sin(t * H.breath);
    /* M10.3: one slow stretch — one-shot from the 'start' fire */
    let stx = 1, sty = 1;
    if (e.stretchT0 >= 0) {
      const su = (t - e.stretchT0) / EG.stretchDur;
      if (su >= 0 && su < 1) {
        const s = Math.sin(Math.PI * su);
        sty = 1 + EG.stretchAmp * s;
        stx = 1 + 0.5 * EG.stretchAmp * s;
      }
    }
    m.holo.scale.set(H.scale * br * stx, H.scale * (176 / 140) * br * sty, 1);
    /* M10.3: the holo brightens (additive ⇒ color > 1 = brighter) */
    m.holoMat.color.setScalar(1 + EG.holoBoost * lvl);

    /* M10.2: sloth drones — patrol the monument's street only (one
     * avenue line); bounce at the span ends. Standalone (world space).
     * M10.3: they rise to hover nearby for the pulse (lerp to the
     * per-drone hover point; the patrol state keeps running so the
     * resume is seamless). */
    const SD = CFG.kit.slothDrone;
    const dm = m.droneMesh;
    for (let i = 0; i < m.drones.length; i++) {
      const d = m.drones[i];
      d.along += d.dir * d.speed * dt * (1 - lvl);
      if (d.along > d.aMax) { d.along = d.aMax; d.dir = -1; }
      else if (d.along < d.aMin) { d.along = d.aMin; d.dir = 1; }
      const bob = SD.bobAmp * Math.sin(t * SD.bob + d.phase);
      const px = d.axis === 'z' ? d.c : d.along;
      const pz = d.axis === 'z' ? d.along : d.c;
      const py = SD.altitude + bob;
      const yaw = d.axis === 'z'
        ? (d.dir > 0 ? 0 : Math.PI)
        : (d.dir > 0 ? Math.PI / 2 : -Math.PI / 2);
      /* M10.3: rise to hover nearby for the pulse */
      const hx = px + (d.hoverX - px) * lvl;
      const hy = py + (d.hoverY - py) * lvl;
      const hz = pz + (d.hoverZ - pz) * lvl;
      WORLD._slothQ.setFromAxisAngle(WORLD._slothY, yaw);
      WORLD._slothQ2.setFromAxisAngle(WORLD._slothY, d.hoverYaw);
      WORLD._slothQ.slerp(WORLD._slothQ2, lvl);
      WORLD._slothP.set(hx, hy, hz);
      WORLD._slothS.set(SD.size, SD.size, SD.size);
      WORLD._slothM.compose(WORLD._slothP, WORLD._slothQ, WORLD._slothS);
      dm.setMatrixAt(i, WORLD._slothM);
      dm.setColorAt(i, d.tint);
    }
    dm.count = m.drones.length;
    if (dm.count > 0) {
      dm.instanceMatrix.needsUpdate = true;
      if (dm.instanceColor) dm.instanceColor.needsUpdate = true;
    }
  },

  /* (re)build the keep-set around the player, retire the rest */
  _sync() {
    const keep = new Set();
    for (let dx = -WORLD.RADIUS; dx <= WORLD.RADIUS; dx++) {
      for (let dz = -WORLD.RADIUS; dz <= WORLD.RADIUS; dz++) {
        const cx = WORLD._pcx + dx, cz = WORLD._pcz + dz;
        const key = cx + ',' + cz;
        keep.add(key);
        const ring = Math.max(Math.abs(dx), Math.abs(dz));
        const have = WORLD.chunks.get(key);
        if (!have) WORLD._spawnChunk(cx, cz, ring);
        else if (have.ring !== ring) WORLD._fill(have, ring);   // LOD change
      }
    }
    for (const [key, ch] of WORLD.chunks) {
      if (keep.has(key)) continue;
      WORLD.chunks.delete(key);
      ch.boxA.count = 0; ch.boxG.count = 0; ch.cyl.count = 0;
      ch.boxA.mesh.count = 0; ch.boxG.mesh.count = 0; ch.cyl.mesh.count = 0;
      ch.fan.reset(); ch.dish.reset(); ch.pulse.reset();
      ch.sign.reset(); ch.ledWin.reset();
      ch.group.visible = false;
      WORLD._pool.push(ch);           // buffers reused, never disposed
    }
    WORLD._countStats();
  },

  /* M4: pooled detail InstancedMesh (capacity up front; reset on recycle).
   * col=true pre-allocates instanceColor at capacity so per-frame
   * setColorAt never grows the buffer (three sizes it from mesh.count). */
  _detailMesh(geo, mat, cap, col = false) {
    const B = makeInstanced(geo, mat, cap);
    B.pars = new Array(cap);
    if (col) {
      B.mesh.instanceColor = new THREE.InstancedBufferAttribute(
        new Float32Array(cap * 3).fill(1), 3);
    }
    B.reset = () => {
      B.count = 0; B.mesh.count = 0; B.mesh.visible = false;
      if (col && B.mesh.instanceColor) B.mesh.instanceColor.needsUpdate = true;
    };
    return B;
  },

  _spawnChunk(cx, cz, ring) {
    let ch = WORLD._pool.pop();
    if (!ch) {
      const D = WORLD._detailAssets;
      ch = {
        cx: 0, cz: 0, ring: 0,
        group: new THREE.Group(),
        boxA: KIT.InstancedBox(1000, [1, 1, 1], MATS.metalDark),
        boxG: KIT.InstancedBox(600, [1, 1, 1], MATS.server),
        cyl: KIT.InstancedCylinder(240, 0.5, 0.5, 1, 10, MATS.metalDark),
        /* M4 near-layer detail (near-ring chunks only; capped, pooled, and
         * frustum-culled like the mass meshes — zero per-frame allocation) */
        fan:   WORLD._detailMesh(D.fanGeo, MATS.metalDark, D.fanCap),
        dish:  WORLD._detailMesh(D.dishGeo, MATS.metalDark, D.dishCap),
        pulse: WORLD._detailMesh(D.pulseGeo, MATS.pulseGlow, D.pulseCap, true),
        /* M9.4: sign + ledWin carry a pre-allocated instanceColor so the
         * awakening wave can ramp per-instance brightness (1.0 = idle,
         * restored EXACTLY at wave end / DORMANT entry) */
        sign:  WORLD._detailMesh(D.signGeo, MATS.signMat.qwen, D.signCap, true),
        ledWin: WORLD._detailMesh(D.ledGeo, D.ledMats.a, D.ledCap, true),
      };
    }
    ch.cx = cx; ch.cz = cz;
    /* the five detail meshes ride in the chunk group too — without this
     * they are filled/animated but never rendered (M4 latent bug; the
     * M9.4 awakening wave ramps sign/ledWin instance colors, which is
     * only visible once the meshes are in the scene graph) */
    ch.group.add(ch.boxA.mesh, ch.boxG.mesh, ch.cyl.mesh,
      ch.fan.mesh, ch.dish.mesh, ch.pulse.mesh, ch.sign.mesh,
      ch.ledWin.mesh);
    WORLD.root.add(ch.group);
    WORLD.chunks.set(cx + ',' + cz, ch);
    WORLD._fill(ch, ring);
  },

  /* refill one chunk from its block seeds — pure function of (cx, cz, ring).
   * M4: near rings also get the per-archetype detail pass, then one
   * chunk-level pass (pipes) runs after the block loop. */
  _fill(ch, ring) {
    const K = WORLD.CHUNK, B = WORLD.BLOCK;
    ch.cx = Math.round(ch.cx); ch.cz = Math.round(ch.cz);
    ch.ring = ring;
    ch.boxA.count = 0; ch.boxG.count = 0; ch.cyl.count = 0;
    ch.fan.reset(); ch.dish.reset(); ch.pulse.reset();
    ch.sign.reset(); ch.ledWin.reset();
    ch.group.visible = true;
    const bx0 = ch.cx * K, bz0 = ch.cz * K;
    const lvl = ring >= 2 ? 0 : ring === 1 ? 1 : 2;
    const ledMats = WORLD._detailAssets.ledMats;
    const signMats = WORLD._detailAssets.signMats;
    /* chunk texture picks — deterministic from (cx, cz): every building in
     * the chunk shares them, so each detail mesh stays one draw call */
    const key = ((ch.cx * 73856093) ^ (ch.cz * 19349663)) >>> 0;
    ch.ledWin.mesh.material = ledMats[(key & 1) ? 'b' : 'a'];
    const signName = ['qwen', 'unsloth', 'city', 'core'][key & 3];
    ch.sign.mesh.material = signMats[signName];
    WORLD._nLed = 0; WORLD._nSign = 0; WORLD._nDash = 0;
    WORLD._cool = null;
    ch._ledCands = [];
    for (let i = 0; i < K; i++) {
      const bx = bx0 + i;
      for (let j = 0; j < K; j++) {
        const bz = bz0 + j;
        if (WORLD._skipBlock(bx, bz)) continue;
        const rng = mulberry32(WORLD._seedFor(bx, bz));
        if (rng() >= CFG.city.occupancy[ring]) continue;         // vacant lot
        const wx = (bx + 0.5) * B, wz = (bz + 0.5) * B;
        const dist = Math.hypot(wx, wz);
        const zone = dist < 220 ? 'core' : dist < 520 ? 'mid' : 'outer';
        const fall = 0.35 + 0.65 * Math.exp(-dist * 0.0045);   // height falloff
        const arch = WORLD._pick(rng, zone);
        const A = CFG.city.archetypes[arch];
        const info = WORLD._mass(rng, ch, arch, A, wx, wz, fall, ring);
        if (lvl > 0) {
          /* per-building salt = the block seed itself: neighbours differ */
          const salt = (WORLD._seedFor(bx, bz) ^ 0x9E3779B9) >>> 0;
          WORLD._detail(ch, rng, info, lvl, salt);
          if (arch === 'cool') {
            if (!WORLD._cool) WORLD._cool = [];
            WORLD._cool.push(wx, info.h * 0.35, wz, info.r);
          }
        }
      }
    }
    if (lvl === 2 && WORLD._cool && WORLD._cool.length >= 8) {
      WORLD._coolPipes(ch, mulberry32(key ^ 0x7F4A1D2E));
    }
    if (ch._ledCands && ch._ledCands.length) {
      WORLD._ledPass(ch);
    }
    /* M9.4: a (re)filled chunk's LED/sign instance colors start at
     * exactly 1.0 (idle) — a pooled chunk may carry stale per-slot
     * values from a previous fill; an active wave overwrites per-frame
     * from its own front. */
    for (const b of [ch.sign, ch.ledWin]) {
      if (b.count === 0 || !b.mesh.instanceColor) continue;
      const a = b.mesh.instanceColor.array;
      for (let i = 0; i < b.count * 3; i++) a[i] = 1;
    }
    for (const b of [ch.boxA, ch.boxG, ch.cyl,
      ch.fan, ch.dish, ch.pulse, ch.sign, ch.ledWin]) {
      b.commit();
      if (b.count > 0) {
        b.mesh.computeBoundingSphere();   // InstancedMesh-aware bounds
        b.mesh.frustumCulled = true;       // cull whole chunks off-screen
        b.mesh.visible = true;
        if (b === ch.pulse) {
          /* dashes travel far up the spires: grow the culling sphere so a
           * visible spire never makes the dash mesh pop out of existence */
          for (let i = 0; i < b.count; i++) {
            const p = b.pars[i];
            if (p.k !== 3) continue;
            WORLD._p4.set(p.x, p.hi, p.z);
            if (!b.mesh.boundingSphere.containsPoint(WORLD._p4)) {
              b.mesh.boundingSphere.expandByPoint(WORLD._p4);
            }
          }
        }
      } else {
        b.mesh.visible = false;
      }
    }
  },

  /* dev/smoke seam: rebuild one chunk in place (determinism check) */
  regen(key) {
    const ch = WORLD.chunks.get(key);
    if (ch) WORLD._fill(ch, ch.ring);
  },

  _pick(rng, zone) {
    const A = CFG.city.archetypes;
    let total = 0;
    for (const k in A) total += A[k].weights[zone];
    let r = rng() * total;
    for (const k in A) {
      r -= A[k].weights[zone];
      if (r < 0) return k;
    }
    return 'server';
  },

  /* building mass (far layer) + building record (M4 detail pass). The mass
   * consumes the same seeded rng; the record hands the exact dims back so
   * the detail pass lands on the mass, deterministically. */
  _mass(rng, ch, arch, A, x, z, fall, ring) {
    const far = ring >= 2;
    const tint = far ? WORLD._farTint[arch] : _tintShade(A.tint, 0.85 + rng() * 0.3);
    const box = A.glow ? ch.boxG : ch.boxA;
    const R = (a, b) => a + rng() * (b - a);
    const info = { arch, x, z, h: 0, w: 6, r: 4, tint };

    if (far) {
      /* silhouette ring: one hazed box per building, archetype-sized */
      const dims = {
        server:  [R(10, 14), R(22, 50) * fall],
        rack:    [R(16, 20), R(3, 6)],
        cool:    [R(9, 14), R(6, 12)],
        sub:     [R(10, 13), R(2.5, 4)],
        antenna: [R(5, 7), R(6, 10)],
        fiber:   [R(4.5, 6), R(38, 68) * fall],
        holo:    [R(5, 6.5), R(18, 30) * (0.6 + 0.4 * fall)],
        housing: [R(11, 14), R(7, 15) * (0.7 + 0.3 * fall)],
      }[arch];
      box.add(x, dims[1] / 2, z, [dims[0], dims[1], dims[0]], tint);
      info.w = dims[0]; info.h = dims[1]; info.hTop = dims[1];
      return info;
    }

    switch (arch) {
    case 'server': {
      const w = R(9, 14), h = R(22, 52) * fall;
      box.add(x, h / 2, z, [w, h, w], tint);
      const u = h * 0.18;
      box.add(x, h + u / 2, z, [w * 0.62, u, w * 0.62], _tintShade(tint, 1.15));
      info.w = w; info.h = h; info.hTop = h + u;   // crown top (M6.2 docks)
      break;
    }
    case 'rack': {
      const w = R(15, 21), h = R(3, 6);
      box.add(x, h / 2, z, [w, h, w * 0.72], tint);
      const a = R(4, 6);
      box.add(x + w * 0.35, a * 0.25, z + w * 0.2, [a, a * 0.5, a],
        _tintShade(tint, 0.8));
      info.w = w; info.h = h; info.hTop = h;
      break;
    }
    case 'cool': {
      const r = R(4.5, 7), h = R(6, 13);
      ch.cyl.add(x, h / 2, z, [r * 2, h, r * 2], tint);
      ch.cyl.add(x, h + 0.9, z, [r * 1.2, 1.8, r * 1.2], _tintShade(tint, 1.1));
      info.r = r; info.h = h; info.hTop = h + 1.8;
      break;
    }
    case 'sub': {
      const w = R(10, 13), h = R(2.5, 4);
      box.add(x, h / 2, z, [w, h, w * 0.7], tint);
      ch.cyl.add(x - w * 0.3, h + 0.8, z, [0.7, 1.6, 0.7], _tintShade(tint, 1.2));
      ch.cyl.add(x + w * 0.3, h + 0.8, z, [0.7, 1.6, 0.7], _tintShade(tint, 1.2));
      info.w = w; info.h = h; info.hTop = h + 1.6;
      break;
    }
    case 'antenna': {
      const w = R(5, 7), h = R(2.5, 4);
      box.add(x, h / 2, z, [w, h, w], tint);
      const mh = R(12, 22);
      ch.cyl.add(x, h + mh / 2, z, [0.8, mh, 0.8], _tintShade(tint, 1.1));
      info.w = w; info.h = h + mh;   // h = mast tip (beacons/dishes mount here)
      info.hTop = h + mh;
      break;
    }
    case 'fiber': {
      const h = R(38, 68) * fall, w = R(4.5, 6);
      box.add(x, h / 2, z, [w, h, w], tint);
      box.add(x, h + 1, z, [w * 0.5, 2, w * 0.5], _tintShade(tint, 1.3));
      info.w = w; info.h = h; info.hTop = h + 2;
      break;
    }
    case 'holo': {
      const h = R(18, 30) * (0.6 + 0.4 * fall);
      box.add(x, h / 2, z, [5, h, 5], tint);
      box.add(x, h + 1.5, z, [6.5, 3, 6.5], _tintShade(tint, 1.2));  // pad (M4 sign)
      info.w = 5; info.h = h + 3; info.hTop = h + 3;
      break;
    }
    case 'housing': {
      const w = R(11, 14), h = R(7, 15) * (0.7 + 0.3 * fall);
      box.add(x, h / 2, z, [w, h, w * 0.85], tint);
      info.w = w; info.h = h; info.hTop = h;
      break;
    }
    }
    return info;
  },

  /* ==================================================================
   * M4 — near-layer detail passes (per-archetype, seeded per-building)
   * ------------------------------------------------------------------
   *  - ring 0 = full pass, ring 1 = light pass, ring 2 stays silhouette
   *  - animated parts live in five per-chunk pooled InstancedMeshes
   *    (fan / dish / pulse / sign / ledWin); everything static lands in
   *    the existing mass meshes, so a chunk still costs a few calls only
   *  - per-building variation: salt = the block seed (see _fill) — two
   *    neighbours can never get the same salt, so details never repeat
   *  - distant haze stays the M3 grade: FogExp2 + per-chunk far-ring
   *    tint pre-lerped toward CFG.city.haze
   * ================================================================== */

  _detail(ch, rng, info, lvl, salt) {
    const { arch, x, z, h, w, r, tint } = info;
    const R = (a, b) => a + rng() * (b - a);
    const pulseSlot = () =>
      ch.pulse.count < ch.pulse.capacity ? ch.pulse.count : -1;
    switch (arch) {
    case 'server':
    case 'rack': {
      /* front door + cable trays + roof vents (full pass) */
      if (lvl === 2) {
        const side = salt & 3, dw = Math.min(3, w * 0.3);
        const ox = side < 2 ? 1 : -1, oz = side < 2 ? 0 : 1;
        ch.boxA.add(x + ox * (w / 2 + 0.08), 1.35, z + oz * (w * 0.72 / 2 + 0.08),
          [ox ? dw : 0.25, 2.7, oz ? dw : 0.25], 0x0a101d);
        /* cable trays: two low rails along one wall */
        const ax = oz ? 1 : 0, az = oz ? 0 : 1;
        const L = w * 0.8;
        ch.boxA.add(x + ax * (w / 2 + 0.3), 0.5, z + az * (w * 0.4),
          [ax ? 0.4 : L, 0.3, az ? 0.4 : L], 0x141a26);
        ch.boxA.add(x + ax * (w / 2 + 0.3), 1.25, z + az * (w * 0.4),
          [ax ? 0.4 : L, 0.3, az ? 0.4 : L], 0x141a26);
        /* roof vents (2–4 boxes, seeded layout) */
        const nv = 2 + ((salt >> 3) & 3);
        for (let i = 0; i < nv; i++) {
          const vx = ((Math.sin(salt * 0.13 + i * 2.1) * 43758.5453) % 1) * w * 0.6 - w * 0.3;
          const vz = ((Math.sin(salt * 0.29 + i * 4.7) * 43758.5453) % 1) * w * 0.6 - w * 0.3;
          const vs = R(0.8, 1.6);
          ch.boxA.add(x + vx, h + 0.35, z + vz, [vs, 0.7, vs], _tintShade(tint, 0.7));
        }
      }
      /* LED windows on all four facades (near + full rings; shared textures
       * animate from the KIT, so the faces stay alive without new calls).
       * Long faces always, short faces seeded — so from any walking angle
       * at least one lit facade is on the building. */
      /* LED-window candidate — actual placement happens in _ledPass after
       * the block loop, so the per-chunk budget spreads fairly: every
       * server/rack gets one seeded facade before any gets a second. */
      if (h > 3) (ch._ledCands = ch._ledCands || []).push({ info, salt });
      break;
    }
    case 'cool': {
      /* big animated fan: shared rotating instanced blades (one instance
       * per tower; steam vents arrive with the M6/M7 particle pool) */
      if (ch.fan.count < ch.fan.capacity) {
        const slot = ch.fan.count;
        ch.fan.add(x, h + 0.5, z, r * 0.46, 0xb8c8e8);
        ch.fan.pars[slot] = {
          x, y: h + 0.5, z, s: r * 0.46,
          sp: R(2.2, 4.5) * (rng() < 0.5 ? 1 : -1),
          ph: rng() * 6.28,
        };
      }
      break;
    }
    case 'sub': {
      /* transformer boxes + insulators (full pass) + spark points */
      if (lvl === 2) {
        const n = 2 + ((salt >> 4) & 2);
        for (let i = 0; i < n; i++) {
          const tx = x + ((i - (n - 1) / 2) * w * 0.5),
                ts = R(1.4, 2.2);
          ch.boxA.add(tx, h + ts / 2, z, [ts, ts, ts * 0.8], _tintShade(tint, 0.75));
          ch.cyl.add(tx - ts * 0.25, h + ts + 0.3, z, [0.22, 0.6, 0.22], 0xd8e8ff);
          ch.cyl.add(tx + ts * 0.25, h + ts + 0.3, z, [0.22, 0.6, 0.22], 0xd8e8ff);
        }
      }
      /* spark points: brief additive bursts at the bushings */
      const sp0 = pulseSlot();
      if (sp0 >= 0) {
        ch.pulse.add(x - w * 0.3, h + 0.5, z, 0.5);
        ch.pulse.pars[sp0] = {
          k: 2, x: x - w * 0.3, y: h + 0.5, z, sc: 0.5,
          ph: rng() * 6.28, f: R(0.25, 0.6),
        };
      }
      break;
    }
    case 'antenna': {
      /* mast tip: blinking beacon (near + full) + slow-scanning dish (full) */
      const tipY = h;
      const b0 = pulseSlot();
      if (b0 >= 0) {
        ch.pulse.add(x, tipY + 0.6, z, 0.7);
        ch.pulse.pars[b0] = {
          k: 1, x, y: tipY + 0.6, z, sc: 0.7,
          ph: rng() * 6.28, f: R(1.2, 2.5),
        };
      }
      if (lvl === 2 && ch.dish.count < ch.dish.capacity) {
        const slot = ch.dish.count;
        const dy = h - R(2, 6);
        ch.dish.add(x, dy, z, 2.0, 0xa8b8d8);
        ch.dish.pars[slot] = {
          x, y: dy, z, s: 1.3,
          base: rng() * 6.28, amp: R(0.7, 1.5), sp: R(0.08, 0.22), ph: rng() * 6.28,
        };
      }
      break;
    }
    case 'fiber': {
      /* glowing conduit bands (static emissive) + traveling light dashes */
      const bandH = Math.min(10, h * 0.4);
      ch.boxG.add(x, h * 0.35, z, [w + 0.5, bandH, 0.5], 0x59e0ff);
      ch.boxG.add(x, h * 0.62, z, [0.5, bandH, w + 0.5], 0x59e0ff);
      const d0 = pulseSlot();
      if (d0 >= 0 && WORLD._nDash < CFG.detail.dashPerChunk) {
        WORLD._nDash++;
        ch.pulse.add(x, 1, z, [0.55, 4, 0.55]);
        ch.pulse.pars[d0] = {
          k: 3, x, y: 1, z, s: [0.55, 4, 0.55],
          lo: 1, hi: h + 3,
          sp: R(8, 14), ph: rng(),
        };
      }
      break;
    }
    case 'holo': {
      /* animated canvas face + additive billboard (one per chunk) */
      if (WORLD._nSign < CFG.detail.signPerChunk &&
        ch.sign.count < ch.sign.capacity) {
        const slot = ch.sign.count;
        const sy = h + 5;
        const s = R(6, 10);
        ch.sign.add(x, sy, z, [s, s * 0.375, 1]);
        /* M9.4: d = distance from the plaza (wave scheduling) */
        ch.sign.pars[slot] = { x, y: sy, z, s: [s, s * 0.375, 1],
          d: Math.hypot(x, z) };
        WORLD._nSign++;
      }
      break;
    }
    case 'housing': {
      /* dim emissive window band (reads as data housing at range) */
      if (lvl === 2) {
        ch.boxG.add(x, 1.2, z, [w * 0.9, 0.6, w * 0.72], 0x3a2f1e);
      }
      break;
    }
    }
  },

  /* fair LED-window placement (near rings): pass 1 gives one seeded
   * facade to every candidate building; pass 2 (while budget remains)
   * gives a second, opposite-ish facade. Seeded face ⇒ procedural
   * variety with no two neighbours sharing a facade pattern. */
  _ledPass(ch) {
    const cands = ch._ledCands;
    cands.sort((a, b) => (a.salt - b.salt) | 0);
    const cap = CFG.detail.ledPerChunk;
    const room = () =>
      WORLD._nLed < cap && ch.ledWin.count < ch.ledWin.capacity;
    let i = 0;
    while (i < cands.length && room()) {
      WORLD._ledFace(ch, cands[i++], cands[i - 1].salt & 3);
    }
    i = 0;
    while (i < cands.length && room()) {
      const c = cands[i++];
      const f2 = (c.salt >> 3) & 3;
      WORLD._ledFace(ch, c, f2 === (c.salt & 3) ? (f2 + 2) & 3 : f2);
    }
    ch._ledCands = null;
  },

  _ledFace(ch, c, face) {
    const { x, z, h, w } = c.info;
    const cw = w * 0.8, chh = Math.min(h * 0.6, 12);
    const off = w / 2 + 0.06, y = 1.5 + chh / 2;
    /* facade outward normal (matches the rotY above) — the smoke
     * visual gate uses it to anchor the region on a camera-facing
     * facade */
    const nx = face === 2 ? 1 : face === 3 ? -1 : 0,
      nz = face === 0 ? 1 : face === 1 ? -1 : 0;
    if (face === 0) ch.ledWin.add(x, y, z + off, [cw, chh, 1]);
    else if (face === 1) ch.ledWin.add(x, y, z - off, [cw, chh, 1], null, Math.PI);
    else if (face === 2) ch.ledWin.add(x + off, y, z, [1, chh, cw], null, Math.PI / 2);
    else ch.ledWin.add(x - off, y, z, [1, chh, cw], null, -Math.PI / 2);
    /* M9.4: the awakening wave schedules this facade by its distance
     * from the plaza (precomputed at fill — zero per-frame cost).
     * fx/fz = the facade's own world position (the mesh sits `off`
     * along the face normal from the building center) — the smoke
     * visual gate anchors its region there */
    ch.ledWin.pars[ch.ledWin.count - 1] =
      { x, y, z, d: Math.hypot(x, z), nx, nz,
        fx: x + nx * off, fz: z + nz * off };
    WORLD._nLed++;
  },

  /* pipes between cooling towers (full pass, in-chunk clusters) */
  _coolPipes(ch, rng) {
    const arr = WORLD._cool;
    const n = arr.length / 4;
    if (n < 2) return;
    for (let i = 0; i < n; i++) {
      const ax = arr[i * 4], ay = arr[i * 4 + 1], az = arr[i * 4 + 2], ar = arr[i * 4 + 3];
      let bi = -1, bd = 1e9;
      for (let j = 0; j < n; j++) {
        if (j === i) continue;
        const d = (arr[j * 4] - ax) * (arr[j * 4] - ax) + (arr[j * 4 + 2] - az) * (arr[j * 4 + 2] - az);
        if (d < bd) { bd = d; bi = j; }
      }
      if (bi < 0 || bd > 80 * 80) continue;   // only link nearby towers
      const bx2 = arr[bi * 4], bz2 = arr[bi * 4 + 2];
      const dx = bx2 - ax, dz = bz2 - az;
      const len = Math.hypot(dx, dz);
      if (len < 1) continue;
      /* box length is local +X; rotY θ sends +X → (cosθ, 0, −sinθ),
       * so θ must be −atan2(dz, dx) to point A → B */
      const th = -Math.atan2(dz, dx);
      const y = ay * 0.8 + 1;
      ch.boxA.add((ax + bx2) / 2, y, (az + bz2) / 2, [len * 0.9, 0.35, 0.5],
        0x37455e, th);
      ch.boxA.add((ax + bx2) / 2, y + 0.3, (az + bz2) / 2, [len * 0.9, 0.15, 0.2],
        0x37455e, th);
    }
  },

  /* per-frame animation of the five detail meshes (near-ring chunks only).
   * Runs after _sync, so every visible detail chunk is in the keep-set;
   * culled/empty meshes cost nothing (count = 0 ⇒ mesh invisible). */
  _updateDetail(t) {
    const camP = camera.position;
    const M = WORLD._m4, P = WORLD._p4, Q = WORLD._q4, S = WORLD._s4,
      Y = WORLD._y4, C = WORLD._c4, D = WORLD._camDir4;
    /* M9.4 beat 4: the city wave (null = inactive ⇒ zero cost) */
    const wv = WORLD._waveActive ? CFG.entity.beats.cascade.wave : null;
    let waveMaxD = 0;
    for (const ch of WORLD.chunks.values()) {
      if (!ch.group.visible) continue;
      /* fans: shared rotating blades (constant per-fan speed/phase) */
      const fan = ch.fan;
      if (fan.count > 0) {
        for (let i = 0; i < fan.count; i++) {
          const p = fan.pars[i];
          P.set(p.x, p.y, p.z);
          Q.setFromAxisAngle(Y, p.ph + t * p.sp);
          S.set(p.s, p.s, p.s);
          M.compose(P, Q, S);
          fan.mesh.setMatrixAt(i, M);
        }
        fan.mesh.instanceMatrix.needsUpdate = true;
      }
      /* dishes: slow scanning sweep around a seeded base heading */
      const dish = ch.dish;
      if (dish.count > 0) {
        for (let i = 0; i < dish.count; i++) {
          const p = dish.pars[i];
          P.set(p.x, p.y, p.z);
          Q.setFromAxisAngle(Y, p.base + p.amp * Math.sin(t * p.sp + p.ph));
          S.set(p.s, p.s, p.s);
          M.compose(P, Q, S);
          dish.mesh.setMatrixAt(i, M);
        }
        dish.mesh.instanceMatrix.needsUpdate = true;
      }
      /* pulses: beacons (k=1) / sparks (k=2) / fiber dashes (k=3) */
      const pulse = ch.pulse;
      if (pulse.count > 0) {
        for (let i = 0; i < pulse.count; i++) {
          const p = pulse.pars[i];
          if (p.k === 3) {
            /* light traveling in the conduit: loops up the spire */
            P.set(p.x, p.lo + (p.hi - p.lo) * ((t * (p.sp / 60) + p.ph) % 1), p.z);
            Q.identity();
            S.set(p.s[0], p.s[1], p.s[2]);
            M.compose(P, Q, S);
            pulse.mesh.setMatrixAt(i, M);
            C.set(0.35, 0.95, 1).multiplyScalar(0.8);
            pulse.mesh.setColorAt(i, C);
          } else {
            P.set(p.x, p.y, p.z);
            Q.identity();
            let I;
            if (p.k === 1) {
              /* beacon: slow breathing pulse (amber/white by salt) */
              I = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * (0.6 * p.f) + p.ph));
              C.set(p.ph < 3.14 ? 1 : 0.9, 0.85, 0.55).multiplyScalar(I);
            } else {
              /* spark: brief bursts, ~1 on every few seconds */
              I = Math.max(0, Math.sin(t * (2.5 * p.f) + p.ph));
              I = Math.pow(I, 12) * 1.6;
              C.set(0.75, 0.9, 1).multiplyScalar(I);
            }
            S.set(p.sc * (1 + I * 0.3), p.sc * (1 + I * 0.3), p.sc * (1 + I * 0.3));
            M.compose(P, Q, S);
            pulse.mesh.setMatrixAt(i, M);
            pulse.mesh.setColorAt(i, C);
          }
        }
        pulse.mesh.instanceMatrix.needsUpdate = true;
        if (pulse.mesh.instanceColor) pulse.mesh.instanceColor.needsUpdate = true;
      }
      /* holo-sign billboards: face the camera, one shared texture each */
      const sign = ch.sign;
      const ledWin = ch.ledWin;
      if (sign.count > 0) {
        for (let i = 0; i < sign.count; i++) {
          const p = sign.pars[i];
          P.set(p.x, p.y, p.z);
          D.copy(camP).sub(P); D.y = 0;
          if (D.lengthSq() > 1e-4) D.normalize();
          Q.setFromUnitVectors(WORLD._z4, D);
          S.set(p.s[0], p.s[1], 1);
          M.compose(P, Q, S);
          sign.mesh.setMatrixAt(i, M);
        }
        sign.mesh.instanceMatrix.needsUpdate = true;
      }
      /* ledWin: static — the shared LED textures animate (KIT redraws);
       * M9.4 beat 4: while the awakening wave is in flight, the sign +
       * LED-facade instance colors ramp as the front crosses them —
       * scheduled by distance from the plaza, so each city ring lights
       * up as the wave arrives (1.0 = idle, restored EXACTLY). */
      if (wv) {
        const r = (t - WORLD._waveT0) * wv.speed;
        const atk = wv.width / wv.speed;
        const ic = ledWin.mesh.instanceColor.array;
        for (let i = 0; i < ledWin.count; i++) {
          const p = ledWin.pars[i];
          if (p.d > waveMaxD) waveMaxD = p.d;
          const b = 1 + (wv.bright - 1) * _waveEnv(
            (r - p.d) / wv.speed, atk, wv.hold, wv.release);
          const i3 = i * 3;
          ic[i3] = b; ic[i3 + 1] = b; ic[i3 + 2] = b;
        }
        ledWin.mesh.instanceColor.needsUpdate = true;
        const sic = sign.mesh.instanceColor.array;
        for (let i = 0; i < sign.count; i++) {
          const p = sign.pars[i];
          if (p.d > waveMaxD) waveMaxD = p.d;
          const b = 1 + (wv.bright - 1) * _waveEnv(
            (r - p.d) / wv.speed, atk, wv.hold, wv.release);
          const i3 = i * 3;
          sic[i3] = b; sic[i3 + 1] = b; sic[i3 + 2] = b;
        }
        sign.mesh.instanceColor.needsUpdate = true;
      }
    }
    /* M9.4: the wave is complete once its front + release have passed
     * every visible instance ⇒ restore all colors to exactly 1.0 */
    if (wv && (t - WORLD._waveT0) * wv.speed - waveMaxD >
        wv.width + wv.speed * (wv.hold + wv.release)) {
      WORLD._waveActive = false;
      WORLD._waveRestore();
    }
  },

  _countStats() {
    let inst = 0;
    const ring = [0, 0, 0];
    for (const ch of WORLD.chunks.values()) {
      inst += ch.boxA.count + ch.boxG.count + ch.cyl.count
        + ch.fan.count + ch.dish.count + ch.pulse.count
        + ch.sign.count + ch.ledWin.count;
      if (ch.ring <= 2) ring[ch.ring]++;
    }
    WORLD.stats.chunks = WORLD.chunks.size;
    WORLD.stats.instances = inst;
    WORLD.stats.ring = ring;
    WORLD.stats.meters = (2 * WORLD.RADIUS + 1) * WORLD.CHUNK * WORLD.BLOCK;
  },

};

/* ==================================================================== *
 * POOL — generic fixed-capacity object pools (M6.1)
 *
 *  - every pool's items are created exactly once, in make() — the only
 *    allocation the pool ever performs. acquire()/release() move
 *    references on a pre-allocated free stack (swap-pop / swap-push):
 *    zero `new` and zero array growth for the life of the pool.
 *  - acquire() returns null when the pool is drained (cap hit): emitters
 *    skip this spawn and poll acquire() again next frame — the cap is
 *    enforced structurally, never by a throw.
 *  - release() is idempotent per item (a __free flag guards the stack):
 *    double-releases and wrong-pool releases are counted, never corrupt.
 *  - every pool registers in POOL.list so M6.5 (tier caps), the M14.2
 *    HUD and the smoke harness can read live capacity/use at any time.
 *  - consumers must re-init every field of an item on acquire — released
 *    items keep their last values (no hidden reset cost).
 * --------------------------------------------------------------------- */
const POOL = {
  list: [],   // every pool ever made (M6.5 / M14.2 / smoke read this)

  /** make(name, capacity, makeItem) -> pool.
   *  makeItem(i) runs exactly capacity times, right here. */
  make(name, capacity, makeItem) {
    const stack = new Array(capacity);
    const pool = {
      name,
      capacity,
      top: capacity,    // free items on the stack (0..capacity)
      peak: 0,          // highest simultaneous in-use count
      acquires: 0,      // successful lifetime acquires
      releases: 0,      // successful lifetime releases
      exhausted: 0,     // acquires that found the pool empty (cap hits)
      badReleases: 0,   // double / foreign releases (ignored, counted)
      stack,
      acquire: null,
      release: null,
    };
    for (let i = 0; i < capacity; i++) {
      const it = makeItem(i);
      it.__free = true;
      it.__pool = pool;   // back-ref: release() rejects foreign items
      stack[i] = it;
    }
    pool.acquire = function acquire() {
      const n = pool.top;
      if (n === 0) {
        pool.exhausted++;
        return null;               // cap hit — caller skips the spawn
      }
      const item = stack[n - 1];
      stack[n - 1] = undefined;
      pool.top = n - 1;
      pool.acquires++;
      const used = capacity - pool.top;
      if (used > pool.peak) pool.peak = used;
      item.__free = false;
      return item;
    };
    pool.release = function release(item) {
      if (!item || item.__pool !== pool || item.__free) {
        // foreign item, or double release — counted, never pushed
        pool.badReleases++;
        return;
      }
      const n = pool.top;
      stack[n] = item;
      pool.top = n + 1;
      pool.releases++;
      item.__free = true;
    };
    POOL.list.push(pool);
    return pool;
  },

  /** Aggregate pool stats — HUD (M14.2) and tier-cap scaling (M6.5). */
  stats() {
    const s = { pools: POOL.list.length, capacity: 0, inUse: 0, peak: 0 };
    for (const p of POOL.list) {
      s.capacity += p.capacity;
      s.inUse += p.capacity - p.top;
      if (p.peak > s.peak) s.peak = p.peak;
    }
    return s;
  },
};

/* ==================================================================== *
 * TRAFFIC — drones & sky vehicles (M6.2)
 *
 *  - drones dock on tower rooftops (deterministic: dock positions come
 *    from the M3 block seeds via WORLD.buildingAt — the same seeded
 *    path _fill uses, so routes always land where mass actually is)
 *  - patrol: pick 2–4 waypoints between tower roofs at roof level
 *    (dock altitude = roof + cruise + seeded jitter), fly between them
 *    at seeded speed; then return to the dock, hover, and re-plan —
 *    routes are always replanned, never baked at init
 *  - one shared InstancedMesh for every drone (one draw call total);
 *    per-instance color tints (cyan / amber variation)
 *  - per-frame work is a tight loop over a pre-allocated state array:
 *    zero `new`, zero array growth — items come from the M6.1 pool
 *  - caps: fleet ≤ CFG.traffic.drone.tiers[TIER.active()]; a drone
 *    whose dock drifted beyond radius*releaseFactor from the player is
 *    released back to the pool (the M6.5 tier system builds on the
 *    same TIER seam — auto-detect is M14.1)
 *
 *  M6.3 — sky vehicles (ring-road light trails):
 *  - each vehicle flies at constant speed along one avenue line (the
 *    ring roads: avenues every 5 blocks ⇒ centerlines at 120k + 12 m,
 *    the exact grid WORLD._skipBlock keeps clear) at one of 3 fixed
 *    altitudes (CFG.traffic.vehicle.altitudes — above every building
 *    and the creature, so the trails read from street level)
 *  - hull: one shared InstancedMesh (merged voxel craft, unlit basic —
 *    per-instance color IS the tint); trail: one shared additive
 *    InstancedMesh of thin boxes, two instances per vehicle (bright
 *    head + dim tail = a fading streak) on the shared MATS.pulseGlow
 *    material — the whole fleet costs exactly 2 draw calls
 *  - state lives in the M6.1 pool 'traffic-vehicle' (fixed capacity =
 *    HIGH tier cap ⇒ zero `new` after init); same tier cap + farthest-
 *    release trim + hold-radius release as the drones
 *
 *  (M6.4's steam + spark emitters moved to the M7.1 PARTS particle
 *   system — one system, one budget for every particle in the demo)
 * --------------------------------------------------------------------- */
const TRAFFIC = {
  name: 'TRAFFIC',
  mesh: null,
  count: 0,                 // live drones (= mesh.count)
  pool: null,
  _live: null,              // pre-allocated live list (pool items)
  _spawnTimer: 0,
  _rng: null,
  _cap: 16,
  /* pre-allocated scratch (zero per-frame allocation) */
  _m: new THREE.Matrix4(),
  _p: new THREE.Vector3(),
  _q: new THREE.Quaternion(),
  _s: new THREE.Vector3(1, 1, 1),
  _y: new THREE.Vector3(0, 1, 0),
  _tint: new THREE.Color(),
  /* M6.3 vehicle scratch (zero per-frame allocation) */
  vmesh: null,                 // hulls (one draw call)
  tmesh: null,                 // additive trail streaks (one draw call)
  vpool: null,
  vcount: 0,                   // live vehicles (= vmesh.count)
  _vLive: null,
  _vSpawnTimer: 0,
  _vCap: 12,
  _vm: new THREE.Matrix4(),
  _vp: new THREE.Vector3(),
  _vq: new THREE.Quaternion(),
  _vqI: new THREE.Quaternion(),
  _vs: new THREE.Vector3(1, 1, 1),
  _vtint: new THREE.Color(),
  /* M9.4 beat 5: staggered substation-bolt schedule (pre-allocated —
   * zero allocation in awaken()/update) */
  _arcQ: 0,               // bolts still to fire
  _arcTimer: 0,           // s until the next bolt
  _arcNext: 0,            // next pair index
  _arcIt: [null, null, null],  // live cascade bolt items (dropped at
                               // DORMANT entry, even mid-life)
  _arcPairs: new Float32Array(24),  // 3 pairs × (x,y,z) × 2
  _arcSel: new Float32Array(64),    // nearest-4 selection flags
  _arcSubs: [null, null, null, null],

  init() {
    /* drone body: merged voxel quad — chassis + 4 rotors + sensor nub
     * (unlit: the per-instance color IS the emissive tint) */
    const geo = KIT.mergeGeometries([
      { geo: new THREE.BoxGeometry(1.0, 0.24, 1.0) },
      { geo: new THREE.BoxGeometry(0.44, 0.06, 0.44),
        matrix: new THREE.Matrix4().makeTranslation(0.55, 0.14, 0.55) },
      { geo: new THREE.BoxGeometry(0.44, 0.06, 0.44),
        matrix: new THREE.Matrix4().makeTranslation(-0.55, 0.14, 0.55) },
      { geo: new THREE.BoxGeometry(0.44, 0.06, 0.44),
        matrix: new THREE.Matrix4().makeTranslation(0.55, 0.14, -0.55) },
      { geo: new THREE.BoxGeometry(0.44, 0.06, 0.44),
        matrix: new THREE.Matrix4().makeTranslation(-0.55, 0.14, -0.55) },
      { geo: new THREE.BoxGeometry(0.3, 0.16, 0.3),
        matrix: new THREE.Matrix4().makeTranslation(0, -0.18, 0.3) },
    ]);
    /* unlit basic material: the per-instance color IS the visible tint
     * (same pattern as M5 compute nodes — lit lambert would vanish into
     * the black night sky at drone scale) */
    TRAFFIC.mesh = new THREE.InstancedMesh(
      geo, new THREE.MeshBasicMaterial({ color: 0xffffff }), 16);
    TRAFFIC.mesh.count = 0;
    TRAFFIC.mesh.frustumCulled = false;
    TRAFFIC.mesh.name = 'drones';
    scene.add(TRAFFIC.mesh);

    TRAFFIC._live = new Array(16);
    TRAFFIC.pool = POOL.make('traffic-drone', 16, () => ({
      /* positions (metres) */
      px: 0, py: 0, pz: 0,
      /* patrol targets (metres) */
      tx: 0, ty: 0, tz: 0,
      /* dock home (metres) */
      dx: 0, dy: 0, dz: 0,
      /* per-drone constants */
      speed: 10, cruise: 6, size: 2, phase: 0,
      state: 0,                // 0 docked → 1 patrol → 2 return
      wp: 0,                   // next waypoint index
      wpCount: 0,
      wpT: 0,                  // route timer (returns to waypoint 0)
      dockT: 4,                // remaining dock time (s)
      yaw: 0,                  // heading (radians, toward current target)
      /* M9.4 beat 5: the traffic cascade — 3 = scatter (fly outward
       * from the plaza, then back to the dock), 4 = escort (re-route
       * to hover at the creature, then back). rx/ry/rz = reaction
       * target; roleT = remaining escort hover (s). */
      rx: 0, ry: 0, rz: 0,
      roleT: 0,
      wps: new Float32Array(12),  // up to 4 waypoints, pre-allocated
      tint: new THREE.Color(0x9fe8ff),
    }));

    /* ---- M6.3: sky vehicles (ring-road light trails) ---- */
    const vgeo = KIT.mergeGeometries([
      { geo: new THREE.BoxGeometry(0.7, 0.35, 2.2) },                  // hull
      { geo: new THREE.BoxGeometry(1.7, 0.12, 0.55),
        matrix: new THREE.Matrix4().makeTranslation(0, 0.1, -0.1) },   // wing
      { geo: new THREE.BoxGeometry(0.14, 0.55, 0.4),
        matrix: new THREE.Matrix4().makeTranslation(0, 0.25, -0.95) }, // tail fin
    ]);
    TRAFFIC.vmesh = new THREE.InstancedMesh(
      vgeo, new THREE.MeshBasicMaterial({ color: 0xffffff }), 12);
    TRAFFIC.vmesh.count = 0;
    TRAFFIC.vmesh.frustumCulled = false;
    TRAFFIC.vmesh.name = 'sky-vehicles';
    scene.add(TRAFFIC.vmesh);

    /* trail streaks: thin additive boxes on the shared pulseGlow
     * material (white base ⇒ the per-instance color IS the light).
     * Two instances per vehicle: bright head + dim tail behind the
     * hull — a fading streak readable from any angle (the box has
     * height, so it is not edge-on from street level). */
    TRAFFIC.tmesh = new THREE.InstancedMesh(
      new THREE.BoxGeometry(1, 1, 1), MATS.pulseGlow, 24);
    TRAFFIC.tmesh.count = 0;
    TRAFFIC.tmesh.frustumCulled = false;
    TRAFFIC.tmesh.name = 'sky-trails';
    scene.add(TRAFFIC.tmesh);

    TRAFFIC._vLive = new Array(12);
    TRAFFIC.vpool = POOL.make('traffic-vehicle', 12, () => ({
      axis: 0,             // 0 = z-line (x fixed) / 1 = x-line (z fixed)
      lane: 0,            // fixed avenue coordinate (m)
      dir: 1,             // travel direction along the line
      alt: 70,            // lane altitude (m)
      px: 0, py: 0, pz: 0,
      speed: 30, size: 1.6, trailLen: 12, phase: 0,
      /* M9.4 beat 5: avoidance offset — ox = lateral metres away from
       * the plaza (signed; axis decides x vs z), oalt = altitude bump,
       * av = eased level 0..1, avoidT = remaining offset time (s).
       * Render pose only — the analytic lane state is untouched. */
      ox: 0, oalt: 0, av: 0, avoidT: 0,
      tint: new THREE.Color(0x6fe3ff),
    }));

    /* persistent rng: spawn planning is deterministic per page load
     * (seeded once; every call draws from the same stream) */
    TRAFFIC._rng = mulberry32(CFG.city.seed ^ 0x5d37);
    TRAFFIC._spawnTimer = 0;
    TRAFFIC._vSpawnTimer = 0;
    TRAFFIC._cap = CFG.traffic.drone.tiers[TIER.name];
    TRAFFIC._vCap = CFG.traffic.vehicle.tiers[TIER.name];
  },

  /* public API — M9.4 beat 5: the traffic cascade. Drones scatter
   * outward from the plaza (some re-route to hover at the creature);
   * sky vehicles take avoidance offsets off their lanes; substation
   * bolts fire staggered; a steam burst rolls off the cooling towers.
   * Fired once per sequence by ENTITY, gated on _ignited. */
  awaken() {
    const tc = CFG.entity.beats.cascade.traffic;
    const r = TRAFFIC._rng;
    /* drones: scatter / escort / hold (normal patrol continues) */
    for (let i = 0; i < TRAFFIC.count; i++) {
      const it = TRAFFIC._live[i];
      const roll = r();
      if (roll < tc.scatter) {
        /* scatter: fly outward from the plaza, then back to the dock */
        const rad = Math.hypot(it.px, it.pz);
        const a2 = rad > 1
          ? Math.atan2(it.pz, it.px)
          : r() * 6.2831853;
        const dist = tc.scatterDist[0]
          + r() * (tc.scatterDist[1] - tc.scatterDist[0]);
        it.rx = Math.cos(a2) * (rad + dist);
        it.rz = Math.sin(a2) * (rad + dist);
        it.ry = it.py + tc.scatterUp[0]
          + r() * (tc.scatterUp[1] - tc.scatterUp[0]);
        it.state = 3;
      } else if (roll < tc.scatter + tc.escort) {
        /* escort: re-route to the creature — hover ring around the
         * plaza at creature height, hold, then back to the dock */
        const a2 = r() * 6.2831853;
        const rad = tc.escortR[0] + r() * (tc.escortR[1] - tc.escortR[0]);
        it.rx = Math.cos(a2) * rad;
        it.rz = Math.sin(a2) * rad;
        it.ry = tc.escortAlt[0]
          + r() * (tc.escortAlt[1] - tc.escortAlt[0]);
        it.roleT = tc.escortHold;
        it.state = 4;
      }
    }
    /* vehicles: avoidance offsets away from the plaza (render pose
     * only — the analytic lane state is untouched) */
    for (let i = 0; i < TRAFFIC.vcount; i++) {
      const it = TRAFFIC._vLive[i];
      const sgn = it.lane >= 0 ? 1 : -1;
      it.ox = sgn * (tc.avoidLat[0]
        + r() * (tc.avoidLat[1] - tc.avoidLat[0]));
      it.oalt = tc.avoidAlt[0]
        + r() * (tc.avoidAlt[1] - tc.avoidAlt[0]);
      it.avoidT = tc.avoidDur;
    }
    /* substation bolts: up to 3 staggered pairs among the 4 nearest
     * substations (to the plaza) — pre-allocated scratch only */
    TRAFFIC._arcQ = 0;
    TRAFFIC._arcNext = 0;
    TRAFFIC._arcIt[0] = TRAFFIC._arcIt[1] = TRAFFIC._arcIt[2] = null;
    const list = PARTS._subList;
    if (list.length >= 2) {
      const m = Math.min(4, list.length);
      const sel = TRAFFIC._arcSubs;
      for (let k = 0; k < m; k++) {
        let bi = -1, bd = Infinity;
        for (let i = 0; i < list.length; i++) {
          if (TRAFFIC._arcSel[i]) continue;
          const s = list[i];
          const dd = s.x * s.x + s.z * s.z;
          if (dd < bd) { bd = dd; bi = i; }
        }
        if (bi < 0) break;
        TRAFFIC._arcSel[bi] = 1;
        sel[k] = list[bi];
      }
      for (let i = 0; i < list.length; i++) TRAFFIC._arcSel[i] = 0;
      const P = TRAFFIC._arcPairs;
      let q = 0;
      const put = (a, b) => {
        P[q * 8 + 0] = a.x; P[q * 8 + 1] = a.hTop + 0.5; P[q * 8 + 2] = a.z;
        P[q * 8 + 3] = b.x; P[q * 8 + 4] = b.hTop + 0.5; P[q * 8 + 5] = b.z;
        q++;
      };
      if (m === 4) {
        put(sel[0], sel[1]); put(sel[2], sel[3]); put(sel[0], sel[2]);
      } else if (m === 3) {
        put(sel[0], sel[1]); put(sel[1], sel[2]); put(sel[0], sel[2]);
      } else {
        put(sel[0], sel[1]);
      }
      TRAFFIC._arcQ = q;
      TRAFFIC._arcTimer = 0;   // first bolt fires on the next frame
    }
    /* steam burst from the ambient cooling-tower vents */
    PARTS.steamBurst(tc.steam);
  },

  /* public API — M9.4: end the traffic cascade at DORMANT entry.
   * Reaction drones head straight home (state 2); vehicle offsets
   * ease out over avoidRamp. Idempotent. */
  awakenEnd() {
    for (let i = 0; i < TRAFFIC.count; i++) {
      const it = TRAFFIC._live[i];
      if (it.state === 3 || it.state === 4) it.state = 2;
    }
    for (let i = 0; i < TRAFFIC.vcount; i++) {
      TRAFFIC._vLive[i].avoidT = 0;   // level eases out over avoidRamp
    }
    /* cancel any not-yet-fired bolts and drop the live ones (even
     * mid-life) so the cascade leaves no visible residue */
    TRAFFIC._arcQ = 0;
    TRAFFIC._arcNext = 0;
    for (let i = 0; i < 3; i++) {
      const it = TRAFFIC._arcIt[i];
      if (it) {
        FX.dropArc(it);
        TRAFFIC._arcIt[i] = null;
      }
    }
  },

  update(dt, t) {
    const d = CFG.traffic.drone;
    /* M9.4: staggered substation bolts from the awakening cascade */
    if (TRAFFIC._arcQ > 0) {
      TRAFFIC._arcTimer -= dt;
      if (TRAFFIC._arcTimer <= 0) {
        const P = TRAFFIC._arcPairs;
        const o = TRAFFIC._arcNext * 8;
        const it = FX.arc({ x: P[o], y: P[o + 1], z: P[o + 2] },
                          { x: P[o + 3], y: P[o + 4], z: P[o + 5] });
        if (it) TRAFFIC._arcIt[TRAFFIC._arcNext] = it;
        TRAFFIC._arcNext++;
        TRAFFIC._arcQ--;
        TRAFFIC._arcTimer += CFG.entity.beats.cascade.traffic.arcStagger;
      }
    }
    /* tier cap: trim the farthest drones down to the tier limit */
    TRAFFIC._cap = d.tiers[TIER.name];
    while (TRAFFIC.count > TRAFFIC._cap) {
      let fi = -1, fd = -1;
      for (let i = 0; i < TRAFFIC.count; i++) {
        const it = TRAFFIC._live[i];
        const dist2 =
          (it.px - CAMERA.pos.x) * (it.px - CAMERA.pos.x) +
          (it.pz - CAMERA.pos.z) * (it.pz - CAMERA.pos.z);
        if (dist2 > fd) { fd = dist2; fi = i; }
      }
      TRAFFIC._releaseAt(fi >= 0 ? fi : TRAFFIC.count - 1);
    }

    /* spawn attempts (persistent rng — zero allocations) */
    TRAFFIC._spawnTimer -= dt;
    if (TRAFFIC._spawnTimer <= 0 && TRAFFIC.count < TRAFFIC._cap) {
      TRAFFIC._spawnTimer = d.spawnInterval;
      const it = TRAFFIC.pool.acquire();
      if (it) TRAFFIC._spawn(it);
      else TRAFFIC._spawnTimer = d.spawnInterval * 2;  // pool full, retry
    }

    /* per-frame flight update (tight loop, pre-allocated state) */
    const mesh = TRAFFIC.mesh;
    for (let i = TRAFFIC.count - 1; i >= 0; i--) {
      const it = TRAFFIC._live[i];
      /* distance cap: dock drifted beyond radius*factor → release */
      const dr = it.dx - CAMERA.pos.x, dz = it.dz - CAMERA.pos.z;
      if (dr * dr + dz * dz > d.radius * d.releaseFactor * d.radius * d.releaseFactor) {
        TRAFFIC._releaseAt(i); continue;
      }
      let bob = 0;
      if (it.state === 0) {
        /* docked: hover bob at dock altitude until the timer elapses */
        it.dockT -= dt;
        bob = 0.25 * Math.sin(t * 2 + it.phase);
        if (it.dockT <= 0 && it.wpCount > 0) it.state = 1;
        TRAFFIC._pose(it, t, bob);
      } else {
        /* M9.4: states 3/4 (scatter / escort) fly to the reaction
         * target rx/ry/rz; state 1 → waypoint; state 2 → the dock */
        const targetX = it.state === 1 ? it.tx
          : it.state >= 3 ? it.rx : it.dx;
        const targetY = it.state === 1 ? it.ty
          : it.state >= 3 ? it.ry : it.dy;
        const targetZ = it.state === 1 ? it.tz
          : it.state >= 3 ? it.rz : it.dz;
        const dx = targetX - it.px, dy = targetY - it.py, dz = targetZ - it.pz;
        const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);
        const step = it.speed * dt;
        if (dist <= step + 0.15) {
          /* arrived */
          it.px = targetX; it.py = targetY; it.pz = targetZ;
          if (it.state === 1) {
            if (it.wp >= it.wpCount - 1) it.state = 2;  // last wp → return
            else { it.wp++; TRAFFIC._nextWp(it); }
          } else if (it.state === 3) {
            /* M9.4: scatter point reached → back to the dock */
            it.state = 2;
          } else if (it.state === 4) {
            /* M9.4: escort hover at the creature — hold, then return */
            it.roleT -= dt;
            if (it.roleT <= 0) it.state = 2;
          } else {
            it.state = 0;
            it.dockT = d.dockTime[0] + it.phase / 6.2831853 * (d.dockTime[1] - d.dockTime[0]);
