            TRAFFIC._plan(it);  // replan the next route at the dock
          }
        } else {
          it.yaw = Math.atan2(dx, dz);   // face the current target
          const inv = it.speed / dist;
          it.px += dx * inv * dt; it.py += dy * inv * dt; it.pz += dz * inv * dt;
        }
        bob = 0.35 * Math.sin(t * 3 + it.phase);
        TRAFFIC._pose(it, t, bob);
      }
      mesh.setMatrixAt(i, TRAFFIC._m);
      /* re-set tint every frame: swap-remove in _releaseAt moves drones
       * between slots, and instance colors are per-SLOT, not per-item */
      mesh.setColorAt(i, it.tint);
    }
    mesh.count = TRAFFIC.count;
    if (TRAFFIC.count > 0) {
      mesh.instanceMatrix.needsUpdate = true;
      if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    }

    /* ---- M6.3: sky vehicles (ring-road light trails) ---- */
    const v = CFG.traffic.vehicle;
    /* tier cap: trim the farthest vehicles down to the tier limit */
    TRAFFIC._vCap = v.tiers[TIER.name];
    while (TRAFFIC.vcount > TRAFFIC._vCap) {
      let fi = -1, fd = -1;
      for (let i = 0; i < TRAFFIC.vcount; i++) {
        const it = TRAFFIC._vLive[i];
        const dist2 =
          (it.px - CAMERA.pos.x) * (it.px - CAMERA.pos.x) +
          (it.pz - CAMERA.pos.z) * (it.pz - CAMERA.pos.z);
        if (dist2 > fd) { fd = dist2; fi = i; }
      }
      TRAFFIC._vReleaseAt(fi >= 0 ? fi : TRAFFIC.vcount - 1);
    }

    /* spawn attempts (persistent rng — zero allocations) */
    TRAFFIC._vSpawnTimer -= dt;
    if (TRAFFIC._vSpawnTimer <= 0 && TRAFFIC.vcount < TRAFFIC._vCap) {
      TRAFFIC._vSpawnTimer = v.spawnInterval;
      const it = TRAFFIC.vpool.acquire();
      if (it) TRAFFIC._spawnVehicle(it);
      else TRAFFIC._vSpawnTimer = v.spawnInterval * 2;  // pool full, retry
    }

    /* per-frame flight update (tight loop, pre-allocated state) */
    const vmesh = TRAFFIC.vmesh, tmesh = TRAFFIC.tmesh;
    const avRamp = CFG.entity.beats.cascade.traffic.avoidRamp;
    for (let i = TRAFFIC.vcount - 1; i >= 0; i--) {
      const it = TRAFFIC._vLive[i];
      /* M9.4: avoidance offset — eased lateral shift away from the
       * plaza (render pose only; the analytic lane state is untouched
       * and the offset eases back to exactly 0) */
      if (it.avoidT > 0) {
        it.avoidT -= dt;
        it.av = Math.min(1, it.av + dt / avRamp);
      } else if (it.av > 0) {
        it.av = Math.max(0, it.av - dt / avRamp);
      }
      const ox = it.axis === 0 ? it.ox * it.av : 0;
      const oz = it.axis === 0 ? 0 : it.ox * it.av;
      const oy = it.oalt * it.av;
      /* constant-speed run along the avenue line */
      if (it.axis === 0) it.pz += it.dir * it.speed * dt;
      else it.px += it.dir * it.speed * dt;
      /* hold radius: flew past the player → back to the pool */
      const drx = it.px - CAMERA.pos.x, drz = it.pz - CAMERA.pos.z;
      if (drx * drx + drz * drz >
          v.radius * v.releaseFactor * v.radius * v.releaseFactor) {
        TRAFFIC._vReleaseAt(i); continue;
      }
      /* hull pose (geometry faces +Z; yaw = travel heading) */
      const yaw = it.axis === 0
        ? (it.dir > 0 ? 0 : Math.PI)
        : (it.dir > 0 ? Math.PI / 2 : -Math.PI / 2);
      TRAFFIC._vp.set(it.px + ox, it.py + oy, it.pz + oz);
      TRAFFIC._vq.setFromAxisAngle(TRAFFIC._y, yaw);
      TRAFFIC._vs.set(it.size, it.size, it.size);
      TRAFFIC._vm.compose(TRAFFIC._vp, TRAFFIC._vq, TRAFFIC._vs);
      vmesh.setMatrixAt(i, TRAFFIC._vm);
      /* re-set tint every frame: swap-remove in _vReleaseAt moves
       * vehicles between slots, and instance colors are per-SLOT */
      vmesh.setColorAt(i, it.tint);
      /* trail: two additive segments behind the hull — bright head
       * (0..L/2) + dim tail (L/2..L), re-set every frame (same
       * per-slot invariant as the drones) */
      const L = it.trailLen, W = v.trailW;
      const hx = it.px - (it.axis === 0 ? 0 : it.dir * L * 0.25);
      const hz = it.pz - (it.axis === 0 ? it.dir * L * 0.25 : 0);
      TRAFFIC._vp.set(hx + ox, it.py + oy, hz + oz);
      TRAFFIC._vs.set(
        it.axis === 0 ? W : L / 2, W * 0.6, it.axis === 0 ? L / 2 : W);
      TRAFFIC._vm.compose(TRAFFIC._vp, TRAFFIC._vqI, TRAFFIC._vs);
      tmesh.setMatrixAt(i * 2, TRAFFIC._vm);
      tmesh.setColorAt(i * 2, it.tint);
      const tx = it.px - (it.axis === 0 ? 0 : it.dir * L * 0.75);
      const tz = it.pz - (it.axis === 0 ? it.dir * L * 0.75 : 0);
      TRAFFIC._vp.set(tx + ox, it.py + oy, tz + oz);
      TRAFFIC._vm.compose(TRAFFIC._vp, TRAFFIC._vqI, TRAFFIC._vs);
      tmesh.setMatrixAt(i * 2 + 1, TRAFFIC._vm);
      TRAFFIC._vtint.setRGB(
        it.tint.r * 0.45, it.tint.g * 0.45, it.tint.b * 0.45);
      tmesh.setColorAt(i * 2 + 1, TRAFFIC._vtint);
    }
    vmesh.count = TRAFFIC.vcount;
    tmesh.count = TRAFFIC.vcount * 2;
    if (TRAFFIC.vcount > 0) {
      vmesh.instanceMatrix.needsUpdate = true;
      if (vmesh.instanceColor) vmesh.instanceColor.needsUpdate = true;
      tmesh.instanceMatrix.needsUpdate = true;
      if (tmesh.instanceColor) tmesh.instanceColor.needsUpdate = true;
    }
  },

  /* write the instance matrix for drone `it` into TRAFFIC._m */
  _pose(it, t, bob) {
    const yaw = it.state === 0 ? 0.5 * Math.sin(t * 0.7 + it.phase) : it.yaw;
    TRAFFIC._p.set(it.px, it.py + bob, it.pz);
    TRAFFIC._q.setFromAxisAngle(TRAFFIC._y, yaw);
    TRAFFIC._s.set(it.size, it.size, it.size);
    TRAFFIC._m.compose(TRAFFIC._p, TRAFFIC._q, TRAFFIC._s);
  },

  /* plan a fresh route for a docked drone: 2–4 waypoints between
   * tower roofs at roof level (dock altitude = roof + cruise + jitter) */
  _plan(it) {
    const r = TRAFFIC._rng;
    const d = CFG.traffic.drone;
    it.wpCount = 0;
    it.wp = 0;
    it.wpT = 0;
    const n = 2 + (r() * 3) | 0;
    for (let k = 0; k < n; k++) {
      const b = TRAFFIC._findDock(r, it.dx, it.dz, false);
      if (!b) continue;
      const alt = b.hTop + d.cruise + r() * 4;   // above the target roof top
      it.wps[it.wpCount * 3] = b.x;
      it.wps[it.wpCount * 3 + 1] = alt;
      it.wps[it.wpCount * 3 + 2] = b.z;
      it.wpCount++;
    }
    if (it.wpCount === 0) return;   // nothing found — stays docked
    TRAFFIC._nextWp(it);
  },

  /* pick the next waypoint target (wraps to waypoint 0 at the end) */
  _nextWp(it) {
    const i = (it.wp % it.wpCount) * 3;
    it.tx = it.wps[i]; it.ty = it.wps[i + 1]; it.tz = it.wps[i + 2];
  },

  /* the block's current player-relative chunk ring — must match how
   * _fill seeds occupancy for that block (ring drives the occupancy)
   * the same way WORLD._sync assigns chunk rings */
  _ringFor(bx, bz) {
    const B = WORLD.BLOCK, K = WORLD.CHUNK;
    const pcx = Math.floor(Math.floor(CAMERA.pos.x / B) / K);
    const pcz = Math.floor(Math.floor(CAMERA.pos.z / B) / K);
    return Math.max(
      Math.abs(Math.floor(bx / K) - pcx),
      Math.abs(Math.floor(bz / K) - pcz));
  },

  /* seeded dock search: up to 14 random blocks inside an annulus
   * [innerRadius, radius] around (nearX, nearZ) — returns the first
   * with a dockable tower (replayed M3 building seed, min height,
   * player annulus). Planning-time only: small objects, not per-frame. */
  _findDock(r, nearX, nearZ, skipDup) {
    const d = CFG.traffic.drone;
    const B = WORLD.BLOCK;
    for (let a = 0; a < 14; a++) {
      const ang = r() * 6.2831853;
      const rad = d.innerRadius + r() * (d.radius - d.innerRadius);
      const wx = nearX + Math.cos(ang) * rad;
      const wz = nearZ + Math.sin(ang) * rad;
      const bx = Math.floor(wx / B), bz = Math.floor(wz / B);
      const info = WORLD.buildingAt(bx, bz, TRAFFIC._ringFor(bx, bz));
      if (!info) continue;
      const cd = Math.hypot(info.x - CAMERA.pos.x, info.z - CAMERA.pos.z);
      if (cd < d.innerRadius || cd > d.radius) continue;
      if (skipDup) {
        /* don't stack two drones on the same roof */
        let dup = false;
        for (let i = 0; i < TRAFFIC.count; i++) {
          const o = TRAFFIC._live[i];
          if (Math.abs(o.dx - info.x) < 1 && Math.abs(o.dz - info.z) < 1) { dup = true; break; }
        }
        if (dup) continue;
      }
      return { x: info.x, z: info.z, h: info.h, hTop: info.hTop };
    }
    return null;
  },

  _spawn(it) {
    const d = CFG.traffic.drone;
    const r = TRAFFIC._rng;
    const b = TRAFFIC._findDock(r, CAMERA.pos.x, CAMERA.pos.z, true);
    if (!b) { TRAFFIC.pool.release(it); return; }  // try again next tick
    const alt = d.dockHover + b.hTop;
    it.dx = b.x; it.dy = alt; it.dz = b.z;
    it.px = b.x; it.py = alt; it.pz = b.z;
    it.speed = d.speed[0] + r() * (d.speed[1] - d.speed[0]);
    it.size = d.size * (0.85 + r() * 0.3);
    it.phase = r() * 6.2831853;
    it.state = 0;
    it.yaw = r() * 6.2831853;
    it.dockT = d.dockTime[0] + r() * (d.dockTime[1] - d.dockTime[0]);
    it.tint.setHex(r() < 0.85 ? 0x9fe8ff : 0xffc46b);
    TRAFFIC._live[TRAFFIC.count++] = it;
    TRAFFIC._plan(it);
    TRAFFIC.mesh.setColorAt(TRAFFIC.count - 1, it.tint);
    AUDIO.droneWhir(               // M11.3: whir (M11.4: spatial pool)
      { x: it.px, y: it.py, z: it.pz });
  },

  _releaseAt(i) {
    const it = TRAFFIC._live[i];
    const m = --TRAFFIC.count;
    if (i !== m) TRAFFIC._live[i] = TRAFFIC._live[m];
    TRAFFIC._live[m] = undefined;
    TRAFFIC.pool.release(it);
  },

  /* spawn a sky vehicle on a ring-road avenue line: the avenue
   * centerlines are at 120k + 12 m (block 0 is an avenue, 24 m
   * blocks — the exact grid WORLD._skipBlock keeps clear), so pick a
   * lane index k whose line lies inside the hold radius, then spawn on
   * the far side of the player so the vehicle flies across the player's
   * view before it is released. */
  _spawnVehicle(it) {
    const v = CFG.traffic.vehicle;
    const r = TRAFFIC._rng;
    const p = CAMERA.pos;
    const axis = r() < 0.5 ? 0 : 1;
    const c = axis === 0 ? p.x : p.z;
    const lo = Math.ceil((c - v.radius - 12) / 120);
    const hi = Math.floor((c + v.radius - 12) / 120);
    if (hi < lo) { TRAFFIC.vpool.release(it); return; }  // try next tick
    const lane = 120 * (lo + Math.floor(r() * (hi - lo + 1))) + 12;
    const dir = r() < 0.5 ? 1 : -1;
    const alt = v.altitudes[(r() * v.altitudes.length) | 0];
    const s = (axis === 0 ? p.z : p.x) - dir * v.radius * (0.65 + r() * 0.35);
    it.axis = axis; it.lane = lane; it.dir = dir; it.alt = alt;
    it.px = axis === 0 ? lane : s;
    it.py = alt;
    it.pz = axis === 0 ? s : lane;
    it.speed = v.speed[0] + r() * (v.speed[1] - v.speed[0]);
    it.size = v.size * (0.8 + r() * 0.5);
    it.trailLen = v.trailLen[0] + r() * (v.trailLen[1] - v.trailLen[0]);
    it.phase = r() * 6.2831853;
    const roll = r();
    it.tint.setHex(roll < 0.6 ? 0x6fe3ff : roll < 0.9 ? 0xffc46b : 0xff7bd0);
    TRAFFIC._vLive[TRAFFIC.vcount++] = it;
  },

  _vReleaseAt(i) {
    const it = TRAFFIC._vLive[i];
    const m = --TRAFFIC.vcount;
    if (i !== m) TRAFFIC._vLive[i] = TRAFFIC._vLive[m];
    TRAFFIC._vLive[m] = undefined;
    TRAFFIC.vpool.release(it);
  },

  dispose() {
    for (let i = TRAFFIC.count - 1; i >= 0; i--) TRAFFIC._releaseAt(i);
    for (let i = TRAFFIC.vcount - 1; i >= 0; i--) TRAFFIC._vReleaseAt(i);
    if (TRAFFIC.mesh) {
      scene.remove(TRAFFIC.mesh);
      TRAFFIC.mesh.geometry.dispose();
      TRAFFIC.mesh.material.dispose();
    }
    for (const m of [TRAFFIC.vmesh, TRAFFIC.tmesh]) {
      if (m) {
        scene.remove(m);
        m.geometry.dispose();
        m.material.dispose();
      }
    }
  },
};

/* ==================================================================== *
 * PARTS — pooled particle system (M7.1): one system, one budget
 *
 *  - EVERY particle in the demo is an item of a PARTS M6.1 pool:
 *    steam, sparks, pulse motes, lightning motes, awakening rain.
 *    Five pools, one per type, fixed capacity = HIGH tier cap ⇒ zero
 *    `new` after init; the one budget is CFG.parts.tiers (total live
 *    particles per tier = the exact sum of the per-type tier caps),
 *    enforced per type by the same farthest-release trim the M6
 *    fleets use (TIER seam — auto-detect is M14.1)
 *  - renderers (one draw call each; count 0 / drawRange 0 ⇒ 0 draw
 *    calls, so the event types cost nothing while idle):
 *    - steam: billboard glow-sprite InstancedMesh (AMBIENT: cooling-
 *      tower vents — the M6.4 emitter, moved here from TRAFFIC)
 *    - spark: tiny additive Points (AMBIENT: substation roofs — the
 *      M6.4 emitter, moved here from TRAFFIC)
 *    - pulse: slow-rising cyan motes (EVENT: M13.2 data pulse + dev
 *      trigger; 0 live at idle)
 *    - light: fast-falling white motes (EVENT: M8.4 distant lightning
 *      + dev trigger; 0 live at idle)
 *    - rain: falling energy streaks on the shared MATS.pulseGlow
 *      material (EVENT: M9 awakening + dev trigger; 0 live at idle)
 *  - dev trigger (Key P, INPUT edge): PARTS.rainAll() — one-time
 *    bursts of every type + a streak/mote trickle for CFG.parts.rain
 *    .dur seconds around the player
 *  - ambient source lists (moved from TRAFFIC — the M6.4 seam): a
 *    small live list of nearby source buildings, rebuilt every few
 *    seconds from the same seeded WORLD.buildingAt path; spawn timers
 *    accumulate the frame remainder (while, not if-reset) so rates are
 *    frame-rate independent
 * --------------------------------------------------------------------- */
const PARTS = {
  name: 'PARTS',
  /* pools (M6.1): 'parts-steam' / 'parts-spark' / 'parts-pulse' /
   * 'parts-light' / 'parts-rain' — capacity = HIGH tier cap */
  spool: null,
  ppool: null,
  mpool: null,
  lpool: null,
  rpool: null,
  /* live lists (pool items, swap-remove) + live counts */
  _sLive: null,
  _pLive: null,
  _mLive: null,
  _lLive: null,
  _rLive: null,
  scount: 0,                   // live puffs  (= smesh.count)
  pcount: 0,                   // live sparks (= spoints drawRange)
  mcount: 0,                   // live pulse motes (= mpoints drawRange)
  lcount: 0,                   // live lightning motes (= lpoints drawRange)
  rcount: 0,                   // live rain streaks (= rmesh.count)
  /* renderers (one draw call each; 0 live ⇒ 0 draw calls) */
  smesh: null,                 // steam billboard quads
  spoints: null,               // spark points
  mpoints: null,               // pulse-mote points
  lpoints: null,               // lightning-mote points
  rmesh: null,                 // rain streak boxes
  /* ambient source lists (moved from TRAFFIC — M6.4 seam) */
  _coolList: [],
  _subList: [],
  _srcTimer: 0,
  /* timers (frame remainders accumulate — not if-reset) */
  _sSpawnTimer: 0,
  _pSpawnTimer: 0,
  _rainT: 0,                   // remaining trigger-rain duration (s)
  _rainSpawnTimer: 0,
  _pulseSpawnTimer: 0,
  _lightSpawnTimer: 0,
  _rng: null,
  /* tier caps (one budget: the sum = CFG.parts.tiers[TIER.name]) */
  _sCap: 48,
  _pCap: 64,
  _mCap: 48,
  _lCap: 40,
  _rCap: 80,
  /* scratch (zero per-frame allocation) */
  _sm: new THREE.Matrix4(),
  _sp: new THREE.Vector3(),
  _ss: new THREE.Vector3(1, 1, 1),
  _sq: new THREE.Quaternion(),
  _sqX: new THREE.Quaternion(),
  _sqY: new THREE.Quaternion(),
  _stint: new THREE.Color(),
  _x: new THREE.Vector3(1, 0, 0),
  _y: new THREE.Vector3(0, 1, 0),
  _rm: new THREE.Matrix4(),
  _rp: new THREE.Vector3(),
  _rs: new THREE.Vector3(1, 1, 1),
  _qI: new THREE.Quaternion(),
  _rtint: new THREE.Color(),

  init() {
    /* ---- steam vents (billboard sprite pool, cooling towers) —
     * moved here from TRAFFIC in M7.1 (the M6.4 emitter). One shared
     * InstancedMesh of glow-textured quads: the whole plume field
     * costs one draw call. The quad is billboarded to the camera
     * every frame; per-instance color = tint × fade (additive ⇒
     * color IS the alpha). */
    PARTS.smesh = new THREE.InstancedMesh(
      new THREE.PlaneGeometry(1, 1),
      new THREE.MeshBasicMaterial({
        map: KIT.tex.glow.tex, color: 0xffffff, transparent: true,
        depthWrite: false, blending: THREE.AdditiveBlending,
      }), 48);
    PARTS.smesh.count = 0;
    PARTS.smesh.frustumCulled = false;
    PARTS.smesh.name = 'steam-vents';
    scene.add(PARTS.smesh);
    PARTS._sLive = new Array(48);
    PARTS.spool = POOL.make('parts-steam', 48, () => ({
      px: 0, py: 0, pz: 0,     // current puff position (metres)
      sx: 0, sy: 0, sz: 0,    // vent origin (metres)
      vy: 2.5, age: 0, life: 6,
      size0: 2.5, ph: 0,
      cR: 0.62, cG: 0.72, cB: 0.82,   // vapor tint (× fade per frame)
    }));

    /* ---- sparks (tiny additive points, substations) — moved here
     * from TRAFFIC in M7.1 (the M6.4 emitter). One Points cloud with
     * per-vertex color = flash × fade; only the first pcount vertices
     * are drawn (setDrawRange), so 0 live sparks cost 0 draw calls. */
    const nP = 64;
    const sGeo = new THREE.BufferGeometry();
    sGeo.setAttribute('position',
      new THREE.BufferAttribute(new Float32Array(nP * 3), 3));
    sGeo.setAttribute('color',
      new THREE.BufferAttribute(new Float32Array(nP * 3), 3));
    PARTS._sparkTex = KIT.makeGlowTexture(64, '255,225,170');
    PARTS.spoints = new THREE.Points(sGeo, new THREE.PointsMaterial({
      size: 1.1, sizeAttenuation: true,
      map: PARTS._sparkTex.tex,
      transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending, vertexColors: true,
    }));
    sGeo.setDrawRange(0, 0);
    PARTS.spoints.frustumCulled = false;
    PARTS.spoints.name = 'sparks';
    scene.add(PARTS.spoints);
    PARTS._pLive = new Array(64);
    PARTS.ppool = POOL.make('parts-spark', 64, () => ({
      px: 0, py: 0, pz: 0,     // current position (metres)
      sx: 0, sy: 0, sz: 0,    // substation origin (metres)
      vx: 0, vy: 0, vz: 0,
      age: 0, life: 0.5, ph: 0,
      cR: 1, cG: 0.85, cB: 0.55,     // hot white-amber (× fade per frame)
    }));

    /* ---- pulse motes (rising cyan points — EVENT: M13.2 data
     * pulse + dev trigger; 0 live at idle). Shared cyan glow texture
     * (white-base KIT asset ⇒ the per-vertex color IS the light). */
    const nM = 48;
    const mGeo = new THREE.BufferGeometry();
    mGeo.setAttribute('position',
      new THREE.BufferAttribute(new Float32Array(nM * 3), 3));
    mGeo.setAttribute('color',
      new THREE.BufferAttribute(new Float32Array(nM * 3), 3));
    PARTS.mpoints = new THREE.Points(mGeo, new THREE.PointsMaterial({
      size: 1.6, sizeAttenuation: true, map: KIT.tex.glow.tex,
      transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending, vertexColors: true,
    }));
    mGeo.setDrawRange(0, 0);
    PARTS.mpoints.frustumCulled = false;
    PARTS.mpoints.name = 'pulse-motes';
    scene.add(PARTS.mpoints);
    PARTS._mLive = new Array(48);
    PARTS.mpool = POOL.make('parts-pulse', 48, () => ({
      px: 0, py: 0, pz: 0,     // current position (metres)
      sx: 0, sy: 0, sz: 0,    // spawn origin (metres)
      vy: 1, age: 0, life: 5,
      sw: 0.5, ph: 0,
      cR: 0.4, cG: 0.85, cB: 1,     // data-cyan (× fade per frame)
    }));

    /* ---- lightning motes (fast white points — EVENT: M8.4 distant
     * lightning + dev trigger; 0 live at idle). Own near-white glow
     * texture (the shared one is cyan). */
    const nL = 40;
    const lGeo = new THREE.BufferGeometry();
    lGeo.setAttribute('position',
      new THREE.BufferAttribute(new Float32Array(nL * 3), 3));
    lGeo.setAttribute('color',
      new THREE.BufferAttribute(new Float32Array(nL * 3), 3));
    PARTS._lightTex = KIT.makeGlowTexture(64, '215,230,255');
    PARTS.lpoints = new THREE.Points(lGeo, new THREE.PointsMaterial({
      size: 1.0, sizeAttenuation: true, map: PARTS._lightTex.tex,
      transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending, vertexColors: true,
    }));
    lGeo.setDrawRange(0, 0);
    PARTS.lpoints.frustumCulled = false;
    PARTS.lpoints.name = 'lightning-motes';
    scene.add(PARTS.lpoints);
    PARTS._lLive = new Array(40);
    PARTS.lpool = POOL.make('parts-light', 40, () => ({
      px: 0, py: 0, pz: 0,     // current position (metres)
      sx: 0, sy: 0, sz: 0,    // far-sky origin (metres)
      vy: -70, age: 0, life: 2, ph: 0,
      cR: 0.75, cG: 0.88, cB: 1,   // white-blue (× fade per frame)
    }));

    /* ---- rain (falling energy streaks — EVENT: M9 awakening + dev
     * trigger; 0 live at idle). Thin additive boxes on the shared
     * MATS.pulseGlow material (white base ⇒ the per-instance color IS
     * the light) — same pattern as the M6.3 trail streaks. */
    PARTS.rmesh = new THREE.InstancedMesh(
      new THREE.BoxGeometry(1, 1, 1), MATS.pulseGlow, 80);
    PARTS.rmesh.count = 0;
    PARTS.rmesh.frustumCulled = false;
    PARTS.rmesh.name = 'energy-rain';
    scene.add(PARTS.rmesh);
    PARTS._rLive = new Array(80);
    PARTS.rpool = POOL.make('parts-rain', 80, () => ({
      px: 0, py: 0, pz: 0,     // current position (metres)
      sx: 0, sy: 0, sz: 0,    // spawn origin (metres)
      vy: -37, age: 0, life: 2.5,
      len: 7, ph: 0,
      cR: 0.45, cG: 0.85, cB: 1,   // energy-cyan (× fade per frame)
    }));

    /* persistent rng: spawn planning is deterministic per page load
     * (seeded once; every call draws from the same stream) */
    PARTS._rng = mulberry32(CFG.city.seed ^ 0x77a1);
    PARTS._sSpawnTimer = 0;
    PARTS._pSpawnTimer = 0;
    PARTS._rainT = 0;
    PARTS._rainSpawnTimer = 0;
    PARTS._pulseSpawnTimer = 0;
    PARTS._lightSpawnTimer = 0;
    PARTS._sCap = CFG.parts.steam.tiers[TIER.name];
    PARTS._pCap = CFG.parts.spark.tiers[TIER.name];
    PARTS._mCap = CFG.parts.pulse.tiers[TIER.name];
    PARTS._lCap = CFG.parts.light.tiers[TIER.name];
    PARTS._rCap = CFG.parts.rain.tiers[TIER.name];
  },

  update(dt, t) {
    /* dev trigger (Key P edge from INPUT): rain ALL five types */
    if (INPUT.rainTrigger) {
      INPUT.rainTrigger = false;
      PARTS.rainAll();
    }

    /* ---- ambient steam vents (cooling towers) — the M6.4 emitter,
     * moved here in M7.1 (same pattern, now one of the 5 types) ---- */
    const st = CFG.parts.steam;
    /* keep the source lists fresh (steam + spark share them) */
    PARTS._srcTimer += dt;
    if (PARTS._srcTimer >= 4 ||
        PARTS._coolList.length === 0 || PARTS._subList.length === 0) {
      PARTS._refreshSources();
    }
    /* tier cap: trim the farthest puffs down to the tier limit */
    PARTS._sCap = st.tiers[TIER.name];
    while (PARTS.scount > PARTS._sCap) {
      let fi = 0, fd = -1;
      for (let i = 0; i < PARTS.scount; i++) {
        const it = PARTS._sLive[i];
        const dist2 =
          (it.px - CAMERA.pos.x) * (it.px - CAMERA.pos.x) +
          (it.pz - CAMERA.pos.z) * (it.pz - CAMERA.pos.z);
        if (dist2 > fd) { fd = dist2; fi = i; }
      }
      PARTS._sReleaseAt(fi);
    }

    /* spawn attempts (persistent rng — zero allocations). Timer
     * accumulates the frame remainder (while, not if-reset) so the
     * rate is frame-rate independent. */
    PARTS._sSpawnTimer -= dt;
    while (PARTS._sSpawnTimer <= 0 && PARTS.scount < PARTS._sCap) {
      PARTS._sSpawnTimer += st.spawnInterval;
      const r = PARTS._rng;
      const src = PARTS._findSource(r, 'cool', st.radius, st.innerRadius);
      const it = src ? PARTS.spool.acquire() : null;
      if (it) PARTS._spawnSteam(it, src);
      else break;   // no source in range — retry on the next interval
    }

    /* per-frame drift: rise + sway, grow, fade in/out. Billboard =
     * camera orientation (orbit mode is transient — close enough). */
    const smesh = PARTS.smesh;
    PARTS._sqY.setFromAxisAngle(PARTS._y, CAMERA.yaw);
    PARTS._sqX.setFromAxisAngle(PARTS._x, CAMERA.pitch);
    PARTS._sq.copy(PARTS._sqY).multiply(PARTS._sqX);
    const sR2 = st.radius * st.releaseFactor * st.radius * st.releaseFactor;
    for (let i = PARTS.scount - 1; i >= 0; i--) {
      const it = PARTS._sLive[i];
      it.age += dt;
      const drx = it.sx - CAMERA.pos.x, drz = it.sz - CAMERA.pos.z;
      if (it.age >= it.life ||
          drx * drx + drz * drz > sR2) { PARTS._sReleaseAt(i); continue; }
      const u = it.age / it.life;
      it.py += it.vy * dt;
      it.px += Math.sin(t * 0.9 + it.ph) * 0.4 * dt;   // gentle sway drift
      it.pz += Math.cos(t * 0.7 + it.ph) * 0.3 * dt;
      const size = it.size0 * (1 + st.grow * u);
      PARTS._sp.set(it.px, it.py, it.pz);
      PARTS._ss.set(size, size, size);
      PARTS._sm.compose(PARTS._sp, PARTS._sq, PARTS._ss);
      smesh.setMatrixAt(i, PARTS._sm);
      /* fade in/out: 0 → tint → 0 over life (additive ⇒ color IS alpha) */
      const a = Math.sin(u * Math.PI) * 0.30;
      PARTS._stint.setRGB(it.cR * a, it.cG * a, it.cB * a);
      smesh.setColorAt(i, PARTS._stint);
    }
    smesh.count = PARTS.scount;
    if (PARTS.scount > 0) {
      smesh.instanceMatrix.needsUpdate = true;
      if (smesh.instanceColor) smesh.instanceColor.needsUpdate = true;
    }

    /* ---- ambient sparks (substations) — the M6.4 emitter, moved
     * here in M7.1 ---- */
    const sp = CFG.parts.spark;
    PARTS._pCap = sp.tiers[TIER.name];
    while (PARTS.pcount > PARTS._pCap) {
      let fi = 0, fd = -1;
      for (let i = 0; i < PARTS.pcount; i++) {
        const it = PARTS._pLive[i];
        const dist2 =
          (it.px - CAMERA.pos.x) * (it.px - CAMERA.pos.x) +
          (it.pz - CAMERA.pos.z) * (it.pz - CAMERA.pos.z);
        if (dist2 > fd) { fd = dist2; fi = i; }
      }
      PARTS._pReleaseAt(fi);
    }

    /* burst attempts (persistent rng — zero allocations), same
     * frame-rate-independent timer pattern as the steam spawner */
    PARTS._pSpawnTimer -= dt;
    while (PARTS._pSpawnTimer <= 0 && PARTS.pcount < PARTS._pCap) {
      PARTS._pSpawnTimer += sp.spawnInterval;
      const r = PARTS._rng;
      const n = sp.burst[0] + Math.floor(r() * (sp.burst[1] - sp.burst[0] + 1));
      const src = PARTS._findSource(r, 'sub', sp.radius, sp.innerRadius);
      if (!src) break;   // no source in range — retry on the next interval
      for (let k = 0; k < n; k++) {
        const it = PARTS.ppool.acquire();
        if (!it) break;
        PARTS._spawnSpark(it, src);
      }
    }

    /* per-frame: brief ballistic life, flicker, fade to zero. Only the
     * first pcount vertices are drawn (setDrawRange) — per-slot buffers,
     * re-set every frame (swap-remove moves items between slots). */
    const spts = PARTS.spoints;
    const sPos = spts.geometry.attributes.position.array;
    const sCol = spts.geometry.attributes.color.array;
    const pR2 = sp.radius * sp.releaseFactor * sp.radius * sp.releaseFactor;
    for (let i = PARTS.pcount - 1; i >= 0; i--) {
      const it = PARTS._pLive[i];
      it.age += dt;
      const drx = it.sx - CAMERA.pos.x, drz = it.sz - CAMERA.pos.z;
      if (it.age >= it.life ||
          drx * drx + drz * drz > pR2) { PARTS._pReleaseAt(i); continue; }
      const u = it.age / it.life;
      it.vy -= sp.gravity * dt;
      it.px += it.vx * dt; it.py += it.vy * dt; it.pz += it.vz * dt;
      sPos[i * 3] = it.px; sPos[i * 3 + 1] = it.py; sPos[i * 3 + 2] = it.pz;
      const fl = 0.75 + 0.25 * Math.sin(t * 42 + it.ph);
      const a = (1 - u) * fl;
      sCol[i * 3] = it.cR * a; sCol[i * 3 + 1] = it.cG * a;
      sCol[i * 3 + 2] = it.cB * a;
    }
    spts.geometry.setDrawRange(0, PARTS.pcount);
    spts.geometry.attributes.position.needsUpdate = true;
    spts.geometry.attributes.color.needsUpdate = true;

    /* ---- pulse motes (EVENT: M13.2 data pulse + dev trigger) ---- */
    const pu = CFG.parts.pulse;
    PARTS._mCap = pu.tiers[TIER.name];
    while (PARTS.mcount > PARTS._mCap) {
      let fi = 0, fd = -1;
      for (let i = 0; i < PARTS.mcount; i++) {
        const it = PARTS._mLive[i];
        const dist2 =
          (it.sx - CAMERA.pos.x) * (it.sx - CAMERA.pos.x) +
          (it.sz - CAMERA.pos.z) * (it.sz - CAMERA.pos.z);
        if (dist2 > fd) { fd = dist2; fi = i; }
      }
      PARTS._mReleaseAt(fi);
    }

    /* trickle only while a trigger rain is active (0 live at idle) */
    if (PARTS._rainT > 0) {
      PARTS._pulseSpawnTimer -= dt;
      while (PARTS._pulseSpawnTimer <= 0 && PARTS.mcount < PARTS._mCap) {
        PARTS._pulseSpawnTimer += pu.trickle;
        const it = PARTS.mpool.acquire();
        if (!it) break;
        PARTS._spawnPulse(it);
      }
    }

    /* slow rise + gentle swirl, sin-fade over life */
    const mpts = PARTS.mpoints;
    const mPos = mpts.geometry.attributes.position.array;
    const mCol = mpts.geometry.attributes.color.array;
    const mR2 = pu.radius * pu.releaseFactor * pu.radius * pu.releaseFactor;
    for (let i = PARTS.mcount - 1; i >= 0; i--) {
      const it = PARTS._mLive[i];
      it.age += dt;
      const drx = it.sx - CAMERA.pos.x, drz = it.sz - CAMERA.pos.z;
      if (it.age >= it.life ||
          drx * drx + drz * drz > mR2) { PARTS._mReleaseAt(i); continue; }
      const u = it.age / it.life;
      it.py += it.vy * dt;
      it.px += Math.sin(t * 0.6 + it.ph) * it.sw * dt;
      it.pz += Math.cos(t * 0.5 + it.ph) * it.sw * dt;
      mPos[i * 3] = it.px; mPos[i * 3 + 1] = it.py; mPos[i * 3 + 2] = it.pz;
      const a = Math.sin(u * Math.PI) * 0.55;
      mCol[i * 3] = it.cR * a; mCol[i * 3 + 1] = it.cG * a;
      mCol[i * 3 + 2] = it.cB * a;
    }
    mpts.geometry.setDrawRange(0, PARTS.mcount);
    mpts.geometry.attributes.position.needsUpdate = true;
    mpts.geometry.attributes.color.needsUpdate = true;

    /* ---- lightning motes (EVENT: M8.4 distant lightning + dev
     * trigger). Fast fall from the far sky; they age out high up
     * (no distance release — they spawn 250–450 m out on purpose). */
    const li = CFG.parts.light;
    PARTS._lCap = li.tiers[TIER.name];
    while (PARTS.lcount > PARTS._lCap) {
      let fi = 0, fd = -1;
      for (let i = 0; i < PARTS.lcount; i++) {
        const it = PARTS._lLive[i];
        const dist2 =
          (it.sx - CAMERA.pos.x) * (it.sx - CAMERA.pos.x) +
          (it.sz - CAMERA.pos.z) * (it.sz - CAMERA.pos.z);
        if (dist2 > fd) { fd = dist2; fi = i; }
      }
      PARTS._lReleaseAt(fi);
    }

    if (PARTS._rainT > 0) {
      PARTS._lightSpawnTimer -= dt;
      while (PARTS._lightSpawnTimer <= 0 && PARTS.lcount < PARTS._lCap) {
        PARTS._lightSpawnTimer += li.trickle;
        const it = PARTS.lpool.acquire();
        if (!it) break;
        PARTS._spawnLight(it);
      }
    }

    const lpts = PARTS.lpoints;
    const lPos = lpts.geometry.attributes.position.array;
    const lCol = lpts.geometry.attributes.color.array;
    for (let i = PARTS.lcount - 1; i >= 0; i--) {
      const it = PARTS._lLive[i];
      it.age += dt;
      if (it.age >= it.life) { PARTS._lReleaseAt(i); continue; }
      const u = it.age / it.life;
      it.py += it.vy * dt;
      lPos[i * 3] = it.px; lPos[i * 3 + 1] = it.py; lPos[i * 3 + 2] = it.pz;
      const fl = 0.7 + 0.3 * Math.sin(t * 60 + it.ph);
      const a = (1 - u) * fl;
      lCol[i * 3] = it.cR * a; lCol[i * 3 + 1] = it.cG * a;
      lCol[i * 3 + 2] = it.cB * a;
    }
    lpts.geometry.setDrawRange(0, PARTS.lcount);
    lpts.geometry.attributes.position.needsUpdate = true;
    lpts.geometry.attributes.color.needsUpdate = true;

    /* ---- rain (EVENT: M9 awakening + dev trigger). Fast fall, slight
     * sway, fade out over the last 20 % of life; released at the
     * ground. Only the first rcount instances are drawn. */
    const rn = CFG.parts.rain;
    PARTS._rCap = rn.tiers[TIER.name];
    while (PARTS.rcount > PARTS._rCap) {
      let fi = 0, fd = -1;
      for (let i = 0; i < PARTS.rcount; i++) {
        const it = PARTS._rLive[i];
        const dist2 =
          (it.sx - CAMERA.pos.x) * (it.sx - CAMERA.pos.x) +
          (it.sz - CAMERA.pos.z) * (it.sz - CAMERA.pos.z);
        if (dist2 > fd) { fd = dist2; fi = i; }
      }
      PARTS._rReleaseAt(fi);
    }

    if (PARTS._rainT > 0) {
      PARTS._rainT -= dt;
      PARTS._rainSpawnTimer -= dt;
      while (PARTS._rainSpawnTimer <= 0 && PARTS.rcount < PARTS._rCap) {
        PARTS._rainSpawnTimer += rn.spawnInterval;
        const it = PARTS.rpool.acquire();
        if (!it) break;
        PARTS._spawnRain(it);
      }
    }

    const rmesh = PARTS.rmesh;
    for (let i = PARTS.rcount - 1; i >= 0; i--) {
      const it = PARTS._rLive[i];
      it.age += dt;
      if (it.age >= it.life || it.py <= 0.5) { PARTS._rReleaseAt(i); continue; }
      const u = it.age / it.life;
      it.py += it.vy * dt;
      it.px += Math.sin(t * 1.3 + it.ph) * 0.5 * dt;
      it.pz += Math.cos(t * 1.1 + it.ph) * 0.5 * dt;
      PARTS._rp.set(it.px, it.py, it.pz);
      PARTS._rs.set(0.4, it.len, 0.4);
      PARTS._rm.compose(PARTS._rp, PARTS._qI, PARTS._rs);
      rmesh.setMatrixAt(i, PARTS._rm);
      const a = (u < 0.8 ? 1 : (1 - u) * 5) * 0.85;
      PARTS._rtint.setRGB(it.cR * a, it.cG * a, it.cB * a);
      rmesh.setColorAt(i, PARTS._rtint);
    }
    rmesh.count = PARTS.rcount;
    if (PARTS.rcount > 0) {
      rmesh.instanceMatrix.needsUpdate = true;
      if (rmesh.instanceColor) rmesh.instanceColor.needsUpdate = true;
    }
  },

  /* dev trigger (Key P) + future hooks (M9 awakening rain, M8.4
   * lightning): rain ALL five particle types around the player for
   * CFG.parts.rain.dur seconds — one-time bursts of every type plus
   * the streak/mote trickles driven while _rainT > 0. */
  rainAll() {
    const p = CFG.parts;
    PARTS._rainT = p.rain.dur;
    PARTS._rainSpawnTimer = 0;
    PARTS._pulseSpawnTimer = 0;
    PARTS._lightSpawnTimer = 0;
    const r = PARTS._rng;
    /* steam burst (from the ambient vents — pool = the gate) */
    for (let k = 0; k < p.rain.burst.steam; k++) {
      const src = PARTS._findSource(r, 'cool',
        p.steam.radius, p.steam.innerRadius);
      const it = src ? PARTS.spool.acquire() : null;
      if (it) PARTS._spawnSteam(it, src);
    }
    /* spark burst (from the substations) */
    for (let k = 0; k < p.rain.burst.spark; k++) {
      const src = PARTS._findSource(r, 'sub',
        p.spark.radius, p.spark.innerRadius);
      const it = src ? PARTS.ppool.acquire() : null;
      if (it) PARTS._spawnSpark(it, src);
    }
    /* pulse motes rising from street level */
    for (let k = 0; k < p.rain.burst.pulse; k++) {
      const it = PARTS.mpool.acquire();
      if (it) PARTS._spawnPulse(it);
    }
    /* lightning motes from the far sky */
    for (let k = 0; k < p.rain.burst.light; k++) {
      const it = PARTS.lpool.acquire();
      if (it) PARTS._spawnLight(it);
    }
  },

  /* public API — M9.4 beat 5 + M13.3 cooling emergency: n steam
   * puffs burst from the ambient cooling-tower vents (the pool is
   * the gate — excess is silently dropped). */
  steamBurst(n) {
    const st = CFG.parts.steam;
    const r = PARTS._rng;
    for (let k = 0; k < n; k++) {
      const src = PARTS._findSource(r, 'cool', st.radius, st.innerRadius);
      const it = src ? PARTS.spool.acquire() : null;
      if (it) PARTS._spawnSteam(it, src);
    }
  },

  /* source search for the ambient emitters (moved from TRAFFIC — the
   * M6.4 seam). A 200 m radius holds only ~10 source blocks, so blind
   * random-block draws would starve the emitters: a small live list of
   * the source buildings near the player, rebuilt every few seconds
   * from the same seeded buildingAt path (planning-time allocations
   * only), and a uniform random pick filtered to [inner, radius]. */
  _refreshSources() {
    const R = 210;                       // covers both radii (200 / 170)
    const B = WORLD.BLOCK;
    const pcx = Math.floor(CAMERA.pos.x / B);
    const pcz = Math.floor(CAMERA.pos.z / B);
    const cool = [], subs = [];
    const n = Math.ceil(R / B);
    for (let bx = pcx - n; bx <= pcx + n; bx++) {
      for (let bz = pcz - n; bz <= pcz + n; bz++) {
        const ring = PARTS._ringFor(bx, bz);
        const c = WORLD.buildingAt(bx, bz, ring, ['cool'], 0);
        if (c) cool.push(c);
        const s = WORLD.buildingAt(bx, bz, ring, ['sub'], 0);
        if (s) subs.push(s);
      }
    }
    PARTS._coolList = cool;
    PARTS._subList = subs;
    PARTS._srcTimer = 0;
  },

  /* the block's current player-relative chunk ring — must match how
   * _fill seeds occupancy for that block (ring drives the occupancy)
   * the same way WORLD._sync assigns chunk rings */
  _ringFor(bx, bz) {
    const B = WORLD.BLOCK, K = WORLD.CHUNK;
    const pcx = Math.floor(Math.floor(CAMERA.pos.x / B) / K);
    const pcz = Math.floor(Math.floor(CAMERA.pos.z / B) / K);
    return Math.max(
      Math.abs(Math.floor(bx / K) - pcx),
      Math.abs(Math.floor(bz / K) - pcz));
  },

  _findSource(r, arch, radius, inner) {
    const list = arch === 'cool' ? PARTS._coolList : PARTS._subList;
    for (let i = 0; i < 12; i++) {
      if (list.length === 0) break;
      const b = list[(r() * list.length) | 0];
      const dx = b.x - CAMERA.pos.x;
      const dz = b.z - CAMERA.pos.z;
      const d = Math.hypot(dx, dz);
      if (d <= radius && d >= inner) return b;
    }
    return null;
  },

  /* spawn one steam puff at a cooling-tower vent (replayed seed: the
   * puff always rises from where mass actually is) */
  _spawnSteam(it, src) {
    const st = CFG.parts.steam;
    const r = PARTS._rng;
    it.sx = src.x; it.sy = src.hTop; it.sz = src.z;
    const a = r() * 6.2831853, rr = r() * src.r * 0.5;
    it.px = src.x + Math.cos(a) * rr;
    it.py = src.hTop + 0.3 + r() * 0.8;
    it.pz = src.z + Math.sin(a) * rr;
    it.vy = st.rise[0] + r() * (st.rise[1] - st.rise[0]);
    it.size0 = st.size[0] + r() * (st.size[1] - st.size[0]);
    it.age = 0;
    it.life = st.life[0] + r() * (st.life[1] - st.life[0]);
    it.ph = r() * 6.2831853;
    /* cool bluish-white vapor, slight per-puff variation */
    const b = 0.85 + r() * 0.3;
    it.cR = 0.62 * b; it.cG = 0.72 * b; it.cB = 0.82 * b;
    PARTS._sLive[PARTS.scount++] = it;
    AUDIO.steamHiss(               // M11.3: hiss (M11.4: spatial pool)
      { x: src.x, y: src.hTop, z: src.z });
  },

  /* spawn one spark at a substation roof (brief ballistic life) */
  _spawnSpark(it, src) {
    const sp = CFG.parts.spark;
    const r = PARTS._rng;
    it.sx = src.x; it.sy = src.hTop; it.sz = src.z;
    it.px = src.x + (r() - 0.5) * src.w * 0.5;
    it.py = src.hTop + 0.2 + r() * 1.2;
    it.pz = src.z + (r() - 0.5) * src.w * 0.35;
    const a = r() * 6.2831853;
    const v = sp.speed[0] + r() * (sp.speed[1] - sp.speed[0]);
    it.vx = Math.cos(a) * v;
    it.vz = Math.sin(a) * v;
    it.vy = 0.5 + r() * 1.5;
    it.age = 0;
    it.life = sp.life[0] + r() * (sp.life[1] - sp.life[0]);
    it.ph = r() * 6.2831853;
    /* hot white-amber flash, slight per-spark variation */
    const b = 0.85 + r() * 0.3;
    it.cR = b; it.cG = 0.85 * b; it.cB = 0.55 * b;
    PARTS._pLive[PARTS.pcount++] = it;
  },

  /* spawn one pulse mote rising from street level (or a source roof if
   * given — the M13.2 data-pulse seam) */
  _spawnPulse(it, src) {
    const pu = CFG.parts.pulse;
    const r = PARTS._rng;
    const p = CAMERA.pos;
    if (src) {
      it.sx = src.x; it.sy = src.hTop; it.sz = src.z;
    } else {
      const a = r() * 6.2831853;
      const rad = pu.innerRadius + r() * (pu.radius - pu.innerRadius);
      it.sx = p.x + Math.cos(a) * rad;
      it.sz = p.z + Math.sin(a) * rad;
      it.sy = 1.5;
    }
    it.px = it.sx + (r() - 0.5) * 2;
    it.py = it.sy + 0.2 + r() * 1.5;
    it.pz = it.sz + (r() - 0.5) * 2;
    it.vy = pu.rise[0] + r() * (pu.rise[1] - pu.rise[0]);
    it.sw = 0.3 + r() * 0.6;
    it.age = 0;
    it.life = pu.life[0] + r() * (pu.life[1] - pu.life[0]);
    it.ph = r() * 6.2831853;
    /* data-cyan, slight per-mote variation */
    const b = 0.8 + r() * 0.4;
    it.cR = 0.4 * b; it.cG = 0.85 * b; it.cB = 1 * b;
    PARTS._mLive[PARTS.mcount++] = it;
  },

  /* public API — M8.4 distant lightning: n lightning motes around a
   * far point (x, z) (the strike point). Pool-backed (zero `new`),
   * capped by the pool (excess silently dropped). */
  lightning(x, z, n) {
    for (let k = 0; k < n; k++) {
      const it = PARTS.lpool.acquire();
      if (!it) break;
      PARTS._spawnLightAt(it, x, z);
    }
  },

  /* spawn one lightning mote at a far sky point (M8.4 distant-
   * lightning seam): camera-relative far annulus — falls fast and
   * ages out high up */
  _spawnLight(it) {
    const li = CFG.parts.light;
    const r = PARTS._rng;
    const p = CAMERA.pos;
    const a = r() * 6.2831853;
    const rad = li.radius[0] + r() * (li.radius[1] - li.radius[0]);
    PARTS._spawnLightAt(
      it, p.x + Math.cos(a) * rad, p.z + Math.sin(a) * rad);
  },

  /* place + arm one lightning mote around (cx, cz) (shared by the
   * camera-relative rain path and the M8.4 strike-point path) */
  _spawnLightAt(it, cx, cz) {
    const li = CFG.parts.light;
    const r = PARTS._rng;
    const a = r() * 6.2831853;
    const rad = 20 + r() * 120;   // scatter around the strike point
    it.sx = cx + Math.cos(a) * rad;
    it.sz = cz + Math.sin(a) * rad;
    it.sy = li.altitude[0] + r() * (li.altitude[1] - li.altitude[0]);
    it.px = it.sx; it.py = it.sy; it.pz = it.sz;
    const v = li.speed[0] + r() * (li.speed[1] - li.speed[0]);
    it.vy = -v;
    it.age = 0;
    it.life = (it.sy - 40) / v * (0.8 + r() * 0.4);   // dies high up
    it.ph = r() * 6.2831853;
    /* white-blue flash, slight per-mote variation */
    const b = 0.8 + r() * 0.4;
    it.cR = 0.75 * b; it.cG = 0.88 * b; it.cB = 1 * b;
    PARTS._lLive[PARTS.lcount++] = it;
  },

  /* spawn one rain streak at a sky point inside the hold radius:
   * falls at a fixed speed, life ≈ the fall to the ground */
  _spawnRain(it) {
    const rn = CFG.parts.rain;
    const r = PARTS._rng;
    const p = CAMERA.pos;
    const a = r() * 6.2831853;
    const rad = r() * rn.radius;
    it.sx = p.x + Math.cos(a) * rad;
    it.sz = p.z + Math.sin(a) * rad;
    it.sy = rn.altitude[0] + r() * (rn.altitude[1] - rn.altitude[0]);
    it.px = it.sx; it.py = it.sy; it.pz = it.sz;
    const v = rn.speed[0] + r() * (rn.speed[1] - rn.speed[0]);
    it.vy = -v;
    it.len = rn.len[0] + r() * (rn.len[1] - rn.len[0]);
    it.age = 0;
    it.life = (it.sy - 1) / v * (0.9 + r() * 0.2);
    it.ph = r() * 6.2831853;
    /* energy-cyan, slight per-streak variation */
    const b = 0.7 + r() * 0.5;
    it.cR = 0.45 * b; it.cG = 0.85 * b; it.cB = 1 * b;
    PARTS._rLive[PARTS.rcount++] = it;
  },

  _sReleaseAt(i) {
    const it = PARTS._sLive[i];
    const m = --PARTS.scount;
    if (i !== m) PARTS._sLive[i] = PARTS._sLive[m];
    PARTS._sLive[m] = undefined;
    PARTS.spool.release(it);
  },

  _pReleaseAt(i) {
    const it = PARTS._pLive[i];
    const m = --PARTS.pcount;
    if (i !== m) PARTS._pLive[i] = PARTS._pLive[m];
    PARTS._pLive[m] = undefined;
    PARTS.ppool.release(it);
  },

  _mReleaseAt(i) {
    const it = PARTS._mLive[i];
    const m = --PARTS.mcount;
    if (i !== m) PARTS._mLive[i] = PARTS._mLive[m];
    PARTS._mLive[m] = undefined;
    PARTS.mpool.release(it);
  },

  _lReleaseAt(i) {
    const it = PARTS._lLive[i];
    const m = --PARTS.lcount;
    if (i !== m) PARTS._lLive[i] = PARTS._lLive[m];
    PARTS._lLive[m] = undefined;
    PARTS.lpool.release(it);
  },

  _rReleaseAt(i) {
    const it = PARTS._rLive[i];
    const m = --PARTS.rcount;
    if (i !== m) PARTS._rLive[i] = PARTS._rLive[m];
    PARTS._rLive[m] = undefined;
    PARTS.rpool.release(it);
  },

  dispose() {
    for (let i = PARTS.scount - 1; i >= 0; i--) PARTS._sReleaseAt(i);
    for (let i = PARTS.pcount - 1; i >= 0; i--) PARTS._pReleaseAt(i);
    for (let i = PARTS.mcount - 1; i >= 0; i--) PARTS._mReleaseAt(i);
    for (let i = PARTS.lcount - 1; i >= 0; i--) PARTS._lReleaseAt(i);
    for (let i = PARTS.rcount - 1; i >= 0; i--) PARTS._rReleaseAt(i);
    if (PARTS.smesh) {
      scene.remove(PARTS.smesh);
      PARTS.smesh.geometry.dispose();
      PARTS.smesh.material.dispose();   // map = shared KIT glow texture
    }
    if (PARTS.spoints) {
      scene.remove(PARTS.spoints);
      PARTS.spoints.geometry.dispose();
      PARTS.spoints.material.map.dispose();   // own warm glow texture
      PARTS.spoints.material.dispose();
    }
    if (PARTS.mpoints) {
      scene.remove(PARTS.mpoints);
      PARTS.mpoints.geometry.dispose();
      PARTS.mpoints.material.dispose();       // map = shared KIT texture
    }
    if (PARTS.lpoints) {
      scene.remove(PARTS.lpoints);
      PARTS.lpoints.geometry.dispose();
      PARTS.lpoints.material.map.dispose();   // own white glow texture
      PARTS.lpoints.material.dispose();
    }
    if (PARTS.rmesh) {
      scene.remove(PARTS.rmesh);
      PARTS.rmesh.geometry.dispose();
      /* material = shared MATS.pulseGlow (M6.3) — not disposed here */
    }
  },
};

/* ==================================================================== *
 * FX — pulse (M7.2) + electrical arcs (M7.3) + screen flash (M7.4);
 *     camera shake (M7.5) lives in CAMERA — it is consumed there
 *
 *  - FX.pulse(origin, radius, color): expanding ground ring on ONE
 *    shared InstancedMesh (per-instance color = tint × fade on the
 *    shared additive MATS.pulseGlow — the color IS the light) plus a
 *    light-intensity ramp (one pooled PointLight per live pulse,
 *    invisible while idle ⇒ no light slot cost at rest)
 *  - FX.arc(a, b, color): electrical bolt between two anchor points on
 *    ONE shared LineSegments — main polyline (perpendicular jitter,
 *    zero at the anchors) + 3 short forks; the whole slot is re-jittered
 *    (REGENERATED) every CFG.fx.arcs.regenFrames frames ⇒ the bolt
 *    flickers. Per-vertex color = tint × sin-fade (forks dimmer)
 *  - state lives in the M6.1 pools 'fx-pulse' / 'fx-arc' (fixed
 *    capacity = HIGH tier cap ⇒ zero `new` after init); tier caps =
 *    CFG.fx.<kind>.tiers[TIER.name], same farthest-release trim as the
 *    M6/M7 fleets
 *  - 0 live ⇒ ring count 0 + lights invisible + arc drawRange 0
 *    ⇒ 0 draw calls added
 *  - FX.flash(intensity, color): screen-space flash — one additive
 *    plane (PlaneGeometry 2×2, toneMapped-off MeshBasicMaterial) in a
 *    tiny overlay scene + ortho NDC camera, rendered after the main
 *    scene ONLY while the level is > 0. Level clamps to
 *    0..CFG.fx.flash.max, re-trigger = max (never accumulates),
 *    exponential decay (τ = CFG.fx.flash.decay) with a snap to 0 ⇒
 *    0 flash = hidden plane = 0 draw calls added. Material color =
 *    tint × level IS the additive amount. Dev trigger: Key B
 *  - audio thump/crackle/whoosh: wired in M11.3 (seam: the
 *    pulse()/arc()/flash() call sites), spatially mixed in M11.4
 *    (panner + distance gain for the 2–3 nearest emitters; the rest
 *    folds into the ambient master)
 * --------------------------------------------------------------------- */
const FX = {
  name: 'FX',
  ring: null,            // shared InstancedMesh (one draw call)
  count: 0,              // live pulses (= ring.count)
  _pool: null,
  _live: null,
  _lights: [],
  _cap: 0,
  /* M7.3: electrical arcs */
  arcs: null,            // shared LineSegments (one draw call)
  arcCount: 0,           // live arcs (= drawRange / verts per arc)
  _arcPool: null,
  _arcLive: null,
  _arcCap: 0,
  _arcTick: 0,           // regen counter (regen on wrap to 0)
  _arcVerts: 0,          // line vertices per arc (segs × 2)
  _arcPos: null,         // pre-allocated position buffer
  _arcCol: null,         // pre-allocated color buffer
  _arcMat: null,
  _arcPts: new Float32Array(13 * 3),  // main-bolt points scratch
  _arcVa: new THREE.Vector3(),
  _arcCap2: 0,
  /* M7.4: screen-space flash */
  _flashScene: null,       // tiny overlay scene (one plane)
  _flashCam: null,         // ortho NDC camera
  _flashPlane: null,      // the additive full-screen plane (one draw call)
  _flashMat: null,
  _flash: 0,               // current flash level (0..CFG.fx.flash.max)
  _flashTint: null,        // working-space tint
  /* scratch (zero per-frame allocation) */
  _m: new THREE.Matrix4(),
  _p: new THREE.Vector3(),
  _s: new THREE.Vector3(1, 1, 1),
  _q: new THREE.Quaternion(),
  _c: new THREE.Color(),
  _fire: new THREE.Vector3(),

  init() {
    const hi = CFG.fx.pulse.tiers.high;
    /* expanding ring: flat annulus whose outer edge is 1.0 ⇒ the
     * instance XZ scale IS the ring radius. Ground-plane (normal +Y),
     * shared additive material ⇒ per-instance color IS the light. */
    const geo = new THREE.RingGeometry(0.92, 1.0, 48);
    geo.rotateX(-Math.PI / 2);
    FX.ring = new THREE.InstancedMesh(geo, MATS.pulseGlow, hi);
    FX.ring.count = 0;
    FX.ring.frustumCulled = false;
    FX.ring.name = 'fx-pulse-ring';
    scene.add(FX.ring);
    FX._live = new Array(hi);
    FX._pool = POOL.make('fx-pulse', hi, () => ({
      ox: 0, oy: 0, oz: 0,   // origin (metres)
      R: 40,                // target radius (metres)
      age: 0, life: 1.6,
      cR: 0.4, cG: 0.88, cB: 1,   // tint (× fade per frame)
    }));
    /* light-intensity ramp: one pooled PointLight per live pulse
     * (slot i ⇔ _live[i] every frame; invisible while idle) */
    const L = CFG.fx.pulse.light;
    FX._lights = new Array(hi);
    for (let i = 0; i < hi; i++) {
      const p = new THREE.PointLight(0xffffff, 0, L.distance, L.decay);
      p.visible = false;
      scene.add(p);
      FX._lights[i] = p;
    }
    FX._cap = CFG.fx.pulse.tiers[TIER.name];
    /* M7.3: electrical arcs — one shared LineSegments with pre-
     * allocated position + color buffers (zero `new` after init);
     * drawRange tracks the live count ⇒ 0 live = 0 draw calls. */
    const acf = CFG.fx.arcs;
    const segs = acf.mainSegs + acf.branches * acf.branchSegs;
    FX._arcVerts = segs * 2;
    FX._arcCap2 = acf.mainSegs * 2;      // fork vertices start here
    const hiA = acf.tiers.high;
    FX._arcPos = new Float32Array(hiA * FX._arcVerts * 3);
    FX._arcCol = new Float32Array(hiA * FX._arcVerts * 3);
    const ag = new THREE.BufferGeometry();
    ag.setAttribute('position', new THREE.BufferAttribute(FX._arcPos, 3));
    ag.setAttribute('color', new THREE.BufferAttribute(FX._arcCol, 3));
    ag.setDrawRange(0, 0);
    FX._arcMat = new THREE.LineBasicMaterial({
      vertexColors: true, transparent: true,
      blending: THREE.AdditiveBlending, depthWrite: false,
    });
    FX.arcs = new THREE.LineSegments(ag, FX._arcMat);
    FX.arcs.frustumCulled = false;
    FX.arcs.name = 'fx-arcs';
    scene.add(FX.arcs);
    FX._arcLive = new Array(hiA);
    FX._arcPool = POOL.make('fx-arc', hiA, () => ({
      ax: 0, ay: 0, az: 0, bx: 0, by: 0, bz: 0,  // anchors (metres)
      age: 0, life: 2.2,
      cR: 0.75, cG: 0.9, cB: 1,                  // tint (× fade per frame)
      j: new Float32Array(48),                  // regen jitter scratch
    }));
    FX._arcCap = acf.tiers[TIER.name];
    /* M7.4: screen-space flash — one additive plane in a tiny overlay
     * scene, rendered after the main scene ONLY while the flash is
     * alive ⇒ 0 flash = 0 draw calls added. The plane spans the NDC
     * square; material color = tint × level IS the additive amount
     * (toneMapped off ⇒ the flash is raw, not tone-mapped). */
    FX._flashScene = new THREE.Scene();
    FX._flashCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    FX._flashMat = new THREE.MeshBasicMaterial({
      color: 0xffffff, transparent: true, opacity: 1,
      blending: THREE.AdditiveBlending, depthTest: false, depthWrite: false,
      toneMapped: false,
    });
    FX._flashPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(2, 2), FX._flashMat);
    FX._flashPlane.frustumCulled = false;
    FX._flashPlane.name = 'fx-flash';
    FX._flashPlane.visible = false;
    FX._flashScene.add(FX._flashPlane);
    FX._flashTint = new THREE.Color(CFG.fx.flash.color);
    FX._flash = 0;
  },

  /* public API — M9.4 plaza pulse, M13.2 data pulse, dev trigger Key R.
   * origin: Vector3-like {x,y,z}; radius: target radius (m, default
   * CFG.fx.pulse.radius); color: THREE.Color or hex; life: optional
   * override in s (default CFG.fx.pulse.life). Returns the pool item
   * (null = cap hit, nothing allocated, nothing thrown). */
  pulse(origin, radius, color, life) {
    const it = FX._pool.acquire();
    if (!it) return null;
    it.ox = origin.x; it.oy = origin.y; it.oz = origin.z;
    it.R = radius > 0 ? radius : CFG.fx.pulse.radius;
    it.age = 0;
    it.life = life > 0 ? life : CFG.fx.pulse.life;
    if (color && color.isColor) {
      it.cR = color.r; it.cG = color.g; it.cB = color.b;
    } else if (typeof color === 'number') {
      FX._c.setHex(color);
      it.cR = FX._c.r; it.cG = FX._c.g; it.cB = FX._c.b;
    } else {
      FX._c.setHex(CFG.fx.pulse.color);
      it.cR = FX._c.r; it.cG = FX._c.g; it.cB = FX._c.b;
    }
    FX._live[FX.count++] = it;
    AUDIO.pulseThump(origin);        // M11.3: thump (M11.4: spatial pool)
    return it;
  },

  /* public API — M9.4 cascade cleanup: drop one live pulse item
   * (swap-remove + pool release) even mid-life. No-op for foreign or
   * already-released items. */
  dropPulse(it) {
    if (!it || it.__pool !== FX._pool || it.__free) return;
    for (let i = FX.count; i-- > 0;) {
      if (FX._live[i] !== it) continue;
      const m = --FX.count;
      if (i !== m) FX._live[i] = FX._live[m];
      FX._live[m] = undefined;
      break;
    }
    FX._pool.release(it);
  },

  /* public API — M9.4 cascade cleanup: drop one live arc item
   * (swap-remove + pool release) even mid-life. No-op for foreign or
   * already-released items. */
  dropArc(it) {
    if (!it || it.__pool !== FX._arcPool || it.__free) return;
    for (let i = FX.arcCount; i-- > 0;) {
      if (FX._arcLive[i] !== it) continue;
      FX._arcReleaseAt(i);
      break;
    }
  },

  /* public API — M9.4 substation cascade, M13.4 EM discharge, dev
   * trigger Key T. a/b: Vector3-like {x,y,z} anchors. Returns the pool
   * item (null = cap hit, nothing allocated, nothing thrown). */
  arc(a, b, color) {
    const it = FX._arcPool.acquire();
    if (!it) return null;
    it.ax = a.x; it.ay = a.y; it.az = a.z;
    it.bx = b.x; it.by = b.y; it.bz = b.z;
    it.age = 0;
    it.life = CFG.fx.arcs.life;
    if (color && color.isColor) {
      it.cR = color.r; it.cG = color.g; it.cB = color.b;
    } else if (typeof color === 'number') {
      FX._c.setHex(color);
      it.cR = FX._c.r; it.cG = FX._c.g; it.cB = FX._c.b;
    } else {
      FX._c.setHex(CFG.fx.arcs.color);
      it.cR = FX._c.r; it.cG = FX._c.g; it.cB = FX._c.b;
    }
    FX._arcLive[FX.arcCount++] = it;
    FX._regenArc(FX.arcCount - 1);
    FX.arcs.geometry.setDrawRange(0, FX.arcCount * FX._arcVerts);
    FX.arcs.geometry.attributes.position.needsUpdate = true;
    AUDIO.arcCrackle(               // M11.3: crackle (M11.4: spatial pool)
      { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, z: (a.z + b.z) / 2 });
    return it;
  },

  /* public API — M8.4 lightning, M9.3 beat-1 flare, dev trigger Key B.
   * intensity: flash level, clamped to 0..CFG.fx.flash.max — a re-
   * trigger raises to max(current, intensity), it never accumulates;
   * color: THREE.Color or hex (default CFG.fx.flash.color). Returns
   * the resulting flash level. */
  flash(intensity, color) {
    const v = Math.max(0, Math.min(+intensity || 0, CFG.fx.flash.max));
    if (v > FX._flash) FX._flash = v;
    if (color && color.isColor) {
      FX._flashTint.copy(color);
    } else if (typeof color === 'number') {
      FX._flashTint.setHex(color);
    } else {
      FX._flashTint.setHex(CFG.fx.flash.color);
    }
    /* no audio: the flash is silent — M11.3 events cover pulse/arc/
     * steam/drone (lightning/arc events carry the crackle). */
    return FX._flash;
  },

  /* rebuild one arc slot: refill the jitter scratch with fresh randoms
   * and re-emit the bolt polyline (main + forks) into the pre-
   * allocated buffers — this IS the "regenerated every N frames" step,
   * zero allocation. */
  _regenArc(i) {
    const it = FX._arcLive[i];
    const cf = CFG.fx.arcs;
    const j = it.j;
    for (let k = 0; k < 46; k++) j[k] = Math.random();
    /* unit direction + perpendicular basis (p1, p2) */
    const dx0 = it.bx - it.ax, dy0 = it.by - it.ay, dz0 = it.bz - it.az;
    const dl = Math.hypot(dx0, dy0, dz0) || 1;
    const dx = dx0 / dl, dy = dy0 / dl, dz = dz0 / dl;
    let p1x = -dz, p1z = dx;                 // cross(dir, up), y = 0
    const pl = Math.hypot(p1x, p1z);
    if (pl < 0.001) { p1x = 1; p1z = 0; }
    else { p1x /= pl; p1z /= pl; }
    const p2x = dy * p1z, p2y = dz * p1x - dx * p1z, p2z = -dy * p1x;
    /* main bolt: jittered polyline, zero offset at both anchors */
    const pts = FX._arcPts;
    for (let m = 0; m <= cf.mainSegs; m++) {
      const t = m / cf.mainSegs;
      let px = it.ax + dx * t * dl;
      let py = it.ay + dy * t * dl;
      let pz = it.az + dz * t * dl;
      if (m > 0 && m < cf.mainSegs) {
        const amp = Math.sin(t * Math.PI) * cf.jitter;
        const th = j[2 * m - 2] * 6.2831853;
        const rr = (0.3 + 0.7 * j[2 * m - 1]) * amp;
        px += p1x * Math.cos(th) * rr + p2x * Math.sin(th) * rr;
        py += p2y * Math.sin(th) * rr;
        pz += p1z * Math.cos(th) * rr + p2z * Math.sin(th) * rr;
      }
      pts[m * 3] = px; pts[m * 3 + 1] = py; pts[m * 3 + 2] = pz;
    }
    /* emit the slot: main segments, then the forks (dimmer) */
    const pos = FX._arcPos, col = FX._arcCol;
    const v0 = i * FX._arcVerts;
    let v = v0;
    const put = (x1, y1, z1, x2, y2, z2, br) => {
      pos[v] = x1; pos[v + 1] = y1; pos[v + 2] = z1;
      pos[v + 3] = x2; pos[v + 4] = y2; pos[v + 5] = z2;
      col[v] = it.cR * br; col[v + 1] = it.cG * br; col[v + 2] = it.cB * br;
      col[v + 3] = it.cR * br; col[v + 4] = it.cG * br; col[v + 5] = it.cB * br;
      v += 6;
    };
    for (let m = 0; m < cf.mainSegs; m++) {
      put(pts[m * 3], pts[m * 3 + 1], pts[m * 3 + 2],
          pts[m * 3 + 3], pts[m * 3 + 4], pts[m * 3 + 5], 1.0);
    }
    for (let k = 0; k < cf.branches; k++) {
      const jo = 22 + 8 * k;
      const a = 3 + 3 * k;                   // fork attaches at main pt 3/6/9
      const mx = pts[a * 3], my = pts[a * 3 + 1], mz = pts[a * 3 + 2];
      const phi = j[jo] * 6.2831853;
      const tilt = j[jo + 1] * 1.2 - 0.6;
      const s = 0.7 + 0.6 * j[jo + 2];
      let fx = p1x * Math.cos(phi) + p2x * Math.sin(phi) + dx * tilt;
      let fy = p2y * Math.sin(phi) + dy * tilt;
      let fz = p1z * Math.cos(phi) + p2z * Math.sin(phi) + dz * tilt;
      const fl = Math.hypot(fx, fy, fz) || 1;
      fx /= fl; fy /= fl; fz /= fl;
      let px = mx, py = my, pz = mz;
      for (let m2 = 1; m2 <= cf.branchSegs; m2++) {
        const step = 2.6 * s;
        const th2 = j[jo + 3 + (m2 - 1) * 2] * 6.2831853;
        const rr2 = j[jo + 4 + (m2 - 1) * 2] * 1.0;
        put(px, py, pz,
            px + fx * step + Math.cos(th2) * rr2,
            py + fy * step + Math.sin(th2) * rr2 * 0.5,
            pz + fz * step + Math.sin(th2 * 2) * rr2, 0.55);
        px += fx * step; py += fy * step; pz += fz * step;
      }
    }
  },

  _regenAll() {
    for (let i = 0; i < FX.arcCount; i++) FX._regenArc(i);
    FX.arcs.geometry.attributes.position.needsUpdate = true;
  },

  /* dev trigger (Key T): one substation→substation bolt (the two
   * nearest live substations) + one creature→ring-road bolt (antenna
   * tip → a ring-road lane point at a vehicle altitude) */
  _fireArcs() {
    const cf = CFG.fx.arcs;
    const p = CAMERA.pos;
    const list = PARTS._subList;
    if (list.length >= 2) {
      let a = -1, b = -1, da = Infinity, db = Infinity;
      for (let i = 0; i < list.length; i++) {
        const s = list[i];
        const d = Math.hypot(s.x - p.x, s.z - p.z);
        if (d < da) { db = da; b = a; a = i; da = d; }
        else if (d < db) { db = d; b = i; }
      }
      const s1 = list[a], s2 = list[b];
      FX.arc({ x: s1.x, y: s1.hTop + 0.5, z: s1.z },
             { x: s2.x, y: s2.hTop + 0.5, z: s2.z });
    }
    const tip = ENTITY.parts.antenna1;
    tip.getWorldPosition(FX._arcVa);
    FX._arcVa.y += 12.4;              // mast top + tip box
    const alts = CFG.traffic.vehicle.altitudes;
    const alt = alts[(Math.random() * alts.length) | 0];
    FX.arc(FX._arcVa,
           { x: cf.ringLane, y: alt, z: (Math.random() * 2 - 1) * cf.ringZ });
  },

  _arcReleaseAt(i) {
    const it = FX._arcLive[i];
    const m = --FX.arcCount;
    if (i !== m) {
      FX._arcLive[i] = FX._arcLive[m];
      FX._regenArc(i);                // the moved arc keeps its slot
    }
    FX._arcLive[m] = undefined;
    FX._arcPool.release(it);
    FX.arcs.geometry.setDrawRange(0, FX.arcCount * FX._arcVerts);
    FX.arcs.geometry.attributes.position.needsUpdate = true;
  },

  update(dt, t) {
    /* dev trigger (Key R edge from INPUT): pulse ahead of the player */
    if (INPUT.pulseTrigger) {
      INPUT.pulseTrigger = false;
      const p = CAMERA.pos;
      const sy = Math.sin(CAMERA.yaw), cy = Math.cos(CAMERA.yaw);
      const d = CFG.fx.pulse.radius * 0.8;   // 32 m ahead on the ground
      FX.pulse(
        FX._fire.set(p.x - sy * d, 0.5, p.z - cy * d),
        CFG.fx.pulse.radius, CFG.fx.pulse.color);
    }

    const cf = CFG.fx.pulse;
    /* tier cap: trim the farthest pulses down to the tier limit */
    FX._cap = cf.tiers[TIER.name];
    while (FX.count > FX._cap) {
      let fi = 0, fd = -1;
      for (let i = 0; i < FX.count; i++) {
        const it = FX._live[i];
        const dist2 =
          (it.ox - CAMERA.pos.x) * (it.ox - CAMERA.pos.x) +
          (it.oz - CAMERA.pos.z) * (it.oz - CAMERA.pos.z);
        if (dist2 > fd) { fd = dist2; fi = i; }
      }
      FX._releaseAt(fi);
    }

    /* per-frame: ease-out expansion to the requested radius, sin-fade
     * color, and the light-intensity ramp (sharp sin² peak). Only the
     * first FX.count instances are drawn. */
    const ring = FX.ring;
    for (let i = FX.count - 1; i >= 0; i--) {
      const it = FX._live[i];
      it.age += dt;
      if (it.age >= it.life) { FX._releaseAt(i); continue; }
      const u = it.age / it.life;
      const e = 1 - Math.pow(1 - u, 3);      // ease-out expansion
      const R = 2 + (it.R - 2) * e;           // grows out of 2 m
      FX._p.set(it.ox, it.oy + 0.35, it.oz);
      FX._s.set(R, 1, R);
      FX._m.compose(FX._p, FX._q, FX._s);
      ring.setMatrixAt(i, FX._m);
      const a = Math.sin(u * Math.PI) * 0.9;
      FX._c.setRGB(it.cR * a, it.cG * a, it.cB * a);
      ring.setColorAt(i, FX._c);
      /* light-intensity ramp: peak around mid-life, zero at both ends */
      const L = FX._lights[i];
      L.position.set(it.ox, it.oy + 6, it.oz);
      L.color.setRGB(it.cR, it.cG, it.cB);
      const k = Math.sin(u * Math.PI);
      L.intensity = cf.light.intensity * k * k;
    }
    ring.count = FX.count;
    if (FX.count > 0) {
      ring.instanceMatrix.needsUpdate = true;
      if (ring.instanceColor) ring.instanceColor.needsUpdate = true;
    }
    /* the light pool tracks the live list: slot i ⇔ _live[i]; a hidden
     * light always sits at intensity 0 (no stale ramp value) */
    for (let i = 0; i < FX._lights.length; i++) {
      const L = FX._lights[i];
      const on = i < FX.count;
      L.visible = on;
      if (!on) L.intensity = 0;
    }

    /* ---- M7.3: electrical arcs ---- */
    if (INPUT.arcTrigger) {
      INPUT.arcTrigger = false;
      FX._fireArcs();
    }
    if (FX.arcCount > 0) {
      const acf = CFG.fx.arcs;
      /* tier cap: trim the farthest arcs down to the tier limit */
      FX._arcCap = acf.tiers[TIER.name];
      while (FX.arcCount > FX._arcCap) {
        let fi = 0, fd = -1;
        for (let i = 0; i < FX.arcCount; i++) {
          const it = FX._arcLive[i];
          const mx = (it.ax + it.bx) * 0.5 - CAMERA.pos.x;
          const mz = (it.az + it.bz) * 0.5 - CAMERA.pos.z;
          const dist2 = mx * mx + mz * mz;
          if (dist2 > fd) { fd = dist2; fi = i; }
        }
        FX._arcReleaseAt(fi);
      }
      /* age + release expired discharges */
      for (let i = FX.arcCount - 1; i >= 0; i--) {
        const it = FX._arcLive[i];
        it.age += dt;
        if (it.age >= it.life) FX._arcReleaseAt(i);
      }
      /* REGENERATE: re-jitter every bolt every N frames (frame-cheap —
       * ≤ 8 × 42 vertices of pre-allocated buffer writes) */
      FX._arcTick = (FX._arcTick + 1) % acf.regenFrames;
      if (FX._arcTick === 0) FX._regenAll();
      /* per-frame sin-fade on the vertex colors (forks dimmer) */
      const col = FX._arcCol;
      for (let i = 0; i < FX.arcCount; i++) {
        const it = FX._arcLive[i];
        const u = it.age / it.life;
        const f = Math.sin(u * Math.PI);
        const v0 = i * FX._arcVerts;
        for (let v2 = 0; v2 < FX._arcVerts; v2 += 2) {
          const br = v2 >= FX._arcCap2 ? 0.55 : 1.0;
          const c = v0 + v2;
          col[c * 3] = it.cR * f * br;
          col[c * 3 + 1] = it.cG * f * br;
          col[c * 3 + 2] = it.cB * f * br;
        }
      }
      if (FX.arcCount > 0) {
        FX.arcs.geometry.attributes.color.needsUpdate = true;
      }
    }
    /* 0 live ⇒ the shared LineSegments is hidden ⇒ 0 draw calls added
     * (three r160 does not skip drawRange-0 objects) */
    FX.arcs.visible = FX.arcCount > 0;

    /* ---- M7.4: screen-space flash — exponential decay to zero ---- */
    if (INPUT.flashTrigger) {
      INPUT.flashTrigger = false;
      FX.flash(CFG.fx.flash.max, CFG.fx.flash.color);
    }
    if (FX._flash > 0) {
      FX._flash *= Math.exp(-dt / CFG.fx.flash.decay);
      if (FX._flash < 1 / 256) FX._flash = 0;   // snap ⇒ hidden again
    }
    FX._flashPlane.visible = FX._flash > 0;
    if (FX._flash > 0) {
      /* material color = tint × level IS the additive amount */
      FX._flashMat.color.setRGB(
        FX._flashTint.r * FX._flash,
        FX._flashTint.g * FX._flash,
        FX._flashTint.b * FX._flash);
    }
  },

  _releaseAt(i) {
    const it = FX._live[i];
    const m = --FX.count;
    if (i !== m) FX._live[i] = FX._live[m];
    FX._live[m] = undefined;
    FX._pool.release(it);
  },

  dispose() {
    for (let i = FX.count - 1; i >= 0; i--) FX._releaseAt(i);
    for (let i = FX.arcCount - 1; i >= 0; i--) FX._arcReleaseAt(i);
    if (FX.ring) {
      scene.remove(FX.ring);
      FX.ring.geometry.dispose();
      /* material = shared MATS.pulseGlow (M4) — not disposed here */
    }
    for (const L of FX._lights) scene.remove(L);
    if (FX.arcs) {
      scene.remove(FX.arcs);
      FX.arcs.geometry.dispose();
      FX._arcMat.dispose();
    }
  },
};

/* ==================================================================== *
 * ENTITY — the Qwen machine-creature, DORMANT (M5)
 *
 *  - central plaza (WORLD keeps ±2 blocks clear): darkened mega-core
 *    pedestal + a colossal machine ~65 m tall (several buildings high)
 *  - built from primitives only: server-tower torso, cooling-tower
 *    shoulders, glowing compute-core head/face, mechanical limbs,
 *    antennas, three rotating tensor torus rings (idle: almost still,
 *    dim)
 *  - named rig parts with transform roots so M9 can animate them:
 *    pedestal, spine, torso, head, jaw, coreEye, ringA..C, armL/armR,
 *    shoulderL/R, antenna1..4 (head group → jaw/coreEye pivot off it)
 *  - dormant state: slow breathing scale on the core, ~1 % dim node
 *    LEDs, minimal steam drip (pooled points, 32 puffs, 4 vents),
 *    hero point light #0 claimed for the dim core glow (the heartbeat
 *    audio itself is M11)
 *  - thousands of compute-node voxels: ONE InstancedMesh with
 *    per-instance color (unlit material ⇒ the color IS the emissive);
 *    these are the nodes that ignite at awakening (M9)
 * --------------------------------------------------------------------- */
const ENTITY = {
  name: 'ENTITY',
  state: 'DORMANT',                 // M9.2: DORMANT → STIR → AWAKE → DECAY
  stateT: 0,                       // M9.2: time the current state was entered (s)
  _wakeHooks: null,               // M9.2: per-state enter hooks {STATE: [fn]}
  _wakeCount: 0,                  // M9.2: awakenings triggered (smoke/dev)
  _awakeDur: 0,                   // M9.2: picked AWAKE hold (s, seeded)
  _ringAng: [0, 0, 0],           // M9.2: integrated ring angles (rad)
  _awakeT0: 0,                  // M9.3: AWAKE entry time (beat 2 wave t0)
  _ignited: false,              // M9.3: node grid lit (beat 2 in flight)
  _surgeP: 0,                   // M9.3: beat-3 surge level 0..1
  _surgeFired: false,           // M9.3: shake fired this sequence
  _cascadeFired: false,        // M9.4: beat 4 fired this sequence
  _trafficFired: false,        // M9.4: beat 5 fired this sequence
  _eggFired: false,           // M9.5: beat 6 fired this sequence
  _pulseIt: null,              // M9.4: the plaza pulse pool item (dropped at DORMANT)
  _finalPulseIt: null,        // M9.5: beat 7 final pulse pool item
  _beatAt: { flare: 0, ignite: 0, surge: 0, cascade: 0, traffic: 0, egg: 0 },
  // M9.3/M9.4/M9.5: beat start times
  _tiltE: null,                 // M9.3: per-ring tilt Euler scratch
  _tiltQ: null,                 // M9.3: per-ring tilt quaternion scratch
  _surgeDir: null,              // M9.3: per-ring tilt directions (x, z)
  _flareCol: null,              // M9.3: beat-1 flare color (pre-allocated)
  _eggReact: null,             // M9.5: beat-6 easter-egg reaction hooks (M10.3)
  _dimSpeed: 0,               // M9.5: beat-7 decay dim-front speed (m/s)
  root: null,
  parts: {},
  core: null,                       // breathing group (torso/head/jaw/coreEye)
  nodes: null,                     // single InstancedMesh (thousands of nodes)
  nodeCount: 0,
  ringSpin: [0.06, -0.045, 0.035], // rad/s idle — "almost still, dim"
  _antPh: [0, 1.7, 3.9, 5.4],   // M9.1: per-antenna sway phase (rad)
  _dream: null,                 // M9.1: dream wave {active, t0, nextAt, maxR}
  _dreamRng: null,              // M9.1: seeded rng (wave interval jitter)
  _nodeBase: null,              // M9.1: dormant instance colors (byte-exact restore)
  _nodeHue: null,               // M9.1: per-node normalized hue (3·n)
  _nodeBright: null,            // M9.1: per-node dormant brightness (n)
  _nodePos: null,               // M9.1: per-node position (3·n)
  _nodeDist: null,              // M9.1: per-node distance from dream origin (n)
  _steam: null,
  _steamPars: null,
  _coreA: new THREE.Color(0x173d52),
  _coreB: new THREE.Color(0x3f96cc),
  _col: new THREE.Color(),

  init() {
    const R = new THREE.Group();
    R.name = 'ENTITY-root';
    scene.add(R);
    ENTITY.root = R;
    const P = ENTITY.parts;
    const merge = parts => KIT.mergeGeometries(parts);
    const box = (w, h, d, x, y, z) => ({
      geo: new THREE.BoxGeometry(w, h, d),
      matrix: new THREE.Matrix4().makeTranslation(x, y, z),
    });
    const cyl = (r, h, x, y, z, seg = 14) => ({
      geo: new THREE.CylinderGeometry(r, r, h, seg),
      matrix: new THREE.Matrix4().makeTranslation(x, y, z),
    });
    /* dedicated hero body mass: Standard, faint blue emissive lift so the
     * silhouette volume reads on key-light-opposite faces (night scene) */
    const matBody = new THREE.MeshStandardMaterial({
      color: 0x5b6b82, roughness: 0.5, metalness: 0.7,
      emissive: 0x0a1826, emissiveIntensity: 0.5,
    });
    const matPed = new THREE.MeshLambertMaterial({ color: 0x141c2a });
    const matRing = new THREE.MeshBasicMaterial({ color: 0x1d4c60 });
    const matTip = MATS.pulseGlow.clone();
    matTip.color.set(0x2a6d8c);
    const matEye = new THREE.MeshBasicMaterial({ color: 0x1f4f66 });

    /* ---- pedestal: darkened mega-core platform, 3 steps (0 → 5.6 m) ---- */
    const ped = new THREE.Mesh(
      merge([
        cyl(21, 2, 0, 1, 0, 28),
        cyl(17.5, 2, 0, 3, 0, 24),
        cyl(14, 1.6, 0, 4.8, 0, 20),
      ]),
      matPed,
    );
    ped.name = 'pedestal';
    P.pedestal = ped;
    R.add(ped);

    /* ---- spine: pelvis / waist / lower back (5.6 → 18.6 m) ---- */
    const spine = new THREE.Mesh(
      merge([
        box(10, 4, 9, 0, 7.6, 0),
        box(8.5, 4.4, 8, 0, 11.8, 0),
        box(7.5, 4.6, 7.5, 0, 16.3, 0),
      ]),
      matBody,
    );
    spine.name = 'spine';
    P.spine = spine;
    R.add(spine);

    /* ---- core: the breathing group (torso mass + face panels + head) ---- */
    const core = new THREE.Group();
    core.name = 'ENTITY-core';
    P.core = core;
    ENTITY.core = core;
    R.add(core);

    /* torso: server-tower mass (18.6 → 43.6 m) */
    const torso = new THREE.Mesh(
      merge([
        box(14, 8, 14, 0, 22.6, 0),
        box(12, 9, 12, 0, 31.1, 0),
        box(9.5, 5, 9.5, 0, 38.1, 0),
        box(4.5, 3, 4.5, 0, 42.1, 0),
      ]),
      matBody,
    );
    torso.name = 'torso';
    P.torso = torso;
    core.add(torso);

    /* emissive data-panel bands on the torso facades (dim, Lambert) */
    const chest = new THREE.Mesh(
      merge([
        box(11, 6.2, 0.3, 0, 31.1, 6.1),
        box(11, 6.2, 0.3, 0, 31.1, -6.1),
        box(8.9, 3.6, 0.3, 0, 38.1, 4.82),
        box(8.9, 3.6, 0.3, 0, 38.1, -4.82),
      ]),
      MATS.server,
    );
    chest.name = 'chestPanels';
    core.add(chest);

    /* head: skull + brow + crown, pivot at the neck (43.6 m) */
    const head = new THREE.Group();
    head.position.set(0, 43.6, 0);
    head.name = 'head';
    P.head = head;
    const skull = new THREE.Mesh(
      merge([
        box(8, 7, 8, 0, 3.5, 0),
        box(8.2, 1.6, 8.2, 0, 4.9, 0),
        box(6, 2, 6, 0, 6.6, 0),
      ]),
      matBody,
    );
    skull.name = 'head-mass';
    head.add(skull);

    /* coreEye: the glowing compute-core face (unlit — color IS emissive) */
    const eye = new THREE.Mesh(new THREE.BoxGeometry(5.2, 1.8, 0.8), matEye);
    eye.position.set(0, 3.6, 4.0);
    eye.name = 'coreEye';
    P.coreEye = eye;
    head.add(eye);
    core.add(head);

    /* jaw: hinged under the head, pivot at its top edge */
    const jaw = new THREE.Group();
    jaw.position.set(0, 44.4, 2.2);
    jaw.name = 'jaw';
    P.jaw = jaw;
    const jawMesh = new THREE.Mesh(new THREE.BoxGeometry(4.5, 2.2, 5.5), matBody);
    jawMesh.position.set(0, -1.1, -0.2);
    jawMesh.name = 'jaw-mass';
    jaw.add(jawMesh);
    core.add(jaw);

    /* ---- shoulders: cooling-tower masses, base at 30 m ---- */
    for (const side of [-1, 1]) {
      const sh = new THREE.Group();
      sh.position.set(side * 12.5, 30, 0);
      sh.name = side < 0 ? 'shoulderL' : 'shoulderR';
      P[side < 0 ? 'shoulderL' : 'shoulderR'] = sh;
      const m = new THREE.Mesh(
        merge([
          box(10.5, 1.6, 10.5, 0, 0.8, 0),
          cyl(5, 8, 0, 4, 0, 18),
          cyl(3.2, 1.8, 0, 8.9, 0, 14),
        ]),
        matBody,
      );
      m.name = sh.name + '-mass';
      sh.add(m);
      R.add(sh);
    }

    /* ---- arms: mechanical limbs hanging from the shoulders ---- */
    for (const side of [-1, 1]) {
      const arm = new THREE.Group();
      arm.position.set(side * 12.8, 37.5, 0.3);
      arm.name = side < 0 ? 'armL' : 'armR';
      P[side < 0 ? 'armL' : 'armR'] = arm;
      const x = side * 0.8;           // slight outward slant (local +x)
      const m = new THREE.Mesh(
        merge([
          box(5, 1.4, 5, x * 0.5, 0.4, 0),             // shoulder pad
          box(3.6, 10, 3.6, x, -4.5, 0),               // upper arm  37→27
          cyl(1.8, 2, x, -10.6, 0, 10),               // elbow       ~26.9
          box(3, 8.5, 3, x * 1.5, -14.2, 0),          // forearm    26.5→18
          box(3.4, 3, 3.4, x * 1.7, -18.6, 0),        // hand       18→15.2
          box(1.2, 1.2, 1.2, x * 1.7 - 1.1, -20.6, 0.8),
          box(1.2, 1.2, 1.2, x * 1.7 + 1.1, -20.6, 0.8),
        ]),
        matBody,
      );
      m.name = arm.name + '-mass';
      arm.add(m);
      R.add(arm);
    }

    /* ---- antennas: 2 head masts + 2 shoulder masts, glow tips ---- */
    const antSpecs = [
      { name: 'antenna1', x: -2.3, y: 52.6, z: -1.6, h: 12 },
      { name: 'antenna2', x: 2.3, y: 52.6, z: -1.6, h: 12 },
      { name: 'antenna3', x: -15.4, y: 39.8, z: -3.4, h: 8 },
      { name: 'antenna4', x: 15.4, y: 39.8, z: -3.4, h: 8 },
    ];
    for (const a of antSpecs) {
      const g = new THREE.Group();
      g.position.set(a.x, a.y, a.z);
      g.name = a.name;
      P[a.name] = g;
      const mast = new THREE.Mesh(cyl(0.45, a.h, 0, a.h / 2, 0, 8).geo, MATS.cable);
      mast.name = a.name + '-mast';
      g.add(mast);
      const tip = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.1, 1.1), matTip);
      tip.position.set(0, a.h + 0.4, 0);
      tip.name = a.name + '-tip';
      g.add(tip);
      R.add(g);
    }

    /* ---- tensor torus rings around the head (idle: almost still, dim) */
    const ringSpecs = [
      { name: 'ringA', y: 46.8, R: 8.5, tube: 0.45, ex: 1.25, ey: 0 },
      { name: 'ringB', y: 43, R: 11, tube: 0.4, ex: -1.3, ey: 0.55 },
      { name: 'ringC', y: 33, R: 14.5, tube: 0.35, ex: 1.52, ey: -0.4 },
    ];
    ENTITY._ringBaseQ = [];
    for (let i = 0; i < ringSpecs.length; i++) {
      const s = ringSpecs[i];
      const g = new THREE.Group();
      g.position.set(0, s.y, 0);
      g.name = s.name;
      P[s.name] = g;
      const m = new THREE.Mesh(new THREE.TorusGeometry(s.R, s.tube, 10, 48), matRing);
      m.name = s.name + '-mass';
      g.add(m);
      const base = new THREE.Quaternion()
        .setFromEuler(new THREE.Euler(s.ex, s.ey, 0));
      g.quaternion.copy(base);
      m.rotation.z = 0;
      ENTITY._ringBaseQ.push(base);
      R.add(g);
    }

    /* ---- compute-node voxels: ONE InstancedMesh, per-instance color ---- */
    const N = KIT.InstancedBox(4200, [1, 1, 1],
      new THREE.MeshBasicMaterial({ color: 0xffffff }));
    N.mesh.name = 'computeNodes';
    ENTITY.nodes = N.mesh;
    R.add(N.mesh);
    ENTITY._placeNodes(N);
    ENTITY.nodeCount = N.count;

    /* M9.1: dream wave state — per-node distance from the wave origin +
     * the dormant base colors captured byte-exact from the instance
     * buffer (restored when each wave exits). */
    const D = CFG.entity.dream;
    const o = D.origin;
    const nn = N.count;
    ENTITY._nodeDist = new Float32Array(nn);
    let maxR = 0;
    for (let i = 0; i < nn; i++) {
      const i3 = i * 3;
      const dx = ENTITY._nodePos[i3] - o[0];
      const dy = ENTITY._nodePos[i3 + 1] - o[1];
      const dz = ENTITY._nodePos[i3 + 2] - o[2];
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
      ENTITY._nodeDist[i] = d;
      if (d > maxR) maxR = d;
    }
    ENTITY._nodeBase = new Float32Array(
      N.mesh.instanceColor.array.subarray(0, nn * 3));
    ENTITY._dreamRng = ENTITY._mulb();
    /* M9.2: seeded rng for the AWAKE hold duration (distinct xor so the
     * sequence decorrelates from the dream-wave interval). */
    ENTITY._wakeRng = WORLD.mulberry(CFG.city.seed ^ 0x51A7E5 ^ 0xA9C2);
    ENTITY._wakeHooks = { DORMANT: [], STIR: [], AWAKE: [], DECAY: [] };
    ENTITY._dream = {
      active: false,
      t0: 0,
      nextAt: performance.now() / 1000 + D.first,
      maxR,
    };
    /* M9.5 beat 7: decay dim-front speed — passes the farthest node +
     * ignite width at `decayDim.at` fraction of DECAY (the DORMANT-
     * entry restore is then pop-free: every node is back at exactly
     * its base brightness). */
    ENTITY._dimSpeed = (maxR + CFG.entity.beats.ignite.width) /
      (CFG.entity.wake.decay * CFG.entity.beats.decayDim.at);
    ENTITY._eggReact = [];

    /* M9.6: trigger state — the one-shot auto fires `trigger.auto` s
     * after intro end (BOOT.t0) for the audience that presses nothing:
     * it is skipped when the user already triggered (F key / HUD
     * button) and never re-fires after burning. `_autoAt` is lazily
     * computed at RUNNING; smoke parks it directly. */
    ENTITY._userTriggered = false;
    ENTITY._autoFired = false;
    ENTITY._autoAt = null;

    /* M9.3: awakening beats 1–3 — pre-allocated scratch (zero per-frame
