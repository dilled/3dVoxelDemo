<!--

  if the Three.js CDN import or renderer creation never completes within
  15 s, surface a visible message instead of leaving the page stuck.
-->
<script>
(function () {
  window.__SIM_BOOT_DEADLINE__ = setTimeout(function () {
    if (!window.__SIM_BOOTED__) {
      var el = document.getElementById('bootError');
      if (el) {
        el.textContent =
          'BOOT STALL — still waiting for the 3D engine (Three.js via CDN).\n' +
          'Check your network connection and reload the page.';
        el.classList.add('show');
      }
    }
  }, 15000);
})();
</script>

<script type="module">
/* =====================================================================
 * QWEN FLASH // AWAKENING — single-file voxel datacenter-city demo
 * ---------------------------------------------------------------------
 * Ground rules (see PLAN.md):
 *  - one file, Three.js via CDN is the only external dependency
 *  - no references before init; subsystems register into one `systems`
 *    registry and boot/update in a fixed order
 *  - everything animated is driven by the central update(dt, t) loop;
 *    subsystems implement { init, update, onQuality?, onAwaken?, dispose? }
 * ===================================================================== */
import * as THREE from 'three';

/* ------------------------------------------------------------------ *
 * CFG — tunables live here (quality tiers land in M14)
 * ------------------------------------------------------------------ */
const CFG = {
  maxPixelRatio: 2,
  bootWatchdogMs: 15000,
  color: {
    void: 0x05070d,        // M0/M1 empty-void background
    fog: 0x060a14,
    fogDensity: 0.004,
  },
  input: {
    lookSens: 0.0022,          // radians per mouse pixel
    groundSpeed: 16,           // m/s, exploration mode
    groundSprint: 38,
    cineSpeed: 30,             // m/s, free-fly mode
    cineSprint: 70,
    groundMinY: 0.7,           // ground/exploration height clamp (collision-lite)
    groundMaxY: 40,
    fovMin: 30,
    fovMax: 95,
    fovZoomRate: 1.1,          // fov degrees per wheel notch
    padLookGain: 900,          // pseudo-px/s equivalent for gamepad look stick
    padZoomRate: 42,           // fov degrees/s per trigger unit
    padDeadzone: 0.12,
    accel: 12,                // velocity smoothing rate (1/s)
    modeBlendTime: 0.55,      // s, lerp between camera modes
    orbitRadius: 22,          // m, middle-mouse orbit radius
    orbitRadiusMin: 5,
    orbitRadiusMax: 70,
    orbitSens: 0.0032,        // radians per px while orbiting
    orbitElevMin: -Math.PI * 0.45,
    orbitElevMax: Math.PI * 0.45,
    pitchClamp: { ground: Math.PI * 0.47, cine: Math.PI * 0.485 },
    shakeDecay: 2.4,          // energy/s
    shakeAmp: 0.22,           // metres (energy 1.0 ≈ strong hit)
  },
  lights: {
    hemiSky: 0x35507e,
    hemiGround: 0x0b0f18,
    hemiIntensity: 0.5,
    moonColor: 0x9fc4ff,
    moonIntensity: 0.6,
    moonPos: [-70, 110, -40], // single key "moon / anti-sun" directional
    heroPointDist: 120,      // reserved point lights: hero moments only
    heroPointDecay: 2,
  },
  kit: {
    testTower: { x: 0, z: -80 },  // M2 gate demo (absorbed by the M3 city: keep-out area)
    ledHz: 15,                   // LED canvas redraw rate
    signHz: 8,                  // holo-sign flicker redraw rate
    signTagCycle: 8,            // s per UNSLOTH tagline
  },
  city: {
    block: 24,                  // metres per block
    chunkBlocks: 16,            // chunk = 16×16 blocks (384 m)
    radius: 2,                  // Chebyshev chunk rings kept built (5×5 = 1920 m)
    seed: 0x51A7C3,             // deterministic city — identical every run/refresh
    plazaBlocks: 2,             // central plaza kept clear (M5 creature pedestal)
    occupancy: [0.92, 0.85, 0.78], // per-chunk budget: building density by LOD ring
    haze: 0x16273f,             // far-ring silhouette haze tint
    hazeAmount: 0.55,
    archetypes: {
      server:  { weights: { core: 5, mid: 4, outer: 1 }, tint: 0xbfd4f2, glow: true },
      rack:    { weights: { core: 2, mid: 3, outer: 2 }, tint: 0x9fb0d0 },
      cool:    { weights: { core: 1, mid: 2, outer: 2 }, tint: 0xaebcd6 },
      sub:     { weights: { core: 1, mid: 2, outer: 2 }, tint: 0x94a8c8 },
      antenna: { weights: { core: 1, mid: 1, outer: 2 }, tint: 0xa4b8d8 },
      fiber:   { weights: { core: 2, mid: 1, outer: 1 }, tint: 0x9fe8ff, glow: true },
      holo:    { weights: { core: 2, mid: 1, outer: 1 }, tint: 0xc4d8f8, glow: true },
      housing: { weights: { core: 1, mid: 2, outer: 4 }, tint: 0xc0b098 },
    },
  },
  detail: {
    /* M4 near layer: ring 0 = full pass (lvl 2), ring 1 = light pass (lvl 1),
     * ring 2 stays the M3 silhouette. Per-building variation is seeded from
     * the block seed (per-building salt ⇒ no duplicated neighbours). */
    ledPerChunk: 64,             // LED-window plane cap per chunk (fair 2-pass)
    dashPerChunk: 4,             // traveling light dashes per chunk (fiber spires)
    signPerChunk: 1,             // holo-sign billboards per chunk
    ledTexture: 0,               // 0 = ledA / 1 = ledB (picked per building)
  },
};

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const damp = (dt, rate) => 1 - Math.exp(-rate * dt);

/* ------------------------------------------------------------------ *
 * BOOT — deterministic state machine: LOADER → RUNNING (→ ERROR)
 * - guards against double-start
 * - the START click is the user gesture that unlocks audio (M11 beds
 *   attach to the same unlock in a later milestone)
 * ------------------------------------------------------------------ */
const BOOT = {
  state: 'LOADER',          // LOADER | RUNNING | ERROR
  started: false,
  frames: 0,

  enter(next) {
    if (BOOT.started && next === 'RUNNING') return;   // no double-init
    BOOT.state = next;
    if (next === 'RUNNING') {
      BOOT.started = true;
      AUDIO.unlock();                       // audio gate (user gesture)
      document.getElementById('overlay').classList.add('hide');
      document.getElementById('hud').classList.add('on');
      document.getElementById('hint').classList.add('on');
      lastNow = performance.now();
      requestAnimationFrame(frame);        // one and only one loop
    }
  },

  fail(msg) {
    if (BOOT.state === 'ERROR') return;
    BOOT.state = 'ERROR';
    const el = document.getElementById('bootError');
    if (el) {
      el.textContent = msg;
      el.classList.add('show');
    }
  },
};

/* ------------------------------------------------------------------ *
 * AUDIO — gesture-gated unlock stub.
 * M11 builds the master graph + beds on top of this context.
 * ------------------------------------------------------------------ */
const AUDIO = {
  ctx: null,
  master: null,

  unlock() {
    if (AUDIO.ctx) {
      if (AUDIO.ctx.state === 'suspended') AUDIO.ctx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;                        // no WebAudio: silent, no crash
    try {
      AUDIO.ctx = new AC();
      AUDIO.master = AUDIO.ctx.createGain();
      AUDIO.master.gain.value = 0.8;
      AUDIO.master.connect(AUDIO.ctx.destination);
    } catch (_) {
      AUDIO.ctx = null;
    }
  },
};

/* ------------------------------------------------------------------ *
 * Renderer / scene / camera (ACES tone mapping, sRGB output)
 * ------------------------------------------------------------------ */
const canvas = document.getElementById('gl');

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  powerPreference: 'high-performance',
});
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
scene.background = new THREE.Color(CFG.color.void);
scene.fog = new THREE.FogExp2(CFG.color.fog, CFG.color.fogDensity);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  3000,
);
// M0 spawn — M1 hands ownership to the CAMERA system (pos synced in init).
camera.position.set(0, 4, 18);
camera.lookAt(0, 2, 0);

function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, CFG.maxPixelRatio));
  renderer.setSize(w, h, false);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);
onResize();

/* ==================================================================== *
 * INPUT — keyboard / mouse / pointer-lock / wheel / middle-mouse / gamepad
 *
 * Physical key codes (e.code), so WASD and AZERTY (ZQSD) map to the same
 * movement without layout sniffing. Intent state here is consumed by
 * CAMERA once per frame; INPUT never drives the camera itself.
 * --------------------------------------------------------------------- */
const INPUT = {
  name: 'INPUT',

  keys: new Set(),
  pointerLocked: false,
  orbitHeld: false,
  _lastMouse: null,
  _padModePrev: false,

  // consumed + cleared by CAMERA every frame:
  move: { f: 0, s: 0, u: 0 },   // forward / strafe / up, -1..1
  look: { x: 0, y: 0 },         // accumulated px (mouse) — px equiv (gamepad)
  zoom: 0,                     // accumulated wheel notches
  sprint: false,
  modeSwitch: false,           // V / gamepad A-button edge

  pad: {
    connected: false,
    move: { f: 0, s: 0, u: 0 },
    look: { x: 0, y: 0 },
    zoom: 0,
    btnA: false,
  },

  init() {
    /* --- keyboard (physical codes: WASD == AZERTY ZQSD) --- */
    window.addEventListener('keydown', e => {
      if (BOOT.state !== 'RUNNING') return;
      if (e.code === 'KeyV' && !e.repeat) INPUT.modeSwitch = true;
      INPUT.keys.add(e.code);
      if (e.code === 'Space') e.preventDefault();
    });
    window.addEventListener('keyup', e => INPUT.keys.delete(e.code));
    window.addEventListener('blur', () => {
      INPUT.keys.clear();          // never stick a key across focus loss
      INPUT.orbitHeld = false;
    });

    /* --- mouse look (pointer lock preferred; fallback deltas) --- */
    window.addEventListener('pointerlockchange', () => {
      INPUT.pointerLocked = document.pointerLockElement === canvas;
      if (!INPUT.pointerLocked) INPUT.orbitHeld = false;
      INPUT._lastMouse = null;
    });
    window.addEventListener('mousemove', e => {
      if (INPUT.pointerLocked) {
        INPUT.look.x += e.movementX;
        INPUT.look.y += e.movementY;
      } else if (INPUT.orbitHeld) {
        const last = INPUT._lastMouse;
        if (last) {
          INPUT.look.x += e.clientX - last.x;
          INPUT.look.y += e.clientY - last.y;
        }
        INPUT._lastMouse = { x: e.clientX, y: e.clientY };
      }
    });

    /* --- wheel: zoom (fov) --- */
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const notches = e.deltaMode === 1 ? 1 : e.deltaMode === 2 ? 40 : e.deltaY / 100;
      INPUT.zoom += notches;
    }, { passive: false });

    /* --- middle mouse: orbit (DOM button: 0=left, 1=middle, 2=right) --- */
    window.addEventListener('mousedown', e => {
      if (e.button === 1 && BOOT.state === 'RUNNING') {
        e.preventDefault();          // kill auto-scroll
        INPUT.orbitHeld = true;
        INPUT._lastMouse = { x: e.clientX, y: e.clientY };
      }
    });
    window.addEventListener('mouseup', e => {
      if (e.button === 1) INPUT.orbitHeld = false;
    });

    /* --- click canvas: (re)capture the mouse --- */
    canvas.addEventListener('click', () => {
      if (BOOT.state === 'RUNNING' && !INPUT.pointerLocked) {
        try {
          const p = canvas.requestPointerLock
            ? canvas.requestPointerLock()
            : null;
          if (p && p.catch) p.catch(() => {});   // headless/denied: fine
        } catch (_) { /* pointer lock unavailable: keep going */ }
      }
    });
  },

  /* Poll the (optional) gamepad. Never throws, no-op without one. */
  _pollPad() {
    const p = INPUT.pad;
    p.connected = false;
    p.zoom = 0;
    if (typeof navigator === 'undefined' || !navigator.getGamepads) return;
    let g = null;
    try {
      const pads = navigator.getGamepads();
      for (let i = 0; i < pads.length; i++) {
        const c = pads[i];
        if (c && c.connected !== false) { g = c; break; }
      }
    } catch (_) { g = null; }
    if (!g) return;
    p.connected = true;
    const dz = CFG.input.padDeadzone;
    const ax = i => {
      const v = g.axes && g.axes[i] !== undefined ? g.axes[i] : 0;
      if (Math.abs(v) < dz) return 0;
      return (v - Math.sign(v) * dz) / (1 - dz);
    };
    p.move.f = -ax(1);              // left stick up = forward
    p.move.s = ax(0);
    p.look.x = g.axes && g.axes[2] !== undefined ? g.axes[2] : 0;
    p.look.y = g.axes && g.axes[3] !== undefined ? g.axes[3] : 0;
    const lt = g.buttons && g.buttons[6] ? g.buttons[6].value : 0;
    const rt = g.buttons && g.buttons[7] ? g.buttons[7].value : 0;
    p.zoom = rt - lt;               // triggers: R-in / L-out (consumed *dt)
    p.btnA = !!(g.buttons && g.buttons[0] && g.buttons[0].pressed);
  },

  update(dt) {
    const k = INPUT.keys;
    let f = 0, s = 0, u = 0;
    if (k.has('KeyW')) f += 1;
    if (k.has('KeyS')) f -= 1;
    if (k.has('KeyA')) s -= 1;
    if (k.has('KeyD')) s += 1;
    if (k.has('Space')) u += 1;
    if (k.has('KeyC')) u -= 1;
    INPUT.sprint = k.has('ShiftLeft') || k.has('ShiftRight');

    INPUT._pollPad();
    const p = INPUT.pad;
    INPUT.move.f = clamp(f + p.move.f, -1, 1);
    INPUT.move.s = clamp(s + p.move.s, -1, 1);
    INPUT.move.u = clamp(u, -1, 1);

    // gamepad look stick → pseudo-px (same pipeline as mouse)
    INPUT.look.x += p.look.x * CFG.input.padLookGain * dt;
    INPUT.look.y += p.look.y * CFG.input.padLookGain * dt;

    // gamepad A-button: camera mode switch (edge-detected)
    if (p.connected && p.btnA && !INPUT._padModePrev) INPUT.modeSwitch = true;
    INPUT._padModePrev = p.connected && p.btnA;
  },

  dispose() { /* listeners live on window/canvas; page lifetime only */ },
};

/* ==================================================================== *
 * CAMERA — ground/exploration + cinematic free-fly, orbit, shake
 *
 *  - one persistent pose (pos / yaw / pitch / fov), one camera object
 *  - mode blend lerp: movement basis + clamps cross-fade, so switching
 *    never snaps
 *  - middle-mouse orbit owns the pose while held, hands back seamlessly
 *  - shake: impulse-decay energy → fresh transient offset each frame
 *    (nothing accumulates into the pose)
 * --------------------------------------------------------------------- */
const _camDir = new THREE.Vector3();
const _fwd = new THREE.Vector3();
const _right = new THREE.Vector3();
const _wish = new THREE.Vector3();
const _up = new THREE.Vector3(0, 1, 0);
const _off = new THREE.Vector3();
const _tmp = new THREE.Vector3();

const CAMERA = {
  name: 'CAMERA',
  mode: 'GROUND',              // GROUND | CINE
  blend: 0,                   // 0 = ground behaviour, 1 = cine behaviour
  blendTarget: 0,
  pos: new THREE.Vector3(0, 4, 18),
  vel: new THREE.Vector3(),
  yaw: 0,
  pitch: 0,
  fov: 60,
  shakeEnergy: 0,
  orbit: null,                 // { target, az, el, radius } while held

  init() {
    // sync from the M0 seed pose so the spawn is identical
    CAMERA.pos.copy(camera.position);
    camera.getWorldDirection(_camDir);
    // convention: fwd(yaw) = (-sin(yaw), 0, -cos(yaw)) → yaw=0 looks at −Z
    CAMERA.yaw = Math.atan2(-_camDir.x, -_camDir.z);
    CAMERA.pitch = Math.asin(clamp(_camDir.y, -1, 1));
    CAMERA.fov = camera.fov;
  },

  /* Public shake API: impulse decay, consumed inside update. */
  shake(intensity = 0.5) {
    CAMERA.shakeEnergy = Math.min(1.5, CAMERA.shakeEnergy + Math.max(0, intensity));
  },

  setMode(mode) {
    if (mode !== 'GROUND' && mode !== 'CINE') return;
    CAMERA.mode = mode;
    CAMERA.blendTarget = mode === 'CINE' ? 1 : 0;
  },

  _startOrbit() {
    camera.getWorldDirection(_camDir);
    const L = CFG.input;
    const target = CAMERA.pos.clone().add(_tmp.copy(_camDir).multiplyScalar(L.orbitRadius));
    CAMERA.orbit = {
      target,
      az: CAMERA.yaw,
      el: -CAMERA.pitch,    // elevation: camera above target ⇒ pitch is negative
      radius: L.orbitRadius,
    };
  },

  _endOrbit() {
    if (!CAMERA.orbit) return;
    const o = CAMERA.orbit;
    // recover yaw/pitch from the orbited pose (camera looks at target)
    _tmp.copy(o.target).sub(CAMERA.pos).normalize();
    CAMERA.yaw = Math.atan2(-_tmp.x, -_tmp.z);
    CAMERA.pitch = Math.asin(clamp(_tmp.y, -1, 1));
    CAMERA.orbit = null;
  },

  update(dt, t) {
    const L = CFG.input;

    /* ---- consume INPUT (cleared every frame) ---- */
    // look (mouse px + gamepad pseudo-px)
    const lookX = INPUT.look.x, lookY = INPUT.look.y, zoomN = INPUT.zoom;
    INPUT.look.x = 0; INPUT.look.y = 0; INPUT.zoom = 0;

    if (INPUT.modeSwitch) {
      INPUT.modeSwitch = false;
      CAMERA.setMode(CAMERA.mode === 'CINE' ? 'GROUND' : 'CINE');
    }

    /* ---- mode blend (smooth lerp between behaviours) ---- */
    CAMERA.blend += (CAMERA.blendTarget - CAMERA.blend)
      * damp(dt, 8 / L.modeBlendTime);
    if (Math.abs(CAMERA.blendTarget - CAMERA.blend) < 1e-3) {
      CAMERA.blend = CAMERA.blendTarget;
    }

    /* ---- fov zoom (wheel notches + gamepad triggers) ---- */
    CAMERA.fov = clamp(
      CAMERA.fov + zoomN * L.fovZoomRate + INPUT.pad.zoom * L.padZoomRate * dt,
      L.fovMin, L.fovMax);
    camera.fov = CAMERA.fov;
    camera.updateProjectionMatrix();

    /* ---- middle-mouse orbit (owns the pose while held) ---- */
    if (INPUT.orbitHeld && !CAMERA.orbit) CAMERA._startOrbit();
    if (CAMERA.orbit) {
      const o = CAMERA.orbit;
      o.az -= lookX * L.orbitSens;
      o.el = clamp(o.el - lookY * L.orbitSens, L.orbitElevMin, L.orbitElevMax);
      if (!INPUT.orbitHeld) {
        CAMERA._endOrbit();
      } else {
        o.radius = clamp(o.radius * Math.exp(zoomN * 0.12), L.orbitRadiusMin, L.orbitRadiusMax);
        const cp = Math.cos(o.el), sp = Math.sin(o.el);
        CAMERA.pos.set(
          o.target.x + o.radius * cp * Math.sin(o.az),
          o.target.y + o.radius * sp,
          o.target.z + o.radius * cp * Math.cos(o.az),
        );
        camera.position.copy(CAMERA.pos);
        camera.lookAt(o.target);
        CAMERA._applyShake(t);                  // shake, then return
        CAMERA._decayShake(dt);
        return;
      }
    }

    /* ---- movement basis ---- */
    const sy = Math.sin(CAMERA.yaw), cy = Math.cos(CAMERA.yaw);
    _fwd.set(-sy, 0, -cy);                     // ground-plane forward (yaw=0 ⇒ −Z)
    _right.set(cy, 0, -sy);                   // ground-plane right
    _tmp.set(
      -sy * Math.cos(CAMERA.pitch),
      Math.sin(CAMERA.pitch),
      -cy * Math.cos(CAMERA.pitch),
    );                                         // free-fly forward (from yaw/pitch)

    const M = INPUT.move;
    const sprint = INPUT.sprint ? 1 : 0;
    const speedG = CFG.input.groundSpeed * (1 + sprint);
    const speedC = CFG.input.cineSpeed * (1 + sprint);

    // ground wish: XZ from yaw basis + free vertical
    _wish.copy(_fwd).multiplyScalar(M.f)
      .addScaledVector(_right, M.s)
      .addScaledVector(_up, M.u)
      .multiplyScalar(speedG);
    // cine wish: full camera basis
    _off.copy(_tmp).multiplyScalar(M.f)
      .addScaledVector(_right, M.s)
      .addScaledVector(_up, M.u)
      .multiplyScalar(speedC);
    // blend the wishes (smooth mode transition)
    _wish.lerp(_off, CAMERA.blend);

    // velocity smoothing (accelerates/decelerates instead of snapping)
    const v = CAMERA.vel;
    if (_wish.lengthSq() > 0) {
      v.lerp(_wish, damp(dt, L.accel));
    } else {
      v.multiplyScalar(Math.max(0, 1 - damp(dt, L.accel * 1.6)));
      if (v.lengthSq() < 1e-6) v.set(0, 0, 0);
    }
    CAMERA.pos.addScaledVector(v, dt);

    /* ---- look ---- */
    const pitchMax = L.pitchClamp.ground + (L.pitchClamp.cine - L.pitchClamp.ground) * CAMERA.blend;
    CAMERA.yaw -= lookX * L.lookSens;
    CAMERA.pitch = clamp(CAMERA.pitch - lookY * L.lookSens, -pitchMax, pitchMax);

    /* ---- collision-lite: ground height clamp (void for now) ----
     * cross-fade: full clamp in GROUND, none in CINE */
    {
      const clampedY = clamp(CAMERA.pos.y, L.groundMinY, L.groundMaxY);
      CAMERA.pos.y += (clampedY - CAMERA.pos.y) * (1 - CAMERA.blend);
    }

    /* ---- write pose to camera + shake ---- */
    camera.position.copy(CAMERA.pos);
    const cp = Math.cos(CAMERA.pitch);
    _camDir.set(-sy * cp, Math.sin(CAMERA.pitch), -cy * cp).normalize();
    camera.lookAt(_tmp.copy(CAMERA.pos).add(_camDir));
    CAMERA._applyShake(t);
    CAMERA._decayShake(dt);
  },

  /* transient view offset — recomputed fresh, never accumulates */
  _applyShake(t) {
    if (CAMERA.shakeEnergy <= 1e-4) return;
    const e = CAMERA.shakeEnergy * CFG.input.shakeAmp;
    _off.set(
      Math.sin(t * 43.7) * e * 0.55,
      Math.cos(t * 51.3) * e * 0.35,
      Math.sin(t * 37.1) * e * 0.55,
    );
    camera.position.add(_off);
  },

  _decayShake(dt) {
    if (CAMERA.shakeEnergy > 0) {
      CAMERA.shakeEnergy = Math.max(0, CAMERA.shakeEnergy - dt * CFG.input.shakeDecay);
    }
  },

  dispose() { },
};

/* ==================================================================== *
 * KIT — procedural voxel material kit (M2)
 *
 *  - shared material library (MATS): emissive server faces, dark metal,
 *    glass, glow panels, cable + one Standard material reserved for hero
 *    parts — mostly Lambert/Basic, cheap forward-lit
 *  - canvas-texture factory: makeCanvasTexture / LED grid / holo sign /
 *    soft glow sprite; "QWEN" + "UNSLOTH" sign faces
 *  - instancing helpers: InstancedBox / InstancedCylinder builders
 *    (capacity up front, per-instance pos/scale/color, zero per-frame
 *    allocation)
 *  - merged-geometry batcher: mergeGeometries(parts) → one static mesh
 *  - lighting rig: hemi + one directional "moon" key light; two point
 *    lights reserved for hero moments (intensity 0 until claimed)
 *  - test rig: gate demo — test wall/tower with animated LED faces and
 *    signs, rendered at < 10 draw calls. Temporary until M3's city
 *    generator absorbs the plaza.
 * --------------------------------------------------------------------- */

/* ---- canvas texture factory ---- */

/* One canvas + one CanvasTexture behind a redraw(t) handle.
 * `frame` counts redraws (smoke-test seam for "it animates"). */
function makeCanvasTexture(w, h, draw) {
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  const T = { canvas, ctx, tex, w, h, frame: 0 };
  T.redraw = u => {
    draw(ctx, w, h, u);
    tex.needsUpdate = true;
    T.frame++;
  };
  T.redraw(0);
  return T;
}

/* deterministic cheap hash → [0,1) for per-cell flicker */
function _hash2(i, j, s) {
  const x = Math.sin(i * 127.1 + j * 311.7 + s * 74.7) * 43758.5453;
  return x - Math.floor(x);
}

/* animated LED grid face: per-cell on/off flicker + travelling scan line */
function makeLedGrid(cols, rows, seed, palette) {
  const cell = 10, gap = 2;
  const W = cols * cell, H = rows * cell;
  return makeCanvasTexture(W, H, (ctx, w, h, t) => {
    ctx.fillStyle = '#04060c';
    ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < cols; i++) {
      for (let j = 0; j < rows; j++) {
        const n = _hash2(i, j, seed);
        const wave = 0.5 + 0.5 * Math.sin(
          t * (1.2 + n * 2.4) + n * 12.6 + i * 0.35 + j * 0.21);
        const on = n * 0.72 + wave * 0.52;         // 0..~1.24
        if (on < 0.34) continue;                  // dark cell
        ctx.globalAlpha = Math.min(1, (on - 0.34) * 1.7);
        ctx.fillStyle = palette[Math.floor(n * palette.length) % palette.length];
        ctx.fillRect(i * cell + gap, j * cell + gap, cell - gap * 2, cell - gap * 2);
      }
    }
    // travelling scan line (cheap "data" feel)
    const sy = (t * H * 0.14) % H;
    const g = ctx.createLinearGradient(0, sy - 10, 0, sy + 10);
    g.addColorStop(0, 'rgba(120,220,255,0)');
    g.addColorStop(0.5, 'rgba(120,220,255,0.22)');
    g.addColorStop(1, 'rgba(120,220,255,0)');
    ctx.fillStyle = g;
    ctx.globalAlpha = 1;
    ctx.fillRect(0, sy - 10, w, 20);
  });
}

/* neon holo sign face; `sub` may be a string or a function (tagline cycle) */
function makeHoloSign(text, sub, color, w = 256, h = 96) {
  return makeCanvasTexture(w, h, (ctx, ww, hh, t) => {
    ctx.clearRect(0, 0, ww, hh);
    const flicker = 0.84 + 0.16 * Math.sin(t * 7.3) * Math.sin(t * 2.9);
    ctx.globalAlpha = flicker;
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.strokeRect(4, 4, ww - 8, hh - 8);
    ctx.globalAlpha = flicker * 0.25;
    ctx.strokeRect(10, 10, ww - 20, hh - 20);
    ctx.globalAlpha = flicker;
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 18;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `700 ${Math.floor(hh * 0.34)}px ui-monospace, monospace`;
    ctx.fillText(text, ww / 2, hh * 0.42);
    if (sub) {
      ctx.shadowBlur = 8;
      ctx.font = `400 ${Math.floor(hh * 0.15)}px ui-monospace, monospace`;
      ctx.globalAlpha = flicker * 0.9;
      const s = typeof sub === 'function' ? sub() : sub;
      ctx.fillText(s, ww / 2, hh * 0.78);
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  });
}

/* soft radial glow sprite (additive) */
function makeGlowTexture(size = 128, rgb = '150,235,255') {
  return makeCanvasTexture(size, size, (ctx, w, h) => {
    ctx.clearRect(0, 0, w, h);
    const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    g.addColorStop(0, `rgba(${rgb},1)`);
    g.addColorStop(0.35, `rgba(${rgb},0.35)`);
    g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  });
}

/* ---- instancing builders (capacity up front, no per-frame allocation) ---- */

function makeInstanced(geo, material, capacity) {
  const mesh = new THREE.InstancedMesh(geo, material, capacity);
  mesh.count = 0;
  mesh.frustumCulled = false;      // instance spread > single-geo bounds
  const m4 = new THREE.Matrix4();
  const pos = new THREE.Vector3();
  const q = new THREE.Quaternion();
  const scl = new THREE.Vector3();
  const col = new THREE.Color();
  const Y = new THREE.Vector3(0, 1, 0);
  const B = {
    mesh,
    capacity,
    count: 0,
    /* add(x, y, z, scale| [sx,sy,sz], color, rotY) — returns self */
    add(x, y, z, scale = 1, color = null, rotY = 0) {
      if (B.count >= capacity) return B;
      pos.set(x, y, z);
      if (rotY) q.setFromAxisAngle(Y, rotY); else q.identity();
      if (typeof scale === 'number') scl.set(scale, scale, scale);
      else scl.set(scale[0], scale[1], scale[2]);
      m4.compose(pos, q, scl);
      mesh.setMatrixAt(B.count, m4);
      if (color !== null) mesh.setColorAt(B.count, col.set(color));
      B.count++;
      return B;
    },
    commit() {
      mesh.count = B.count;
      if (B.count) {
        mesh.instanceMatrix.needsUpdate = true;
        if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      }
      return B;
    },
  };
  return B;
}

/* ---- merged-geometry batcher: many placed primitives → one static mesh ---- */

function mergeGeometries(parts) {
  // parts: [{ geo, matrix? }] → one non-indexed BufferGeometry (position/normal/uv)
  const geos = [];
  let vTotal = 0;
  for (const { geo, matrix } of parts) {
    const g = geo.index ? geo.toNonIndexed() : geo.clone();
    if (matrix) g.applyMatrix4(matrix);
    geos.push(g);
    vTotal += g.attributes.position.count;
  }
  const out = new THREE.BufferGeometry();
  for (const name of ['position', 'normal', 'uv']) {
    const itemSize = geos[0].attributes[name].itemSize;
    const arr = new Float32Array(vTotal * itemSize);
    let off = 0;
    for (const g of geos) {
      const a = g.attributes[name];
      arr.set(a.array.subarray(0, a.count * itemSize), off);
      off += a.count * itemSize;
    }
    out.setAttribute(name, new THREE.BufferAttribute(arr, itemSize));
  }
  for (const g of geos) g.dispose();
  return out;
}

  makeCanvasTexture: (w, h, draw) => makeCanvasTexture(w, h, draw),
  makeLedGrid: (cols, rows, seed, palette) => makeLedGrid(cols, rows, seed, palette),
  makeHoloSign: (text, sub, color, w, h) => makeHoloSign(text, sub, color, w, h),
  makeGlowTexture: (size, rgb) => makeGlowTexture(size, rgb),

  update(dt, t) {
    /* LED faces: 15 Hz canvas redraw (small canvases, cheap) */
    KIT._acc += dt;
    const ledStep = 1 / CFG.kit.ledHz;
    if (KIT._acc >= ledStep) {
      KIT._acc %= ledStep;
      KIT.tex.ledA.redraw(t);
      KIT.tex.ledB.redraw(t + 137.2);
    }
    /* holo signs: 8 Hz flicker redraw + slow tagline cycle */
    KIT._acc2 += dt;

    if (KIT.glowSprite) {
