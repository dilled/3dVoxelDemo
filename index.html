     * allocation). Beat 3 tilts each ring group by baseQ × tiltQ(level)
     * along a fixed per-ring direction; the level is 0 in DORMANT ⇒
     * quaternion = baseQ byte-exact (× identity). */
    ENTITY._tiltE = [new THREE.Euler(), new THREE.Euler(), new THREE.Euler()];
    ENTITY._tiltQ = [
      new THREE.Quaternion(), new THREE.Quaternion(), new THREE.Quaternion(),
    ];
    ENTITY._surgeDir = [
      { x: -1, z: 0 },     // ringA — pitch forward
      { x: 0.7, z: 0.5 }, // ringB — pitch + roll
      { x: -0.5, z: -0.3 }, // ringC — counter pitch/roll
    ];
    ENTITY._flareCol = new THREE.Color(CFG.entity.beats.flare.color);

    /* ---- steam drip: 32 pooled puffs from 4 vents (minimal, dormant) ---- */
    const vents = [
      [-12.5, 39.9, 0], [12.5, 39.9, 0],          // shoulder cooling caps
      [-4.5, 40.7, 2.6], [4.5, 40.7, -2.6],       // chest vents
    ];
    const rng = ENTITY._mulb();
    const nP = 32;
    const pos = new Float32Array(nP * 3);
    const col = new Float32Array(nP * 3);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const pts = new THREE.Points(geo, new THREE.PointsMaterial({
      size: 2.6, sizeAttenuation: true, map: KIT.tex.glow.tex,
      transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending, vertexColors: true,
    }));
    pts.name = 'steamDrip';
    pts.frustumCulled = false;
    P.steam = pts;
    R.add(pts);
    ENTITY._steam = pts;
    ENTITY._steamPars = Array.from({ length: nP }, (_, i) => ({
      vent: i % vents.length,
      off: rng() * 12,
      life: 6 + rng() * 4,
      ph: rng() * 6.28,
      v: vents[i % vents.length],
    }));

    /* claim hero point light #0 for the dormant core glow
     * (#1 stays reserved for the M9 awakening flare) */
    const hero = KIT.heroLights[0];
    hero.color.set(0x6fd8ff);
    hero.position.set(0, 47.2, 5.5);
    ENTITY._hero = hero;
  },

  /* seeded rng — the node layout is deterministic (smoke regenerates it) */
  _mulb() {
    return WORLD.mulberry(CFG.city.seed ^ 0x51A7E5);
  },

  /* M9.2: per-state hooks — ENTITY.hook('AWAKE', fn) fires fn(state, t)
   * when the state machine enters that state. */
  hook(state, fn) {
    if (ENTITY._wakeHooks[state]) ENTITY._wakeHooks[state].push(fn);
  },

  /* M9.5 beat 6: easter-egg reaction hook — M10.3 registers its
   * reaction here: fn('start', t) at the beat-6 fire during AWAKE,
   * fn('end', t) at DORMANT entry (the reaction plays during
   * AWAKE/DECAY and returns to idle). */
  eggReact(fn) {
    ENTITY._eggReact.push(fn);
  },

  /* M9.2: trigger the awakening sequence (M9.6 wires key/button/auto).
   * Safe: a no-op unless the creature is DORMANT. */
  wake() {
    if (ENTITY.state !== 'DORMANT') return;
    ENTITY._enterState('STIR', performance.now() / 1000);
  },

  /* M9.2: state entry — sets state + entry time, fires the per-state
   * hooks, and (on STIR) every system's onAwaken() hook. */
  _enterState(s, t) {
    ENTITY.state = s;
    ENTITY.stateT = t;
    if (s === 'STIR') {
      ENTITY._wakeCount++;
      for (const sys of systems) if (sys.onAwaken) sys.onAwaken();
      /* M9.3: beat 1 (core-eye flare) starts with the sequence; the
       * beat-3 shake re-arms for this sequence. M9.4: the beats 4–5
       * cascade re-arms for this sequence. */
      ENTITY._beatAt.flare = t;
      ENTITY._surgeFired = false;
      ENTITY._cascadeFired = false;
      ENTITY._trafficFired = false;
      /* M9.5: beat 6 re-arms for this sequence. */
      ENTITY._eggFired = false;
      ENTITY._finalPulseIt = null;
    }
    for (const h of ENTITY._wakeHooks[s]) h(s, t);
  },

  /* thousands of node voxels on torso / spine / head faces, ring bands,
   * pedestal rims, shoulders, arms — dormant: ~1 % dim, static (no
   * per-frame upload; M9 animates these via instance color). */
  _placeNodes(N) {
    const rng = ENTITY._mulb();
    /* M9.1: record per-node hue / brightness / position so the dream
     * wave can animate the instance colors and restore them byte-exact. */
    const cap = N.capacity;
    ENTITY._nodeHue = new Float32Array(cap * 3);
    ENTITY._nodeBright = new Float32Array(cap);
    ENTITY._nodePos = new Float32Array(cap * 3);
    const add = (x, y, z) => {
      if (N.count >= N.capacity) return;
      const s = 0.62 + rng() * 0.4;
      const roll = rng();
      let c;
      if (roll < 0.05) c = [1, 0.62, 0.32];      // dim amber
      else if (roll < 0.78) c = [0.32, 0.85, 1]; // dim cyan
      else c = [0.55, 0.62, 1];                  // dim blue-violet
      let b = 0.018 + rng() * 0.055;          // dormant dimness (~1 %)
      if (rng() < 0.07) b = 0.004;            // dead node
      const i3 = N.count * 3;
      ENTITY._nodeHue[i3] = c[0]; ENTITY._nodeHue[i3 + 1] = c[1];
      ENTITY._nodeHue[i3 + 2] = c[2];
      ENTITY._nodeBright[N.count] = b;
      ENTITY._nodePos[i3] = x; ENTITY._nodePos[i3 + 1] = y;
      ENTITY._nodePos[i3 + 2] = z;
      N.add(x, y, z, [s, s, s], ENTITY._col
        .setRGB(c[0], c[1], c[2]).multiplyScalar(b).getHex());
    };
    /* face grid: `u` span along the face, y0..y1, offset from center,
     * axis 'x' ⇒ face normal ±X (span runs along Z), 'z' ⇒ normal ±Z */
    const face = (axis, off, u, y0, y1, s, skip, pred) => {
      const nu = Math.max(1, Math.floor(u / s));
      const nv = Math.max(1, Math.floor((y1 - y0) / s));
      for (let i = 0; i < nu; i++) {
        const pu = -u / 2 + (i + 0.5) * s;
        for (let j = 0; j < nv; j++) {
          const py = y0 + (j + 0.5) * s;
          if (pred && !pred(pu, py)) continue;
          if (rng() < skip) continue;
          if (axis === 'z') add(pu, py, off);
          else add(off, py, pu);
        }
      }
    };
    /* torso / spine / head facades (±X and ±Z of each stack tier) */
    face('z', 7.35, 14, 18.9, 26.3, 0.7, 0.18);
    face('x', 7.35, 14, 18.9, 26.3, 0.7, 0.18);
    face('z', 6.35, 12, 26.9, 35.3, 0.65, 0.18);
    face('x', 6.35, 12, 26.9, 35.3, 0.65, 0.18);
    face('z', 4.85, 9.5, 35.9, 40.3, 0.6, 0.18);
    face('x', 4.85, 9.5, 35.9, 40.3, 0.6, 0.18);
    const eyeBlock = (pu, py) =>
      !(Math.abs(pu) < 3.4 && py > 45.6 && py < 49.0);
    face('z', 4.4, 8, 44.0, 50.2, 0.6, 0.18, eyeBlock);
    face('z', -4.4, 8, 44.0, 50.2, 0.6, 0.18);
    face('x', 4.4, 8, 44.0, 50.2, 0.6, 0.18);
    face('x', -4.4, 8, 44.0, 50.2, 0.6, 0.18);
    /* spine tiers (slightly inset per tier) */
    face('z', 4.85, 10, 5.9, 9.3, 0.8, 0.18);
    face('x', 5.35, 9, 5.9, 9.3, 0.8, 0.18);
    face('z', 4.6, 8.5, 9.9, 13.3, 0.8, 0.18);
    face('x', 4.6, 8, 9.9, 13.3, 0.8, 0.18);
    face('z', 4.1, 7.5, 13.9, 18.3, 0.8, 0.18);
    face('x', 4.1, 7.5, 13.9, 18.3, 0.8, 0.18);
    /* circle of nodes: n evenly spaced (seeded jitter), radius r at y */
    const circle = (r, y, n) => {
      for (let i = 0; i < n; i++) {
        const a = (i + 0.5) * 6.2832 / n + (rng() - 0.5) * 0.1;
        if (rng() < 0.22) continue;
        add(Math.cos(a) * r, y + (rng() - 0.5) * 0.2, Math.sin(a) * r);
      }
    };
    /* pedestal rims */
    circle(13.3, 5.62, 120);
    circle(16.8, 3.02, 136);
    circle(20.3, 1.02, 148);
    /* tensor-ring node bands (match the ring planes, radius ≈ ring R) */
    for (let i = 0; i < 3; i++) {
      const s = [
        { y: 46.8, R: 8.5, ex: 1.25, ey: 0 },
        { y: 43, R: 11, ex: -1.3, ey: 0.55 },
        { y: 33, R: 14.5, ex: 1.52, ey: -0.4 },
      ][i];
      const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(s.ex, s.ey, 0));
      const X = new THREE.Vector3(1, 0, 0).applyQuaternion(q);
      const Y = new THREE.Vector3(0, 1, 0).applyQuaternion(q);
      const n = i === 0 ? 64 : i === 1 ? 84 : 104;
      for (let k = 0; k < n; k++) {
        const a = (k + 0.5) * 6.2832 / n + (rng() - 0.5) * 0.12;
        if (rng() < 0.15) continue;
        const c = 0.92 + rng() * 0.16;
        add(
          (X.x * Math.cos(a) + Y.x * Math.sin(a)) * s.R * c,
          s.y + (X.y * Math.cos(a) + Y.y * Math.sin(a)) * s.R * c,
          (X.z * Math.cos(a) + Y.z * Math.sin(a)) * s.R * c,
        );
      }
    }
    /* shoulder caps + arm columns (outer + front per arm) + crown */
    circle(2.6, 39.95, 26);
    for (const side of [-1, 1]) {
      for (const [ox, oz] of [[side * 15.3, 0.35], [side * 13.2, 1.95]]) {
        for (let y = 16; y < 36; y += 0.85) {
          if (rng() < 0.15) continue;
          add(ox + (rng() - 0.5) * 0.5, y, oz + (rng() - 0.5) * 0.5);
        }
      }
    }
    circle(3.1, 51.7, 24);
    circle(2.2, 52.65, 18);
    N.commit();
  },

  update(dt, t) {
    /* M9.6: triggers — manual: F key edge (INPUT) + HUD button (wired
     * in HUD.init); both route through ENTITY.wake(), which is a
     * no-op unless DORMANT (re-press mid-sequence never re-triggers).
     * Auto: fires exactly once, `trigger.auto` s after intro end
     * (BOOT.t0 — M12's intro replaces that anchor), and skips when the
     * user already triggered (the auto is for the audience that
     * presses nothing). */
    if (INPUT.wakeTrigger) {
      INPUT.wakeTrigger = false;
      ENTITY._userTriggered = true;
      ENTITY.wake();
    }
    if (!ENTITY._autoFired) {
      if (ENTITY._autoAt === null && BOOT.t0 > 0)
        ENTITY._autoAt = BOOT.t0 + CFG.entity.trigger.auto;
      /* M12: the loop now also runs during the intro (BOOT.t0 = 0,
       * _autoAt still null) — only fire once the anchor is set, so the
       * auto-awaken stays a post-RUNNING event. */
      if (ENTITY._autoAt !== null && t >= ENTITY._autoAt) {
        ENTITY._autoFired = true;
        if (!ENTITY._userTriggered) ENTITY.wake();
      }
    }
    /* wake state machine (M9.2): DORMANT → STIR (2 s) → AWAKE (10–20 s)
     * → DECAY (3 s) → DORMANT. wakeP is the 0..1 pose level: smoothstep
     * up in STIR, 1 in AWAKE, smoothstep down in DECAY, 0 in DORMANT
     * (the pose restores EXACTLY at DORMANT entry). */
    const W = CFG.entity.wake;
    const B = CFG.entity.beats;
    if (ENTITY.state === 'STIR' && t - ENTITY.stateT >= W.stir) {
      ENTITY._awakeDur = W.awake[0] +
        ENTITY._wakeRng() * (W.awake[1] - W.awake[0]);
      ENTITY._enterState('AWAKE', t);
      /* M9.3 beat 1 peak: core-eye flash at the STIR→AWAKE transition;
       * beat 2's ignite wave starts now (t0 = AWAKE entry). A raw
       * _enterState('AWAKE') (smoke seam) never sets _ignited ⇒ beats
       * 2–3 stay off for forced non-sequence states. */
      FX.flash(B.flare.flash, B.flare.color);
      ENTITY._awakeT0 = t;
      ENTITY._beatAt.ignite = t;
      ENTITY._ignited = true;
    } else if (ENTITY.state === 'AWAKE' &&
      t - ENTITY.stateT >= ENTITY._awakeDur)
      ENTITY._enterState('DECAY', t);
    else if (ENTITY.state === 'DECAY' && t - ENTITY.stateT >= W.decay) {
      const wasIgnited = ENTITY._ignited;
      ENTITY._enterState('DORMANT', t);
      /* M9.3 beat 2 exit: restore the dormant node colors byte-exact;
       * the beat state machine is fully idle again. */
      if (ENTITY._ignited) {
        ENTITY.nodes.instanceColor.array.set(ENTITY._nodeBase);
        ENTITY.nodes.instanceColor.needsUpdate = true;
        ENTITY._ignited = false;
      }
      /* M9.4: tear down the city cascade — the wave colors restore
       * exactly, the plaza pulse drops even mid-life, and the traffic
       * roles clear (drones head home, vehicle offsets ease out). The
       * pulse item is only dropped if it still matches the cascade
       * signature (a released item may have been re-acquired by a dev
       * trigger in the meantime). */
      WORLD.awakenWaveEnd();
      if (ENTITY._pulseIt) {
        const pit = ENTITY._pulseIt;
        if (!pit.__free && pit.ox === 0 && pit.oz === 0 &&
            pit.R === B.cascade.pulse.radius)
          FX.dropPulse(pit);
        ENTITY._pulseIt = null;
      }
      TRAFFIC.awakenEnd();
      /* M9.5 beat 7: one final pulse as the sequence settles — fired
       * only for a real sequence (a forced non-sequence state never
       * ignited the grid). The "hum settles" audio lands in M11.3 (no
       * audio system yet — the DECAY/DORMANT state entry hooks are the
       * seam). */
      if (wasIgnited)
        ENTITY._finalPulseIt = FX.pulse(
          FX._fire.set(0, 0.4, 0), B.finalPulse.radius,
          B.finalPulse.color, B.finalPulse.life);
      /* M9.5 beat 6: the easter-egg reaction ends (M10.3 returns to
       * idle). */
      if (ENTITY._eggFired)
        for (const h of ENTITY._eggReact) h('end', t);
      ENTITY._cascadeFired = false;
      ENTITY._trafficFired = false;
      ENTITY._eggFired = false;
      ENTITY._beatAt.flare = 0;
      ENTITY._beatAt.ignite = 0;
      ENTITY._beatAt.surge = 0;
      ENTITY._beatAt.cascade = 0;
      ENTITY._beatAt.traffic = 0;
      ENTITY._beatAt.egg = 0;
    }
    let wakeP = 0;
    if (ENTITY.state === 'STIR') {
      const p = Math.min(1, Math.max(0, (t - ENTITY.stateT) / W.stir));
      wakeP = p * p * (3 - 2 * p);
    } else if (ENTITY.state === 'AWAKE') {
      wakeP = 1;
    } else if (ENTITY.state === 'DECAY') {
      const p = Math.min(1, Math.max(0, (t - ENTITY.stateT) / W.decay));
      wakeP = 1 - p * p * (3 - 2 * p);
    }
    /* STIR pose: head lifts + tilts up, jaw drops (M9.2) */
    const P = ENTITY.parts;
    P.head.rotation.x = -wakeP * W.headLift;
    P.head.position.y = 43.6 + wakeP * W.headRise;
    P.jaw.rotation.x = wakeP * W.jawOpen;
    /* M9.3 beat 2: node voxels ignite in radial waves from head level.
     * The front radius grows from the AWAKE entry; each node's lit
     * level smoothsteps in as the front passes, the hot front adds a
     * Gaussian brightness bump, and the lit level HOLDS through AWAKE,
     * then (M9.5 beat 7) dims outward during DECAY: a dim front travels
     * outward from head level and each node's lit excess scales by
     * (1 − dm) as it passes — it has passed the farthest node + width
     * by `decayDim.at` fraction of DECAY ⇒ DORMANT entry restores the
     * base colors byte-exact pop-free (transition block above). */
    if (ENTITY._ignited &&
        (ENTITY.state === 'AWAKE' || ENTITY.state === 'DECAY')) {
      const r = Math.min((t - ENTITY._awakeT0) * B.ignite.speed,
        ENTITY._dream.maxR + B.ignite.width * 3);
      const sig2 = 2 * B.ignite.width * B.ignite.width;
      let dimR = -1;
      if (ENTITY.state === 'DECAY')
        dimR = (t - ENTITY.stateT) * ENTITY._dimSpeed;
      const ic = ENTITY.nodes.instanceColor.array;
      const hue = ENTITY._nodeHue;
      const nb = ENTITY._nodeBright;
      const dist = ENTITY._nodeDist;
      const n = ENTITY.nodeCount;
      for (let i = 0; i < n; i++) {
        let u = (r - dist[i]) / B.ignite.width;
        u = u < 0 ? 0 : u > 1 ? 1 : u;
        const ig = u * u * (3 - 2 * u);
        const dd = dist[i] - r;
        let b = nb[i] + (B.ignite.bright - nb[i]) * ig +
          B.ignite.front * Math.exp(-(dd * dd) / sig2);
        if (dimR >= 0) {
          let dm = (dimR - dist[i]) / B.ignite.width;
          dm = dm < 0 ? 0 : dm > 1 ? 1 : dm;
          b = nb[i] + (b - nb[i]) * (1 - dm * dm * (3 - 2 * dm));
        }
        const i3 = i * 3;
        ic[i3] = hue[i3] * b;
        ic[i3 + 1] = hue[i3 + 1] * b;
        ic[i3 + 2] = hue[i3 + 2] * b;
      }
      ENTITY.nodes.instanceColor.needsUpdate = true;
    }
    /* M9.4 beats 4–5: the city-level cascade. Beat 4 launches the
     * plaza pulse ring + the city LED/sign wave; beat 5 fires the
     * traffic cascade (arcs, steam, drones, vehicles). Timers from
     * AWAKE entry, gated on _ignited (a forced non-sequence AWAKE
     * never cascades), one fire per sequence; DORMANT entry tears the
     * cascade down (transition block above). */
    const Cc = B.cascade;
    if (ENTITY._ignited && ENTITY.state === 'AWAKE') {
      const u = t - ENTITY._awakeT0;
      if (!ENTITY._cascadeFired && u >= Cc.pulse.delay) {
        ENTITY._cascadeFired = true;
        ENTITY._beatAt.cascade = t;
        ENTITY._pulseIt = FX.pulse(
          FX._fire.set(0, 0.4, 0), Cc.pulse.radius, Cc.pulse.color,
          Cc.pulse.life);
        WORLD.awakenWave(t);
      }
      if (!ENTITY._trafficFired && u >= Cc.traffic.delay) {
        ENTITY._trafficFired = true;
        ENTITY._beatAt.traffic = t;
        TRAFFIC.awaken();
      }
      /* M9.5 beat 6: the Unsloth easter-egg reaction hook (M10.3
       * registers its reaction via ENTITY.eggReact — nothing visible
       * until M10 lands). */
      if (!ENTITY._eggFired && u >= B.egg.delay) {
        ENTITY._eggFired = true;
        ENTITY._beatAt.egg = t;
        for (const h of ENTITY._eggReact) h('start', t);
      }
    }
    /* M9.3 beat 3: tensor rings tilt + limbs reposition, fired with a
     * camera-shake impulse. The level ramps in `delay` s after AWAKE
     * entry (integrated ⇒ a forced mid-ramp transition never jumps),
     * holds through AWAKE, ramps out over DECAY, and is forced to
     * exactly 0 in DORMANT (pose restores byte-exact: baseQ ×
     * identity, arms 0). */
    let surgeP = ENTITY._surgeP;
    if (ENTITY.state === 'AWAKE' && ENTITY._ignited) {
      const u = t - ENTITY._awakeT0 - B.surge.delay;
      if (u > 0) {
        if (!ENTITY._surgeFired) {
          ENTITY._surgeFired = true;
          ENTITY._beatAt.surge = t;
          CAMERA.shake(B.surge.shake);
        }
        surgeP = Math.min(1, Math.max(0, surgeP + dt / B.surge.ramp));
      }
    } else if (ENTITY.state === 'DECAY' && ENTITY._ignited) {
      surgeP = Math.max(0, surgeP - dt / W.decay);
    } else if (ENTITY.state === 'DORMANT') {
      surgeP = 0;
    }
    ENTITY._surgeP = surgeP;
    {
      const rings3 = ['ringA', 'ringB', 'ringC'];
      for (let i = 0; i < 3; i++) {
        const g = ENTITY.parts[rings3[i]];
        if (!g) continue;
        if (surgeP > 0) {
          const d = ENTITY._surgeDir[i];
          ENTITY._tiltE[i].x = d.x * B.surge.ringTilt * surgeP;
          ENTITY._tiltE[i].z = d.z * B.surge.ringTilt * surgeP;
          ENTITY._tiltQ[i].setFromEuler(ENTITY._tiltE[i]);
          g.quaternion.copy(ENTITY._ringBaseQ[i]).multiply(ENTITY._tiltQ[i]);
        } else {
          g.quaternion.copy(ENTITY._ringBaseQ[i]);
        }
      }
      if (surgeP > 0) {
        P.armL.rotation.z = -surgeP * B.surge.armLift;
        P.armR.rotation.z = surgeP * B.surge.armLift;
      } else {
        P.armL.rotation.z = 0;
        P.armR.rotation.z = 0;
      }
    }
    /* breathing: slow scale on the core (period ≈ 10.5 s) */
    const br = 1 + 0.008 * Math.sin(t * 0.6);
    ENTITY.core.scale.setScalar(br);
    /* tensor rings: almost-still idle spin, boosted through the wake
     * (M9.2) — integrated angle so the speed-up is continuous (no jump) */
    const rings = ['ringA', 'ringB', 'ringC'];
    const ringM = 1 + (W.ringBoost - 1) * wakeP;
    for (let i = 0; i < 3; i++) {
      ENTITY._ringAng[i] += dt * ENTITY.ringSpin[i] * ringM;
      const g = ENTITY.parts[rings[i]];
      if (g) g.children[0].rotation.z = ENTITY._ringAng[i];
    }
    /* antenna sway (M9.1): small deterministic tilt per mast group —
     * absolute in t ⇒ deterministic; the mast child stays put. */
    const AS = CFG.entity.antennaSway;
    for (let i = 0; i < 4; i++) {
      const g = ENTITY.parts['antenna' + (i + 1)];
      if (!g) continue;
      const ph = ENTITY._antPh[i];
      g.rotation.x = AS.amp * Math.sin(t * AS.speed + ph);
      g.rotation.z = AS.amp * Math.cos(t * AS.speed * 0.83 + ph * 1.7);
    }
    /* dream wave (M9.1): a periodic radial LED sweep across the node
     * grid — shader-less: per-node color = hue × (base + glow × front
     * envelope); the dormant base colors are restored byte-exact when
     * the front exits. _dreamFrozen pauses time (smoke screenshot). */
    const D = CFG.entity.dream;
    const dr = ENTITY._dream;
    let dreamLevel = 0;
    if (!ENTITY._dreamFrozen) {
      if (ENTITY.state === 'DORMANT' && !dr.active && t >= dr.nextAt) {
        dr.active = true;
        dr.t0 = t;
        dr.nextAt = t + D.every[0] +
          ENTITY._dreamRng() * (D.every[1] - D.every[0]);
      }
      if (dr.active) {
        const r = (t - dr.t0) * D.speed;
        if (r - D.width * 3 > dr.maxR) {
          dr.active = false;
          ENTITY.nodes.instanceColor.array.set(ENTITY._nodeBase);
          ENTITY.nodes.instanceColor.needsUpdate = true;
        } else {
          const sig2 = 2 * D.width * D.width;
          const env = Math.min(1, Math.max(
            0, (dr.maxR + D.width * 3 - r) / (D.width * 3)));
          const ic = ENTITY.nodes.instanceColor.array;
          const hue = ENTITY._nodeHue;
          const nb = ENTITY._nodeBright;
          const dist = ENTITY._nodeDist;
          const n = ENTITY.nodeCount;
          for (let i = 0; i < n; i++) {
            const dd = dist[i] - r;
            const a = Math.exp(-(dd * dd) / sig2) * env;
            const b = nb[i] + D.glow * a;
            const i3 = i * 3;
            ic[i3] = hue[i3] * b;
            ic[i3 + 1] = hue[i3 + 1] * b;
            ic[i3 + 2] = hue[i3 + 2] * b;
          }
          ENTITY.nodes.instanceColor.needsUpdate = true;
          dreamLevel = env;
        }
      }
    }
    /* coreEye: faint dormant pulse of the compute-core face (+ the
     * dream wave lifts the core as the front crosses it) */
    /* M9.3 beat 1: core-eye flare — emissive ramp toward the flare
     * color + hero-light boost, both exactly 0 at wakeP = 0. */
    const k = 0.5 + 0.5 * Math.sin(t * 0.6);
    ENTITY._hero.intensity = 0.9 + 0.3 * k + 0.5 * dreamLevel +
      1.5 * wakeP + B.flare.hero * wakeP;
    if (ENTITY.parts.coreEye) {
      ENTITY._col.copy(ENTITY._coreA).lerp(
        ENTITY._coreB, Math.min(1, 0.35 * k + 0.45 * dreamLevel +
        0.5 * wakeP));
      ENTITY._col.lerp(ENTITY._flareCol, B.flare.eye * wakeP);
      ENTITY.parts.coreEye.material.color.copy(ENTITY._col);
    }
    /* steam drip: 32 pooled puffs, 4 vents — rises, drifts, fades, re-enters */
    const pts = ENTITY._steam;
    if (pts) {
      const pos = pts.geometry.attributes.position.array;
      const col = pts.geometry.attributes.color.array;
      const pars = ENTITY._steamPars;
      for (let i = 0; i < pars.length; i++) {
        const p = pars[i];
        const age = (((t + p.off) % p.life) / p.life);   // 0..1, loops
        const rise = age * 7;
        const sway = 0.45 * age;
        const x = p.v[0] + Math.sin(t * 0.7 + p.ph) * sway;
        const y = p.v[1] + rise;
        const z = p.v[2] + Math.cos(t * 0.6 + p.ph) * sway * 0.8;
        pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
        const a = Math.sin(age * Math.PI) * 0.32;
        col[i * 3] = 0.55 * a; col[i * 3 + 1] = 0.65 * a; col[i * 3 + 2] = 0.75 * a;
      }
      pts.geometry.attributes.position.needsUpdate = true;
      pts.geometry.attributes.color.needsUpdate = true;
    }
  },

  dispose() {
    if (ENTITY.root) scene.remove(ENTITY.root);
  },
};

/* ====================================================================
 * ATMOS — night sky: gradient dome + stars + faint aurora band (M8.1)
 *
 * - dome: one big BackSide sphere with a vertical canvas gradient
 *   (deep zenith → glowing horizon). fog:false — the FogExp2 haze would
 *   swallow a 2400 m dome. Pinned to the camera every frame ⇒ the sky
 *   is correct from street, orbit, and far-fly (always 2400 m around
 *   the player, inside the 3000 m far plane).
 * - stars: one seeded Points cloud on the upper hemisphere, additive
 *   glow sprites (shared KIT glow texture), tier-capped by drawRange
 *   (zero allocation — the full HIGH set exists from init).
 * - aurora: one open-ended additive cylinder band at fixed altitude
 *   with slow spin — faint green curtains (static canvas texture).
 * - exactly 3 draw calls total, zero per-frame allocation.
 * - fog (M8.2): tuned FogExp2 depth (readable at 500 m) + zone-tinted
 *   haze — scene.fog.color smoothstep-lerps cyan (core) → warm (outer
 *   avenues) by camera distance from the plaza across the M3 zone
 *   boundaries; the dome horizon tint syncs so sky and haze match.
 *   All fog colors pre-allocated in init ⇒ zero per-frame allocation.
 * ==================================================================== */
const ATMOS = {
  name: 'ATMOS',
  root: null,
  dome: null,
  stars: null,
  aurora: null,
  shaftGroup: null,          // M8.3: light shafts (spires + creature core)
  shafts: null,
  coreShaft: null,
  ltGroup: null,             // M8.4: distant lightning (point flash + EM ring)
  ltFlash: null,             // M8.4: point flash billboard (fog-off sprite)
  emRing: null,              // M8.4: EM discharge ring (fog-off annulus)
  _lt: null,                 // M8.4: live event state
  _ltTimer: 0,               // M8.4: auto event countdown (s)
  ltFired: 0,                // M8.4: total events fired (dev/smoke handle)
  _hemiBoost: 0,             // M8.4: hemi intensity boost (decays)
  _ltRng: null,              // M8.4: seeded rng (strike points + timer)
  _ltTint: null,             // M8.4: ring tint scratch

  init() {
    const A = CFG.atmos;
    ATMOS.root = new THREE.Group();

    /* M8.2: zone-tinted haze — pre-allocated fog colors (zero per-frame
     * allocation); the scene fog color lerps cyan (core) → warm (outer
     * avenues) with camera distance from the plaza and the dome
     * horizon tint syncs so sky and haze match. */
    const F = CFG.atmos.fog;
    ATMOS._fogCore = new THREE.Color(F.core);
    ATMOS._fogOuter = new THREE.Color(F.outer);
    ATMOS._fog = new THREE.Color(F.core);
    ATMOS._tintCore = new THREE.Color(F.domeTint.core);
    ATMOS._tintOuter = new THREE.Color(F.domeTint.outer);

    /* dome: vertical gradient — canvas top (v = 1) is the zenith,
     * v = 0.5 is the horizon (where the fog-tinted city sits), below
     * the horizon fades to the void colour. */
    const sky = makeCanvasTexture(1, 256, (ctx, w, h) => {
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0.00, '#05070f');   // zenith — deep night
      g.addColorStop(0.35, '#081226');
      g.addColorStop(0.48, '#0d1c33');
      g.addColorStop(0.52, '#16304f');   // horizon glow (city haze)
      g.addColorStop(0.58, '#0a1526');
      g.addColorStop(0.80, '#05080f');
      g.addColorStop(1.00, '#04060c');   // below the horizon
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    });
    ATMOS.dome = new THREE.Mesh(
      new THREE.SphereGeometry(A.dome.radius, 32, 20),
      new THREE.MeshBasicMaterial({
        map: sky.tex,
        side: THREE.BackSide,
        fog: false,
        depthWrite: false,
      }),
    );
    ATMOS.root.add(ATMOS.dome);

    /* stars: seeded upper-hemisphere points (deterministic field),
     * tier cap via drawRange — no allocation at any tier. */
    const cap = A.stars.tiers.high;
    const pos = new Float32Array(cap * 3);
    const col = new Float32Array(cap * 3);
    const rnd = mulberry32(0xA705);
    const c = new THREE.Color();
    for (let i = 0; i < cap; i++) {
      const el = Math.asin(0.06 + 0.94 * rnd());   // elevation 3.4°..90°
      const az = rnd() * Math.PI * 2;
      const r = A.stars.radius;
      pos[i * 3] = Math.cos(el) * Math.sin(az) * r;
      pos[i * 3 + 1] = Math.sin(el) * r;
      pos[i * 3 + 2] = Math.cos(el) * Math.cos(az) * r;
      const b = 0.55 + 0.45 * rnd();                // brightness
      const warm = rnd();                          // rare warm / most cool
      c.setRGB(
        b * (warm < 0.7 ? 0.85 : 1.0),
        b * (warm < 0.7 ? 0.92 : 0.95),
        b * (warm < 0.7 ? 1.0 : 0.8));
      col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
    }
    const sg = new THREE.BufferGeometry();
    sg.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    sg.setAttribute('color', new THREE.BufferAttribute(col, 3));
    ATMOS.stars = new THREE.Points(sg, new THREE.PointsMaterial({
      size: A.stars.size,
      sizeAttenuation: false,
      map: KIT.tex.glow.tex,          // shared soft glow sprite
      vertexColors: true,
      transparent: true,
      opacity: 0.9,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      fog: false,
    }));
    ATMOS.stars.geometry.setDrawRange(0, cap);
    ATMOS.root.add(ATMOS.stars);

    /* aurora: open-ended additive band at fixed altitude, slow spin.
     * Static canvas — green curtains fading out at both edges. */
    const band = makeCanvasTexture(512, 256, (ctx, w, h) => {
      ctx.clearRect(0, 0, w, h);
      /* green-dominant curtains fading out at both edges; the
       * material opacity (CFG.atmos.aurora.opacity) does the final
       * "faint" dimming. */
      const v = ctx.createLinearGradient(0, 0, 0, h);
      v.addColorStop(0, 'rgba(100,255,120,0)');
      v.addColorStop(0.35, 'rgba(100,255,120,0.20)');
      v.addColorStop(0.55, 'rgba(110,255,130,0.50)');
      v.addColorStop(1, 'rgba(100,255,120,0)');
      ctx.fillStyle = v;
      ctx.fillRect(0, 0, w, h);
      const arnd = mulberry32(0x5EED);
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 90; i++) {
        const x = arnd() * w;
        const ww = 6 + arnd() * 34;
        const a = 0.15 + arnd() * 0.30;
        const hue = arnd() < 0.5 ? '100,255,120' : '70,240,90';
        const g = ctx.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, `rgba(${hue},0)`);
        g.addColorStop(0.5, `rgba(${hue},${a})`);
        g.addColorStop(1, `rgba(${hue},0)`);
        ctx.fillStyle = g;
        ctx.fillRect(x, 0, ww, h);
      }
      ctx.globalCompositeOperation = 'source-over';
    });
    ATMOS.aurora = new THREE.Mesh(
      new THREE.CylinderGeometry(
        A.aurora.radius, A.aurora.radius, A.aurora.height, 96, 1, true),
      new THREE.MeshBasicMaterial({
        map: band.tex,
        transparent: true,
        opacity: A.aurora.opacity,
        side: THREE.BackSide,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        fog: false,
      }),
    );
    ATMOS.aurora.position.y = A.aurora.altitude;
    ATMOS.root.add(ATMOS.aurora);

    /* M8.3: volumetric-ish light shafts — additive cones from key fiber
     * spires + the creature core. Only visible when near (radius /
     * coreRadius) or during awakening (ENTITY.state !== 'DORMANT' —
     * M9 seam). All meshes, materials, and scratch are pre-allocated
     * here; a hidden shaft costs 0 draw calls (visible = opacity > 0),
     * so far away the whole group is free. FrontSide (the transparent
     * DoubleSide 2x draw-call trap, M2) — the outer surface of the
     * cone is what is seen. */
    const SH = A.shaft;
    ATMOS.shaftGroup = new THREE.Group();
    ATMOS.shaftGroup.name = 'ATMOS-shafts';
    const shaftTex = makeCanvasTexture(1, 128, (ctx, w, h) => {
      /* vertical: canvas top (v = 1 = the tip) is bright, the base
       * fades out — the material color tints it. */
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0.0, 'rgba(255,255,255,0.9)');
      g.addColorStop(0.5, 'rgba(255,255,255,0.35)');
      g.addColorStop(1.0, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    });
    const shaftMat = tint => new THREE.MeshBasicMaterial({
      map: shaftTex.tex,
      color: tint,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      fog: false,
    });
    ATMOS.shafts = [];
    for (let i = 0; i < SH.tiers.high; i++) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(SH.rTop, SH.rBottom, SH.len, 10, 1, true),
        shaftMat(SH.color));
      mesh.visible = false;
      ATMOS.shaftGroup.add(mesh);
      ATMOS.shafts.push({ mesh, op: 0, x: 0, z: 0, tip: 0 });
    }
    /* creature core shaft — larger, brighter, from the core eye */
    const coreMesh = new THREE.Mesh(
      new THREE.CylinderGeometry(SH.rTop, SH.coreRBottom, SH.coreLen,
        10, 1, true),
      shaftMat(SH.coreColor));
    coreMesh.visible = false;
    ATMOS.shaftGroup.add(coreMesh);
    ATMOS.coreShaft = { mesh: coreMesh, op: 0 };
    /* pre-allocated scan scratch: the nearest `tiers.high` spires */
    ATMOS._best = Array.from(
      { length: SH.tiers.high },
      () => ({ x: 0, z: 0, tip: 0, d2: Infinity }));
    ATMOS._corePos = new THREE.Vector3();
    ATMOS._shaftTimer = 0;
    ATMOS.root.add(ATMOS.shaftGroup);

    /* M8.4: distant lightning — point flash billboard + EM discharge
     * ring. Both fog-off additive (the strike is beyond the haze wall,
     * they must glow through it); hidden while idle ⇒ 0 draw calls. */
    const LG = A.lightning;
    ATMOS.ltGroup = new THREE.Group();
    ATMOS.ltGroup.name = 'ATMOS-lightning';
    ATMOS.ltFlash = new THREE.Sprite(new THREE.SpriteMaterial({
      map: KIT.tex.glow.tex,
      color: LG.flashColor,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      fog: false,
      toneMapped: false,
    }));
    ATMOS.ltFlash.name = 'lightning-point-flash';
    ATMOS.ltFlash.visible = false;
    ATMOS.ltGroup.add(ATMOS.ltFlash);
    const emGeo = new THREE.RingGeometry(0.6, 1.0, 64);
    emGeo.rotateX(-Math.PI / 2);
    ATMOS.emRing = new THREE.Mesh(emGeo, new THREE.MeshBasicMaterial({
      color: LG.ring.color,
      transparent: true,
      opacity: 1,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      fog: false,
    }));
    ATMOS.emRing.name = 'lightning-em-ring';
    ATMOS.emRing.frustumCulled = false;
    ATMOS.emRing.visible = false;
    ATMOS.ltGroup.add(ATMOS.emRing);
    ATMOS._lt = { active: false, age: 0, life: 0, x: 0, z: 0, alt: 0 };
    ATMOS._ltTimer = LG.firstDelay;
    ATMOS.ltFired = 0;
    ATMOS._hemiBoost = 0;
    ATMOS._ltRng = mulberry32(CFG.city.seed ^ 0x517C);
    ATMOS._ltTint = new THREE.Color();
    ATMOS.root.add(ATMOS.ltGroup);

    scene.add(ATMOS.root);
  },

  /* M8.4: fire one distant lightning event — a random far point
   * (seeded rng ⇒ deterministic per page load): brief hemi bump +
   * screen flash + fog-off point flash + EM ring + lightning motes.
   * Optional (x, z, alt): re-fire at a known point (dev/smoke seam). */
  _fireLightning(x, z, alt) {
    const LG = CFG.atmos.lightning;
    const r = ATMOS._ltRng;
    if (x === undefined) {
      const d = LG.dist[0] + r() * (LG.dist[1] - LG.dist[0]);
      const az = r() * 6.2831853;
      x = Math.cos(az) * d;
      z = Math.sin(az) * d;
      alt = LG.altitude[0] + r() * (LG.altitude[1] - LG.altitude[0]);
    }
    ATMOS._lt.active = true;
    ATMOS._lt.age = 0;
    ATMOS._lt.life = LG.ring.life;
    ATMOS._lt.x = x;
    ATMOS._lt.z = z;
    ATMOS._lt.alt = alt;
    ATMOS.ltFired++;
    /* brief hemi intensity bump (decays in update) */
    ATMOS._hemiBoost = LG.hemiBoost;
    /* screen flash (M7.4 FX seam) */
    FX.flash(LG.flash, LG.flashColor);
    /* point flash billboard at the far strike point */
    ATMOS.ltFlash.position.set(x, alt, z);
    ATMOS.ltFlash.scale.set(LG.flashSize, LG.flashSize, 1);
    ATMOS.ltFlash.visible = true;
    /* EM discharge ring from the strike point's ground position */
    ATMOS.emRing.position.set(x, LG.ring.y, z);
    ATMOS.emRing.scale.set(2, 1, 2);
    ATMOS.emRing.visible = true;
    /* lightning motes around the far point (PARTS 'light' pool) */
    PARTS.lightning(x, z, LG.motes);
  },

  /* M8.3: nearest-N spire scan (the M6.4 PARTS pattern) — replays the
   * seeded M3 fiber blocks around the camera and keeps the N closest
   * in _best (no sort, no allocation). */
  _refreshShafts() {
    const S = CFG.atmos.shaft;
    const B = WORLD.BLOCK, K = WORLD.CHUNK;
    const pcx = Math.floor(CAMERA.pos.x / B);
    const pcz = Math.floor(CAMERA.pos.z / B);
    const pcx2 = Math.floor(pcx / K), pcz2 = Math.floor(pcz / K);
    const n = Math.ceil(S.radius / B);
    const best = ATMOS._best;
    for (let i = 0; i < best.length; i++) best[i].d2 = Infinity;
    for (let bx = pcx - n; bx <= pcx + n; bx++) {
      for (let bz = pcz - n; bz <= pcz + n; bz++) {
        const ring = Math.max(
          Math.abs(Math.floor(bx / K) - pcx2),
          Math.abs(Math.floor(bz / K) - pcz2));
        const c = WORLD.buildingAt(bx, bz, ring, ['fiber'], 0);
        if (!c) continue;
        const dx = c.x - CAMERA.pos.x, dz = c.z - CAMERA.pos.z;
        const d2 = dx * dx + dz * dz;
        if (d2 > S.radius * S.radius) continue;
        /* keep the N nearest: replace the current farthest slot */
        let fi = 0, fd = -1;
        for (let i = 0; i < best.length; i++) {
          if (best[i].d2 > fd) { fd = best[i].d2; fi = i; }
        }
        if (d2 < fd) {
          best[fi].x = c.x; best[fi].z = c.z;
          best[fi].tip = c.hTop; best[fi].d2 = d2;
        }
      }
    }
  },


  update(dt, t) {
    const A = CFG.atmos;
    /* "at infinity": everything pinned to the camera — the dome is
     * always 2400 m around the player, so street / orbit / far-fly
     * all see a correct sky. */
    ATMOS.dome.position.copy(camera.position);
    ATMOS.stars.position.copy(camera.position);
    ATMOS.aurora.position.set(
      camera.position.x, A.aurora.altitude, camera.position.z);
    ATMOS.aurora.rotation.y = t * A.aurora.spin;
    /* tier cap: drawRange only (no allocation) */
    ATMOS.stars.geometry.setDrawRange(0, A.stars.tiers[TIER.active()]);

    /* M8.2: zone-tinted haze — smoothstep the fog color across the M3
     * zone boundaries by camera distance from the plaza (cyan core →
     * warm outer avenues) and sync the dome horizon tint. No
     * allocation: every color is pre-allocated in init. */
    {
      const F = A.fog;
      const d = Math.hypot(camera.position.x, camera.position.z);
      let s = (d - F.zone.core) / (F.zone.outer - F.zone.core);
      s = s < 0 ? 0 : s > 1 ? 1 : s;
      const k = s * s * (3 - 2 * s);
      ATMOS._fog.copy(ATMOS._fogCore).lerp(ATMOS._fogOuter, k);
      scene.fog.color.copy(ATMOS._fog);
      ATMOS.dome.material.color.copy(ATMOS._tintCore).lerp(ATMOS._tintOuter, k);
    }

    /* M8.3: volumetric-ish light shafts — spire cones only when near,
     * the creature core cone when near OR during awakening (M9 seam:
     * any non-DORMANT state). Opacity eases (no pop); hidden = 0
     * draw calls. No allocation: scan scratch is pre-allocated. */
    {
      const S = A.shaft;
      ATMOS._shaftTimer -= dt;
      if (ATMOS._shaftTimer <= 0) {
        ATMOS._shaftTimer += S.refresh;
        ATMOS._refreshShafts();
      }
      const cap = S.tiers[TIER.active()];
      const ease = 1 - Math.exp(-S.fade * dt);
      for (let i = 0; i < ATMOS.shafts.length; i++) {
        const s = ATMOS.shafts[i];
        const b = ATMOS._best[i];
        const on = i < cap && b.d2 !== Infinity;
        if (on && (s.x !== b.x || s.z !== b.z)) {
          s.x = b.x; s.z = b.z; s.tip = b.tip;
        }
        s.op += ((on ? 1 : 0) - s.op) * ease;
        if (s.op < 0.004) s.op = 0;
        s.mesh.visible = s.op > 0;
        if (!s.mesh.visible) continue;
        s.mesh.material.opacity = S.opacity * s.op;
        /* short spire ⇒ scale the cone down to the tip (beam ends at
         * the ground); tall spire ⇒ full length below the tip */
        if (s.tip >= S.len) {
          s.mesh.scale.y = 1;
          s.mesh.position.set(s.x, s.tip - S.len * 0.5, s.z);
        } else {
          s.mesh.scale.y = s.tip / S.len;
          s.mesh.position.set(s.x, s.tip * 0.5, s.z);
        }
      }
      /* creature core shaft: the core eye is the light source */
      const cs = ATMOS.coreShaft;
      let coreOn = 0;
      const eye = ENTITY.parts && ENTITY.parts.coreEye;
      if (eye) {
        ATMOS._corePos.setFromMatrixPosition(eye.matrixWorld);
        const d = Math.hypot(
          ATMOS._corePos.x - CAMERA.pos.x,
          ATMOS._corePos.z - CAMERA.pos.z);
        if (d < S.coreRadius || ENTITY.state !== 'DORMANT') coreOn = 1;
      }
      cs.op += (coreOn - cs.op) * ease;
      if (cs.op < 0.004) cs.op = 0;
      cs.mesh.visible = cs.op > 0;
      if (cs.mesh.visible) {
        cs.mesh.material.opacity = S.opacity * 1.5 * cs.op;
        const tip = ATMOS._corePos.y;
        if (tip >= S.coreLen) {
          cs.mesh.scale.y = 1;
          cs.mesh.position.set(
            ATMOS._corePos.x, tip - S.coreLen * 0.5, ATMOS._corePos.z);
        } else {
          cs.mesh.scale.y = tip / S.coreLen;
          cs.mesh.position.set(
            ATMOS._corePos.x, tip * 0.5, ATMOS._corePos.z);
        }
      }
    }

    /* M8.4: distant lightning — brief hemi bump + auto timer + manual
     * key (L). The hemi intensity is re-synced every frame (base +
     * decaying boost) so it always settles back to the rig value. */
    {
      const LG = A.lightning;
      ATMOS._hemiBoost *= Math.exp(-LG.hemiDecay * dt);
      if (ATMOS._hemiBoost < 0.001) ATMOS._hemiBoost = 0;
      KIT.hemi.intensity = CFG.lights.hemiIntensity + ATMOS._hemiBoost;

      let fire = false;
      ATMOS._ltTimer -= dt;
      if (ATMOS._ltTimer <= 0) {
        ATMOS._ltTimer =
          LG.every[0] + ATMOS._ltRng() * (LG.every[1] - LG.every[0]);
        fire = true;
      }
      if (INPUT.lightningTrigger) {
        INPUT.lightningTrigger = false;
        fire = true;
      }
      if (fire) ATMOS._fireLightning();

      const lt = ATMOS._lt;
      if (lt.active) {
        /* _ltFrozen: dev/smoke seam — hold the event time (screenshots)
         * without pausing the rest of the sim */
        if (!ATMOS._ltFrozen) lt.age += dt;
        const u = lt.age / lt.life;
        if (u >= 1) {
          lt.active = false;
          ATMOS.emRing.visible = false;
          ATMOS.ltFlash.visible = false;
        } else {
          /* EM discharge ring: ease-out expansion, sin-fade tint
           * (additive ⇒ color IS the light) */
          const e = 1 - Math.pow(1 - u, 3);
          const R = 2 + (LG.ring.radius - 2) * e;
          ATMOS.emRing.scale.set(R, 1, R);
          ATMOS._ltTint.setHex(LG.ring.color);
          ATMOS._ltTint.multiplyScalar(Math.sin(u * Math.PI) * 0.9);
          ATMOS.emRing.material.color.copy(ATMOS._ltTint);
          /* point flash: brief flicker at the far strike point */
          const fu = lt.age / LG.flashDur;
          if (fu < 1) {
            const flick = 0.75 + 0.25 * Math.sin(lt.age * 55);
            ATMOS.ltFlash.material.opacity = Math.sin(fu * Math.PI) * flick;
          } else {
            ATMOS.ltFlash.visible = false;
          }
        }
      }
    }
  },

  dispose() {
    if (ATMOS.root) scene.remove(ATMOS.root);
  },
};

/* ------------------------------------------------------------------ *
 * Subsystems — FIXED BOOT ORDER = registration order.
 * M0: HUD   M1: INPUT, CAMERA   M2: KIT   M3: WORLD   M5: ENTITY
 * M6.2: TRAFFIC   (registered after ENTITY, before HUD)
 * M7.2: FX   (registered after PARTS, before HUD)
 * M8.1: ATMOS   (registered after FX, before HUD)
 * M11.2: AUDIO  (registered after ATMOS, before HUD — bed thump timer)
 * ------------------------------------------------------------------ */
const systems = [];
function registerSystem(sys) {
  if (!sys || !sys.name || systems.some(s => s.name === sys.name)) return;
  systems.push(sys);
}

/* ---- HUD: FPS + state + camera readout (DOM, no 3D canvas text) ---- */
const HUD = {
  name: 'HUD',
  el: null,
  hintEl: null,
  fps: 0,
  acc: 0,
  accFrames: 0,

  init() {
    HUD.el = document.getElementById('hud');
    HUD.hintEl = document.getElementById('hint');
    HUD.hintEl.textContent =
      'WASD/ZQSD move · SPACE up · C down · SHIFT sprint\n' +
      'MOUSE look · WHEEL zoom · MMB drag orbit · V camera\n' +
      'P particles · R pulse · T arcs · B flash · N shake · L lightning\n' +
      'F awaken · M mute';
    /* M9.6: HUD awaken button — same entry as the F key: the manual
     * trigger path routes through ENTITY.wake() (no-op unless DORMANT)
     * and marks the session user-triggered so the one-shot auto skips. */
    const btn = document.getElementById('awakeBtn');
    HUD.btnEl = btn;
    btn.addEventListener('click', () => {
      if (BOOT.state !== 'RUNNING') return;
      ENTITY._userTriggered = true;
      ENTITY.wake();
    });
  },

  update(dt) {
    HUD.acc += dt;
    HUD.accFrames++;
    if (HUD.acc >= 0.5) {
      HUD.fps = HUD.accFrames / HUD.acc;
      HUD.acc = 0;
      HUD.accFrames = 0;
      if (HUD.el) {
        const mode = CAMERA.orbit ? 'ORBIT' : CAMERA.mode;
        const mouse = INPUT.pointerLocked ? 'locked' : 'click to capture';
        const pad = INPUT.pad.connected ? 'PAD' : '-';
        const mute = AUDIO.muted ? 'MUTED' : 'mute: M';
        HUD.el.textContent =
          `FPS ${String(Math.round(HUD.fps)).padStart(2, ' ')}\n` +
          `STATE ${BOOT.state}\n` +
          `AI ${ENTITY.state}\n` +
          `CAM ${mode} · FOV ${Math.round(camera.fov)} · ${mouse} · ${pad}\n` +
          `${mute}`;
        HUD.el.style.whiteSpace = 'pre';
      }
    }
  },
};

/* ------------------------------------------------------------------ *
 * INTRO — M12 intro cinematic: camera-keyframe timeline runner +
 * beat 1 (dark server corridor).
 *
 * Timeline runner (no async resources anywhere): play(track, onDone)
 * / cancel() / seek(t), driven from the central update loop. A track
 * is a list of keyframes { t, pos: [x,y,z], look: [x,y,z] }, eased
 * (smoothstep) between consecutive pairs. While playing, INTRO owns
 * the camera pose — written AFTER CAMERA.update, so it wins the frame;
 * on cancel the camera returns to CAMERA.pos on the next frame; at
 * the track end onDone(t) runs (the intro hands off to the street
 * camera via _toStreet). seek works playing or cancelled — it just
 * applies the pose at time t.
 *
 * Beat 1: a near-black instanced tunnel of LED strips — shell + rack
 * rows + strip lines + flowing dashes, built synchronously in init in
 * its own scene (rendered instead of the city while INTRO plays). 4
 * draw calls, zero per-frame allocation.
 * ------------------------------------------------------------------ */
const INTRO = {
  name: 'INTRO',
  scene: null,            // corridor scene (rendered while INTRO plays)
  shell: null,            // merged tunnel shell (1 draw call)
  racks: null,            // InstancedBox batcher — rack rows (1 call)
  strips: null,           // merged LED strip lines (1 call)
  dashes: null,           // InstancedBox batcher — flowing dashes (1 call)
  _dashZ: null,           // Float32Array — dash z (flow along -Z, wrap)
  _dashLine: null,        // Int16Array — dash line index
  _lineXY: null,          // [[x, y], …] — strip line anchors
  _m4: null,
  _pos: null,             // pose scratch (Vector3)
  _look: null,
  playing: false,
  track: null,            // keyframes [{ t, pos, look }]
  t: 0,
  dur: 0,
  onDone: null,

  init() {
    const C = CFG.intro.corridor;
    const L = C.len, W = C.width, H = C.height;
    INTRO.scene = new THREE.Scene();
    INTRO.scene.background = new THREE.Color(C.bg);
    INTRO.scene.fog = new THREE.FogExp2(C.bg, C.fogDensity);
    /* one dim ambient so the Lambert shell/racks read (the strips and
     * dashes are unlit Basic — they carry the light). */
    INTRO.scene.add(new THREE.AmbientLight(0x33445c, 0.9));

    /* shell: floor / ceiling / side walls / end walls — merged into
     * one static mesh (1 draw call). The end walls close the tunnel;
     * M12.2's "corridor opens" beat removes/opens the far one. */
    const box = (w, h, d, x, y, z) => ({
      geo: new THREE.BoxGeometry(w, h, d),
      matrix: new THREE.Matrix4().makeTranslation(x, y, z),
    });
    INTRO.shell = new THREE.Mesh(KIT.mergeGeometries([
      box(W, 0.5, L, 0, -0.25, 0),              // floor
      box(W, 0.5, L, 0, H + 0.25, 0),           // ceiling
      box(0.5, H, L, -W / 2 - 0.25, H / 2, 0), // left wall
      box(0.5, H, L, W / 2 + 0.25, H / 2, 0),  // right wall
      box(W, H, 0.5, 0, H / 2, -L / 2 - 0.25), // far end wall
      box(W, H, 0.5, 0, H / 2, L / 2 + 0.25),  // near end wall
    ]), MATS.server);
    INTRO.scene.add(INTRO.shell);

    /* rack rows: instanced server racks along both walls (1 call),
     * deterministic per-instance tint salt (no two neighbours equal). */
    const perSide = Math.floor(L / C.rackGap);
    INTRO.racks = KIT.InstancedBox(perSide * 2, [1.8, 3, 1.2], MATS.metalDark);
    const tint = new THREE.Color();
    for (let s = 0; s < 2; s++) {
      const x = s === 0 ? -W / 2 + 0.65 : W / 2 - 0.65;
      for (let i = 0; i < perSide; i++) {
        const z = -L / 2 + C.rackGap / 2 + i * C.rackGap;
        const v = 0.72 + ((i * 37 + s * 11) % 10) * 0.04;
        tint.setRGB(v * 0.72, v * 0.82, v);
        INTRO.racks.add(x, 1.5, z, 1, tint.getHex());
      }
    }
    INTRO.racks.commit();
    INTRO.scene.add(INTRO.racks.mesh);

    /* LED strip lines: 4 long emissive strips (2 per wall) — merged,
     * 1 draw call. The flowing dashes ride the same 4 lines. */
    const sy = [0.4, H - 0.4];
    INTRO._lineXY = [];
    for (const s of [-1, 1]) for (const y of sy)
      INTRO._lineXY.push([s * (W / 2 - 0.06), y]);
    const sparts = [];
    for (const [lx, ly] of INTRO._lineXY)
      sparts.push({
        geo: new THREE.BoxGeometry(0.12, 0.12, L),
        matrix: new THREE.Matrix4().makeTranslation(lx, ly, 0),
      });
    INTRO._stripMat = new THREE.MeshBasicMaterial({
      color: 0x3fd4ff, toneMapped: false,
    });
    INTRO.strips = new THREE.Mesh(KIT.mergeGeometries(sparts), INTRO._stripMat);
    INTRO.scene.add(INTRO.strips);

    /* flowing dashes: the "data" on the strips — instanced (1 call),
     * flow along -Z and wrap. Per-instance colour set once at init.
     * All per-dash state is pre-allocated ⇒ zero per-frame allocation. */
    const n = C.dashLines * C.dashesPerLine;
    INTRO._dashMat = new THREE.MeshBasicMaterial({
      color: 0xffffff, transparent: true, opacity: 0.95,
      blending: THREE.AdditiveBlending, depthWrite: false,
      toneMapped: false,
    });
    INTRO.dashes = KIT.InstancedBox(n, C.dashSize, INTRO._dashMat);
    INTRO._dashZ = new Float32Array(n);
    INTRO._dashLine = new Int16Array(n);
    INTRO._m4 = new THREE.Matrix4();
    const span = L + 8;
    const col = new THREE.Color();
    for (let i = 0; i < n; i++) {
      const line = i % C.dashLines;            // interleaved across lines
      INTRO._dashLine[i] = line;
      INTRO._dashZ[i] = -L / 2 - 4 + ((i * 97) % 1000) / 1000 * span;
      INTRO._m4.makeTranslation(INTRO._lineXY[line][0], INTRO._lineXY[line][1], INTRO._dashZ[i]);
      INTRO.dashes.mesh.setMatrixAt(i, INTRO._m4);
      col.set(i % 13 === 0 ? 0xffd166 : i % 7 === 0 ? 0xffffff : 0x9ff2ff);
      INTRO.dashes.mesh.setColorAt(i, col);
    }
    /* matrices written directly on the mesh (not via add) — set the
     * batcher count so commit() exposes all instances. */
    INTRO.dashes.count = n;
    INTRO.dashes.commit();
    INTRO.scene.add(INTRO.dashes.mesh);

    INTRO._pos = new THREE.Vector3();
    INTRO._look = new THREE.Vector3();
  },

  /* Beat 1: the corridor dolly — ease in, cruise, ease out (three
   * keyframes, smoothstep between them); the look point stays 20 m
   * ahead so the tunnel rushes by. */
  _beat1() {
    const C = CFG.intro.corridor;
    const d = CFG.intro.beat1.dur;
    const z0 = C.len / 2 - 6, z1 = -C.len / 2 + 6, y = C.eyeY;
    return [
      { t: 0,        pos: [0, y, z0], look: [0, y, z0 - 20] },
      { t: d * 0.5,  pos: [0, y, 0],  look: [0, y, -20] },
      { t: d,        pos: [0, y, z1], look: [0, y, z1 - 20] },
    ];
  },

  /* ---- timeline runner API ---- */
  play(track, onDone) {
    if (!track || track.length < 2) return;
    INTRO.track = track;
    INTRO.t = 0;
    INTRO.dur = track[track.length - 1].t;
    INTRO.onDone = onDone || null;
    INTRO.playing = true;
    INTRO._applyPose();
  },

  cancel() {
    if (!INTRO.playing) return;
    INTRO.playing = false;
    INTRO.onDone = null;
    /* the camera returns to CAMERA.pos on the next frame — CAMERA
     * update writes it; INTRO simply stops overwriting. */
  },

  seek(t) {
    if (!INTRO.track) return;
    INTRO.t = clamp(t, 0, INTRO.dur);
    INTRO._applyPose();
  },

  update(dt, t) {
    if (INTRO.playing) {
      INTRO.t += dt;
      if (INTRO.t >= INTRO.dur) {
        INTRO.t = INTRO.dur;
        INTRO.playing = false;
        INTRO._applyPose();
        const done = INTRO.onDone;
        INTRO.onDone = null;
        if (done) done(INTRO.t);
      } else {
        INTRO._applyPose();
      }
      INTRO._advanceDashes(dt);
    }
  },

  /* keyframe pair + smoothstep → camera pose (position + lookAt) */
  _applyPose() {
    const kfs = INTRO.track;
    if (!kfs) return;
    let i = kfs.length - 2;
    for (let j = 0; j < kfs.length - 1; j++) {
      if (INTRO.t < kfs[j + 1].t) { i = j; break; }
    }
    const a = kfs[i], b = kfs[i + 1];
    let u = (INTRO.t - a.t) / ((b.t - a.t) || 1);
    u = clamp(u, 0, 1);
    const e = u * u * (3 - 2 * u);            // smoothstep
    const p = INTRO._pos, l = INTRO._look;
    p.set(
      a.pos[0] + (b.pos[0] - a.pos[0]) * e,
      a.pos[1] + (b.pos[1] - a.pos[1]) * e,
      a.pos[2] + (b.pos[2] - a.pos[2]) * e,
    );
    l.set(
      a.look[0] + (b.look[0] - a.look[0]) * e,
      a.look[1] + (b.look[1] - a.look[1]) * e,
      a.look[2] + (b.look[2] - a.look[2]) * e,
    );
    camera.position.copy(p);
    camera.lookAt(l);
  },

  /* flowing dashes: advance along -Z, wrap, rewrite matrices —
   * pre-allocated scratch only (zero per-frame allocation). */
  _advanceDashes(dt) {
    const C = CFG.intro.corridor;
    const span = C.len + 8;
    const mesh = INTRO.dashes.mesh;
    const m4 = INTRO._m4;
    const n = C.dashLines * C.dashesPerLine;
    for (let i = 0; i < n; i++) {
      let z = INTRO._dashZ[i] - C.dashSpeed * dt;
      if (z < -C.len / 2 - 4) z += span;
      INTRO._dashZ[i] = z;
      const xy = INTRO._lineXY[INTRO._dashLine[i]];
      m4.makeTranslation(xy[0], xy[1], z);
      mesh.setMatrixAt(i, m4);
    }
    mesh.instanceMatrix.needsUpdate = true;
  },

  /* intro end (natural track end or skip) — hand off to the M0 street
   * spawn so the camera is controllable; the M9.6 auto-awaken anchor
   * (BOOT.t0) is set by enter('RUNNING') as before. */
  _toStreet() {
    INTRO.playing = false;
    INTRO.onDone = null;
    const S = CFG.intro.street;
    camera.position.set(S.pos[0], S.pos[1], S.pos[2]);
    camera.lookAt(S.look[0], S.look[1], S.look[2]);
    CAMERA.pos.copy(camera.position);
    camera.getWorldDirection(_camDir);
    CAMERA.yaw = Math.atan2(-_camDir.x, -_camDir.z);
    CAMERA.pitch = Math.asin(clamp(_camDir.y, -1, 1));
    CAMERA.fov = 60;
    camera.fov = 60;
    camera.updateProjectionMatrix();
    CAMERA.vel.set(0, 0, 0);
    CAMERA.mode = 'GROUND';
    CAMERA.blend = 0;
    CAMERA.blendTarget = 0;
    CAMERA.orbit = null;
    CAMERA.shakeEnergy = 0;
    BOOT.enter('RUNNING');
  },
};

registerSystem(INPUT);
registerSystem(CAMERA);
registerSystem(INTRO);
registerSystem(KIT);
registerSystem(WORLD);
registerSystem(ENTITY);
registerSystem(TRAFFIC);
registerSystem(PARTS);
registerSystem(FX);
registerSystem(ATMOS);
registerSystem(AUDIO);
registerSystem(HUD);
for (const s of systems) if (s.init) s.init();
/* M10.3: wire the unsloth easter-egg reaction (after all systems init —
 * ENTITY._eggReact is created in ENTITY.init; WORLD boots before ENTITY). */
WORLD.wireEgg();

/* ------------------------------------------------------------------ *
 * Central loop — driven only after BOOT.enter('RUNNING')
 * ------------------------------------------------------------------ */
let lastNow = performance.now();

function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - lastNow) / 1000, 0.1);   // clamp (tab-hide)
  lastNow = now;
  const t = now / 1000;
  for (const s of systems) {
    if (!s.update) continue;
    try {
      s.update(dt, t);
    } catch (err) {
      // one bad subsystem must not strand the whole loop:
      // surface it and disable it for the rest of the session
      s.update = null;
      BOOT.fail(
        'RUNTIME ERROR in subsystem ' + s.name + ' — ' +
        (err && err.message ? err.message : err) +
        '\nSubsystem disabled, reload the page to retry.',
      );
    }
  }
  renderer.info.reset();
  /* M12: while the intro cinematic plays, the corridor scene renders
   * instead of the city (same camera — the runner owns its pose). */
  renderer.render(BOOT.state === 'INTRO' ? INTRO.scene : scene, camera);
  /* M7.4: screen-space flash overlay — exactly one extra draw call
   * while the flash is alive, nothing at 0. */
  if (FX._flashPlane.visible) renderer.render(FX._flashScene, FX._flashCam);
  BOOT.frames++;
}

/* ------------------------------------------------------------------ *
 * Startup
 * ------------------------------------------------------------------ */
try {
  const startBtn = document.getElementById('startBtn');
  startBtn.addEventListener('click', () => {
    if (BOOT.state === 'INTRO') {            // M12: skip the intro
      startBtn.disabled = true;
      INTRO._toStreet();
      return;
    }
    if (BOOT.state !== 'LOADER') return;     // idempotent gate
    BOOT.enter('RUNNING');
    startBtn.disabled = true;
  });

  // Boot succeeded: renderer constructed, scene + camera attached,
  // overlay ready — clear the watchdog, refresh will re-run all of it.
  window.__SIM_BOOTED__ = true;
  if (window.__SIM_BOOT_DEADLINE__) clearTimeout(window.__SIM_BOOT_DEADLINE__);

  /* M12: the intro cinematic auto-plays (LOADER → INTRO → RUNNING).
   * No audio before a gesture: the corridor is silent; if the intro
   * ends on its own (no gesture), the AudioContext is created
   * suspended and the M11.1 resume path unlocks it on the first
   * gesture. The START click above skips it. */
  if (BOOT.state === 'LOADER') BOOT.enter('INTRO');
} catch (err) {
  BOOT.fail(
    'BOOT FAILURE — ' + (err && err.message ? err.message : 'unknown error') +
    '\nReload the page to retry.',
  );
}

const _simProject = new THREE.Vector3();

/* Dev / smoke-test handle (not part of the game). */
window.SIM = {
  BOOT,
  INPUT,
  CAMERA,
  INTRO,
  KIT,
  WORLD,
  POOL,
  ENTITY,
  TRAFFIC,
  PARTS,
  FX,
  ATMOS,
  TIER,
  AUDIO,
  HUD,
  CFG,
  renderer,
  scene,
  camera,
  systems,
  /* Dev/smoke: world→NDC projection (module-scoped THREE is not a
   * page global) */
  project(x, y, z) {
    _simProject.set(x, y, z).project(camera);
    return { x: _simProject.x, y: _simProject.y, z: _simProject.z };
  },
};
</script>
</body>
</html>
