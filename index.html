<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>QWEN FLASH // AWAKENING</title>
<style>
  /* ---- M0: full-screen canvas, no scrollbars ---- */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #04060c;
  }
  canvas#gl {
    display: block;
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    outline: none;
  }
  .ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
    font-family: ui-monospace, "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    color: #9fdcff;
    z-index: 10;
  }
  /* ---- FPS / status HUD (top-left, small) ---- */
  #hud {
    position: absolute;
    top: 10px;
    left: 10px;
    font-size: 12px;
    line-height: 1.5;
    color: rgba(159, 220, 255, 0.85);
    text-shadow: 0 0 6px rgba(0, 180, 255, 0.35);
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  #hud.on { opacity: 1; }
  /* ---- M1: control hints (bottom-left, small) ---- */
  #hint {
    position: absolute;
    left: 10px;
    bottom: 10px;
    font-size: 11px;
    line-height: 1.45;
    color: rgba(150, 200, 240, 0.5);
    white-space: pre;
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  #hint.on { opacity: 1; }
  /* ---- M9.6: awaken button (bottom-right, HUD entry point) ---- */
  #awakeBtn {
    position: absolute;
    right: 10px;
    bottom: 10px;
    pointer-events: auto;
    padding: 8px 16px;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-indent: 0.2em;
    color: #bff2ff;
    background: rgba(0, 40, 70, 0.35);
    border: 1px solid rgba(110, 210, 255, 0.45);
    border-radius: 2px;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.4s ease, background 0.2s ease,
      box-shadow 0.2s ease;
  }
  #awakeBtn.on { opacity: 1; }
  #awakeBtn:hover {
    background: rgba(0, 70, 110, 0.45);
    box-shadow: 0 0 18px rgba(0, 190, 255, 0.4);
  }
  /* ---- Boot overlay: title + START button (audio unlock gate) ---- */
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    background: radial-gradient(ellipse at 50% 45%, rgba(8, 16, 30, 0.92) 0%, rgba(3, 5, 10, 0.97) 70%);
    pointer-events: auto;
    transition: opacity 0.5s ease;
  }
  #overlay.hide { opacity: 0; pointer-events: none; }
  /* M12: intro mode — the cinematic plays on a clean canvas; the
     * title/subtitle drop away and the START button stays as the
     * skip affordance (M12.3: visible-delay + fade) */
  #overlay.intro {
    background: none;
    pointer-events: none;
  }
  #overlay.intro .title,
  #overlay.intro .subtitle { display: none; }
  #overlay.intro #startBtn {
    position: absolute;
    bottom: 7vh;
    left: 50%;
    transform: translateX(-50%);
  }
  #overlay .title {
    font-size: 15px;
    letter-spacing: 0.42em;
    color: #6fc7ff;
    text-shadow: 0 0 18px rgba(0, 190, 255, 0.6);
    text-indent: 0.42em;
  }
  #overlay .subtitle {
    font-size: 11px;
    letter-spacing: 0.3em;
    color: rgba(150, 200, 240, 0.55);
  }
  #startBtn {
    pointer-events: auto;
    margin-top: 8px;
    padding: 14px 42px;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 0.25em;
    text-indent: 0.25em;
    color: #bff2ff;
    background: rgba(0, 40, 70, 0.35);
    border: 1px solid rgba(110, 210, 255, 0.55);
    border-radius: 2px;
    cursor: pointer;
    box-shadow: 0 0 24px rgba(0, 170, 255, 0.25), inset 0 0 18px rgba(0, 170, 255, 0.12);
    transition: background 0.2s ease, box-shadow 0.2s ease;
  }
  #startBtn:hover {
    background: rgba(0, 70, 110, 0.45);
    box-shadow: 0 0 34px rgba(0, 190, 255, 0.45), inset 0 0 22px rgba(0, 170, 255, 0.2);
  }
  #startBtn:disabled { cursor: default; opacity: 0.4; }
  /* ---- Boot failure / watchdog message ---- */
  #bootError {
    position: absolute;
    inset: auto auto 26px 50%;
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 0.15em;
    color: #ffb27a;
    background: rgba(30, 12, 4, 0.7);
    border: 1px solid rgba(255, 140, 60, 0.4);
    border-radius: 2px;
    padding: 10px 16px;
    text-align: center;
    white-space: pre-line;
    display: none;
  }
  #bootError.show { display: block; }
</style>
<!--
  Boot watchdog (classic script, runs before the module):
  if the Three.js CDN import or renderer creation never completes within
  15 s, surface a visible message instead of leaving the page stuck.
-->
<script>
(function () {
  window.__SIM_BOOT_DEADLINE__ = setTimeout(function () {
    if (!window.__SIM_BOOTED__) {
      var el = document.getElementById('bootError');
      if (el) {
        el.textContent =
          'BOOT STALL — still waiting for the 3D engine (Three.js via CDN).\n' +
          'Check your network connection and reload the page.';
        el.classList.add('show');
      }
    }
  }, 15000);
})();
</script>

<script type="module">
/* =====================================================================
 * QWEN FLASH // AWAKENING — single-file voxel datacenter-city demo
 * ---------------------------------------------------------------------
 * Ground rules (see PLAN.md):
 *  - one file, Three.js via CDN is the only external dependency
 *  - no references before init; subsystems register into one `systems`
 *    registry and boot/update in a fixed order
 *  - everything animated is driven by the central update(dt, t) loop;
 *    subsystems implement { init, update, onQuality?, onAwaken?, dispose? }
 * ===================================================================== */
import * as THREE from 'three';

/* ------------------------------------------------------------------ *
 * CFG — tunables live here (quality tiers land in M14)
 * ------------------------------------------------------------------ */
const CFG = {
  maxPixelRatio: 2,
  bootWatchdogMs: 15000,
  color: {
    void: 0x05070d,        // M0/M1 empty-void background
    fog: 0x060a14,        // initial haze (ATMOS re-tints it per zone, M8.2)
  },
  input: {
    lookSens: 0.0022,          // radians per mouse pixel
    groundSpeed: 16,           // m/s, exploration mode
    groundSprint: 38,
    cineSpeed: 30,             // m/s, free-fly mode
    cineSprint: 70,
    groundMinY: 0.7,           // ground/exploration height clamp (collision-lite)
    groundMaxY: 40,
    fovMin: 30,
    fovMax: 95,
    fovZoomRate: 1.1,          // fov degrees per wheel notch
    padLookGain: 900,          // pseudo-px/s equivalent for gamepad look stick
    padZoomRate: 42,           // fov degrees/s per trigger unit
    padDeadzone: 0.12,
    accel: 12,                // velocity smoothing rate (1/s)
    modeBlendTime: 0.55,      // s, lerp between camera modes
    orbitRadius: 22,          // m, middle-mouse orbit radius
    orbitRadiusMin: 5,
    orbitRadiusMax: 70,
    orbitSens: 0.0032,        // radians per px while orbiting
    orbitElevMin: -Math.PI * 0.45,
    orbitElevMax: Math.PI * 0.45,
    pitchClamp: { ground: Math.PI * 0.47, cine: Math.PI * 0.485 },
    shakeDecay: 2.4,          // energy/s
    shakeAmp: 0.22,           // metres (energy 1.0 ≈ strong hit)
    shakeCap: 1.5,            // max energy — repeated triggers never accumulate past this
    shakeImpulse: 1.0,       // energy added by the manual dev trigger (Key N)
  },
  lights: {
    hemiSky: 0x35507e,
    hemiGround: 0x0b0f18,
    hemiIntensity: 0.5,
    moonColor: 0x9fc4ff,
    moonIntensity: 0.6,
    moonPos: [-70, 110, -40], // single key "moon / anti-sun" directional
    heroPointDist: 120,      // reserved point lights: hero moments only
    heroPointDecay: 2,
  },
  kit: {
    testTower: { x: 0, z: -80 },  // M2 gate demo (absorbed by the M3 city: keep-out area)
    ledHz: 15,                   // LED canvas redraw rate
    signHz: 8,                  // holo-sign flicker redraw rate
    signTagCycle: 8,            // s per UNSLOTH tagline
    /* M10.1: the unsloth monument — voxel neon sloth atop one side-avenue
     * compute tower + rooftop UNSLOTH holo sign (shared unsloth texture) */
    slothMonument: { neon: 0xff6fb2, minH: 30 },
    /* M10.2: the relaxed holo-sloth hologram — a billboard canvas sprite
     * (additive) hanging on the tower's antenna arm, slow breathing. */
    slothHolo: {
      color: 0xffb3d9,      // soft pink holo glow
      scale: 3.4,           // sprite width (m); height = scale * 176/140
      breath: 1.0,          // rad/s — slow breathing
      breathAmp: 0.05,     // breathing scale amplitude
    },
    /* M10.2: sloth-themed maintenance drones — bigger, soft pink, extra
     * slow — patrolling the monument's street only (one avenue line). */
    slothDrone: {
      count: 2,             // 1–2 sloth drones
      color: 0xff9ecb,      // soft pink tint
      size: 3.0,            // bigger than city drones (2.0)
      speed: 2.2,           // extra slow (city: 7–13 m/s)
      altitude: 30,         // street-patrol altitude (m)
      span: 70,             // patrol half-span along the street (m)
      bobAmp: 0.5,          // hover bob (m)
      bob: 0.9,             // rad/s — slow hover bob
    },
    /* M10.3: the awakening reaction — the sign flares, the holo
     * brightens + plays one slow stretch, the sloth drones rise to
     * hover nearby for the pulse, then resume patrolling. Subtle by
     * design: it plays at the monument (outside the default
     * intro-reveal framing — M10.1) with modest amplitudes, so it
     * never competes with the creature (~5 % of attention). */
    slothEgg: {
      ramp: 1.2,           // s — reaction eases in on 'start' (AWAKE)
      settle: 2.0,         // s — reaction eases back on 'end' (DORMANT)
      stretchDur: 2.2,     // s — the one slow stretch (holo)
      stretchAmp: 0.22,   // vertical stretch amplitude
      holoBoost: 1.25,    // holo brightness × (1 + holoBoost·lvl)
      signBoost: 1.6,     // sign/neon flare × (1 + signBoost·lvl)
      hoverAlt: 15,       // m above hTop — hover altitude (above the holo)
      hoverOff: 3.5,      // m — per-drone stagger along the street
    },
  },
  city: {
    block: 24,                  // metres per block
    chunkBlocks: 16,            // chunk = 16×16 blocks (384 m)
    radius: 2,                  // Chebyshev chunk rings kept built (5×5 = 1920 m)
    seed: 0x51A7C3,             // deterministic city — identical every run/refresh
    plazaBlocks: 2,             // central plaza kept clear (M5 creature pedestal)
    occupancy: [0.92, 0.85, 0.78], // per-chunk budget: building density by LOD ring
    haze: 0x16273f,             // far-ring silhouette haze tint
    hazeAmount: 0.55,
    archetypes: {
      server:  { weights: { core: 5, mid: 4, outer: 1 }, tint: 0xbfd4f2, glow: true },
      rack:    { weights: { core: 2, mid: 3, outer: 2 }, tint: 0x9fb0d0 },
      cool:    { weights: { core: 1, mid: 2, outer: 2 }, tint: 0xaebcd6 },
      sub:     { weights: { core: 1, mid: 2, outer: 2 }, tint: 0x94a8c8 },
      antenna: { weights: { core: 1, mid: 1, outer: 2 }, tint: 0xa4b8d8 },
      fiber:   { weights: { core: 2, mid: 1, outer: 1 }, tint: 0x9fe8ff, glow: true },
      holo:    { weights: { core: 2, mid: 1, outer: 1 }, tint: 0xc4d8f8, glow: true },
      housing: { weights: { core: 1, mid: 2, outer: 4 }, tint: 0xc0b098 },
    },
  },
  detail: {
    /* M4 near layer: ring 0 = full pass (lvl 2), ring 1 = light pass (lvl 1),
     * ring 2 stays the M3 silhouette. Per-building variation is seeded from
     * the block seed (per-building salt ⇒ no duplicated neighbours). */
    ledPerChunk: 64,             // LED-window plane cap per chunk (fair 2-pass)
    dashPerChunk: 4,             // traveling light dashes per chunk (fiber spires)
    signPerChunk: 1,             // holo-sign billboards per chunk
    ledTexture: 0,               // 0 = ledA / 1 = ledB (picked per building)
  },

  /* ---- M5/M9: ENTITY — dormant creature animation (M9.1) ----
   * Idle: tensor-ring spin (per-ring ENTITY.ringSpin, M5), breathing
   * core scale (M5), antenna sway = small deterministic tilt on each
   * mast group. Dream wave: a periodic radial sweep across the compute
   * node grid — shader-less instance-color animation: per-node color =
   * hue × (base brightness + glow × front envelope); the dormant base
   * colors are restored byte-exact when the front exits. */
  entity: {
    antennaSway: {
      amp: 0.02,              // rad — max tilt (≈ 0.24 m tip sway on a 12 m mast)
      speed: 0.35,            // rad/s — slow sway
    },
    dream: {
      every: [14, 26],       // s between dream waves (seeded jitter)
      first: 8,              // s after boot until the first wave
      speed: 16,             // m/s wavefront
      width: 5,              // m — Gaussian front σ
      glow: 0.4,             // absolute brightness added at the front peak
      origin: [0, 44, 0],   // wave centre (creature head level)
    },
    /* M9.2: wake state machine — DORMANT → STIR → AWAKE → DECAY →
     * DORMANT, per-state hooks, pose driven by the state level. */
    wake: {
      stir: 2,              // s: STIR → AWAKE (head lift, jaw, rings up)
      awake: [10, 20],     // s: AWAKE hold (seeded jitter)
      decay: 3,            // s: DECAY → DORMANT
      headLift: 0.10,      // rad — head up-tilt at full wake
      headRise: 0.8,       // m — head position lift at full wake
      jawOpen: 0.22,       // rad — jaw drop at full wake
      ringBoost: 8,        // ring speed multiplier at full wake
    },
    /* M9.6: triggers — manual (F key / HUD button) + one-shot auto for
     * the audience that presses nothing. */
    trigger: {
      auto: 30,              // s after intro end (BOOT.t0) until auto-awaken
    },
    /* M9.3: awakening beats 1–3 (creature-level power). Beat 1 ramps
     * with wakeP over STIR and fires its flash at the STIR→AWAKE peak;
     * beat 2's ignite wave starts at AWAKE entry; beat 3 surges
     * `delay` s into AWAKE. Everything restores EXACTLY at DORMANT
     * entry (wakeP/surgeP ⇒ 0). */
    beats: {
      flare: {             // beat 1: core-eye flare (emissive + light)
        color: 0xd9f6ff,  // full-flare coreEye color
        eye: 0.85,         // lerp amount toward the flare color (× wakeP)
        hero: 6,           // extra hero-light intensity at full flare
        flash: 1,          // FX.flash level fired at the STIR→AWAKE peak
      },
      ignite: {            // beat 2: node voxels ignite in radial waves
        speed: 35,         // m/s wavefront (head level outward)
        width: 6,          // m — ignition front width
        bright: 0.9,       // lit node brightness (absolute, × hue)
        front: 0.35,       // extra brightness at the hot front
      },
      surge: {             // beat 3: rings tilt + limbs reposition
        delay: 1.0,        // s after AWAKE entry before the surge
        ramp: 1.2,         // s ramp-in (and DECAY ramp-out rate)
        ringTilt: 0.16,    // rad — ring tilt at full surge
        armLift: 0.55,     // rad — arm outward lift at full surge
        shake: 1.2,        // CAMERA.shake impulse at surge start
      },
      /* M9.4: awakening beats 4–5 (city-level cascade). Beat 4 fires
       * `pulse.delay` s into AWAKE: the plaza pulse ring + the city
       * LED/sign wave; beat 5 (`traffic.delay`) fires the traffic
       * cascade (arcs, steam, drones, vehicles). Everything restores
       * EXACTLY at DORMANT entry (colors 1.0, roles cleared, the
       * plaza pulse dropped even mid-life). */
      cascade: {
        pulse: {            // beat 4: energy pulse ring from the plaza
          delay: 2.2,       // s after AWAKE entry
          radius: 660,      // m — target radius of the expanding ring
          life: 4.0,        // s — ring life
          color: 0x66e0ff, // tint (data-cyan)
        },
        wave: {             // beat 4: city holo-signs + building LEDs
          speed: 165,       // m/s wavefront (the pulse ring's travel)
          width: 26,        // m — front width (attack)
          hold: 1.2,        // s — lit hold after the front passes
          release: 1.6,     // s — dim-out after the hold
          bright: 2.4,     // peak instance-color multiplier (1.0 = idle)
        },
        traffic: {          // beat 5: substation arcs + steam + traffic
          delay: 3.2,       // s after AWAKE entry
          arcs: 3,          // substation bolts (staggered)
          arcStagger: 0.45, // s between bolts
          steam: 12,        // steam puffs burst from cooling towers
          scatter: 0.55,    // share of drones that scatter outward
          escort: 0.25,     // share that re-route to the creature
          scatterDist: [30, 60],  // m outward from the plaza
          scatterUp: [10, 25],    // m rise
          escortR: [45, 75],      // m hover ring around the plaza
          escortAlt: [30, 55],    // m hover altitude
          escortHold: 5,          // s hover before returning to the dock
          avoidDur: 4,           // s vehicle avoidance offset duration
          avoidRamp: 0.5,       // s ease in/out
          avoidLat: [8, 20],    // m lateral offset away from the plaza
          avoidAlt: [5, 12],    // m altitude bump
        },
      },
      /* M9.5: awakening beats 6–7 (egg reaction + decay). Beat 6 fires
       * `egg.delay` s into AWAKE: the Unsloth easter-egg reaction hook
       * (M10.3 registers its reaction via ENTITY.eggReact — nothing is
       * visible until M10 lands). Beat 7: during DECAY the ignited node
       * grid dims outward (front from head level; it passes the farthest
       * node + ignite width at `decayDim.at` fraction of DECAY ⇒ the
       * DORMANT-entry restore is pop-free), and one final pulse fires at
       * DORMANT entry. (The "hum settles" audio is M11.3 — no audio
       * system exists yet; the DECAY/DORMANT state entry hooks are the
       * seam.) */
      egg: {
        delay: 4.2,             // s after AWAKE entry (beat 6)
      },
      decayDim: {
        at: 0.85,               // fraction of DECAY where the dim front
                                // has passed the farthest node + width
      },
      finalPulse: {            // beat 7: one final pulse at DORMANT entry
        radius: 820,            // m (≠ cascade.pulse.radius ⇒ distinct
                                // signature for the teardown drop check)
        life: 5.0,              // s
        color: 0x9fdcff,        // tint (soft white-cyan — the settle)
      },
    },
  },

  /* ---- M6.2: traffic — drones & sky vehicles (M6.2 drones, M6.3
   * sky vehicles: same cap/pool pattern) ----
   * Drones dock on tower rooftops (the M3 building seeds are replayed
   * for placement — see WORLD.buildingAt) and patrol between towers at
   * roof level. One shared InstancedMesh for every drone (one draw
   * call); state lives in the M6.1 pool. */
  traffic: {
    drone: {
      tiers: { high: 16, med: 10, low: 5 },  // per-TIER.active() caps
      spawnInterval: 0.5,                    // s between spawn attempts
      radius: 260,                           // dock search radius (metres)
      innerRadius: 26,                       // keep clear of the player
      releaseFactor: 1.15,                   // release past radius*factor
      minH: 10,                              // min roof height for a dock
      dockArchetypes: ['server', 'cool', 'fiber', 'holo', 'housing'],
      cruise: 6,                             // cruise altitude above roof
      speed: [7, 13],                        // m/s patrol speed range
      dockHover: 7,                         // hover gap above the roof top
                                            // (clears crowns / M4 roof signs)
      dockTime: [3, 9],                      // s at the dock before leaving
      size: 2.0,                             // overall drone scale (m-ish)
    },
    /* M6.3: sky vehicles — light-trail streaks on the ring roads at
     * 3 altitudes, same cap/pool pattern as the drones. */
    vehicle: {
      tiers: { high: 12, med: 7, low: 3 },  // per-TIER.active() caps
      spawnInterval: 0.6,                   // s between spawn attempts
      radius: 300,                          // hold radius around the player
      releaseFactor: 1.25,                  // release past radius*factor
      altitudes: [70, 95, 120],             // the 3 ring-road lanes (m)
      speed: [26, 44],                      // m/s
      size: 1.6,                            // hull scale (m-ish)
      trailLen: [10, 16],                  // streak length (m)
      trailW: 1.1,                         // streak width / height (m)
    },
  },

  /* ---- M7.1: particle system — one system, one budget ----
   * Every particle in the demo (steam, sparks, pulse motes, lightning
   * motes, awakening rain) is an item of a PARTS pool. The one budget
   * is `tiers` (total live particles per tier = the exact sum of the
   * per-type tier caps below). Ambient: steam + sparks (the M6.4
   * emitters, moved here from TRAFFIC). Event-driven (0 live at idle):
   * pulse (M13.2 data pulse), light (M8.4 distant lightning), rain
   * (M9 awakening). Dev trigger: Key P rains all five types
   * (PARTS.rainAll). */
  parts: {
    tiers: { high: 280, med: 160, low: 72 },   // one shared budget (total)
    /* steam vents — billboard sprite pool on cooling towers (M6.4) */
    steam: {
      tiers: { high: 48, med: 28, low: 12 },  // per-TIER.active() caps
      spawnInterval: 0.12,                  // s between puff spawns
      radius: 200,                          // source search radius (metres)
      innerRadius: 20,                      // keep clear of the player
      releaseFactor: 1.25,                  // release past radius*factor
      life: [5, 8],                         // s per puff
      rise: [2.2, 3.2],                    // m/s upward drift
      size: [2.2, 3.8],                    // billboard size (m) at birth
      grow: 1.6,                           // size multiplier over life
    },
    /* sparks — tiny additive points on substations (brief life) (M6.4) */
    spark: {
      tiers: { high: 64, med: 36, low: 18 },  // per-TIER.active() caps
      spawnInterval: 0.3,                   // s between spark bursts
      radius: 170,                          // source search radius (metres)
      innerRadius: 16,                      // keep clear of the player
      releaseFactor: 1.25,                  // release past radius*factor
      life: [0.35, 0.9],                   // s per spark (brief)
      speed: [1.5, 4],                    // m/s sideways kick
      burst: [1, 3],                     // sparks per burst
      gravity: 3.2,                      // m/s² downward pull
    },
    /* pulse motes — slow-rising cyan motes (event-driven: M13.2 data
     * pulse + dev trigger; 0 live at idle) */
    pulse: {
      tiers: { high: 48, med: 24, low: 12 },  // per-TIER.active() caps
      trickle: 0.18,                      // s between motes while raining
      radius: 90,                         // spawn annulus outer (metres)
      innerRadius: 30,                    // keep clear of the player
      releaseFactor: 1.25,                // release past radius*factor
      life: [4, 7],                       // s per mote
      rise: [0.7, 1.4],                  // m/s upward drift
    },
    /* lightning motes — fast-falling white motes (event-driven: M8.4

    light: {

    rain: {

  /* ---- M7.2: FX — pulse (arcs M7.3, flash M7.4, shake M7.5) ----

  fx: {

    arcs: {

    flash: {

  /* ---- M8.1: ATMOS — night sky (gradient dome + stars + aurora) ----

  atmos: {

    },

    aurora: {

      spin: 0.012,           // rad/s — slow drift
    },

    /* ---- M8.2: fog depth tune + zone-tinted haze ----
     * density: tuned down from 0.004 — at 500 m the FogExp2 factor is
     *   ≈ 0.86, so distant structures survive as readable silhouettes
     *   (the old 0.004 swallowed 98 % at 500 m: the void took over).
     * zone: the haze color lerps (smoothstep) by camera distance from

    fog: {

      core: 0x081726,                    // cyan haze (core)

     * visible when the camera is near (radius / coreRadius) or during

    shaft: {
      radius: 130,             // m — spire shafts activate near the camera
      coreRadius: 170,        // m — creature core shaft activates near plaza
      refresh: 2,             // s — nearby spire scan cadence

      len: 90,                // m — spire shaft length (scaled to short spires)
      rTop: 0.4,              // m — radius at the tip (the light source)

      opacity: 0.18,          // base additive opacity (faint volumetric haze)
      coreLen: 120,           // m — creature core shaft length

     * meshes hidden). */
    lightning: {
      every: [16, 32],         // s between auto events (seeded random)
      firstDelay: 10,         // s after boot until the first auto event
      dist: [700, 1400],       // m — far point distance from the plaza
      altitude: [220, 380],    // m — strike altitude
      flash: 0.5,              // FX.flash level (screen flash)
      flashColor: 0xdcebff,   // pale blue-white tint
      hemiBoost: 2.0,         // added to CFG.lights.hemiIntensity
      hemiDecay: 3.0,         // 1/s — brief (τ ≈ 0.33 s)
      ring: { radius: 950, life: 2.6, y: 0.6, color: 0x9fd4ff },
      /* the annulus is 0.6→1.0 of the radius (0.4 R wide): a wide
       * shockwave band, not a hairline — readable from above at
       * distance, and it sweeps the whole city */
      motes: 16,               // lightning motes per event (PARTS pool)
      flashSize: 120,          // m — point flash billboard size
      flashDur: 0.5,           // s — point flash lifetime (flicker)
    },
  },

  /* ---- M11.2: looping beds (all connect to AUDIO.master — M11.1) ----
   * Three always-on beds that make the city read as "machine city":
   * reactor hum (2 detuned sines + sub sine, slow swell), fans
   * (looped filtered noise, band-pass sweep), distant machinery (looped

   * from the central update loop (AUDIO.update) as deterministic
   * sinusoids. Levels are bed gains on the
   * master bus (0.8) before the compressor. Looped buffers are long
   * enough (≥ 4 s) that no repeat is audible; nothing here allocates
   * per frame (thumps are random events, not per-frame work). */
  audio: {
    hum: {
      gain: 0.22,              // bed level on the master bus
      f1: 55,                  // Hz — detuned sine 1 (A1)
      f2: 55.66,               // Hz — detuned sine 2 (slow beat with f1)
      sub: 27.5,               // Hz — sub sine (A0)
      subGain: 0.5,            // sub level relative to the hum bed gain
      lfo: 0.07,               // Hz — slow swell rate on the bed gain
      lfoDepth: 0.25,          // 0..1 — swell depth
    },
    fan: {
      gain: 0.16,
      noiseSec: 4,             // s — looped noise buffer (no audible repeat)
      band: { f: 1310, q: 1.4 },   // band-pass center (sweep midpoint) + Q
      sweep: { range: [420, 2200], speed: 0.05 },  // Hz — LFO sweep
    },
    machine: {
      gain: 0.10,
      noiseSec: 6,
      lowpass: 300,            // Hz — muffled distant machinery
      thump: {
        every: [5, 14],        // s between random low thumps
        f: [34, 62],           // Hz — thump pitch (drops to 55 % over decay)
        dur: [0.5, 1.1],       // s — thump decay length
        gain: 1.2,             // thump level relative to the machine bed gain
      },
    },

    /* ---- M11.3: event sounds — fire-and-forget one-shots fired from
     * the M6–M9 emitter call sites into AUDIO.master (the M11.1 choke
     * point ⇒ the M key mutes them at zero cost). Nothing here runs
     * per frame — each one-shot stops its own sources and is
     * collected. Levels are on the master bus (0.8) before the
     * compressor, relative to the beds. */
    events: {
      pulse: {                // FX.pulse — "thump"
        gain: 0.50,           // thump level on the master bus
        f: [130, 38],         // Hz — sine pitch drop (exponential)
        dur: 0.6,             // s — thump decay length
        hit: 0.5,             // noise-hit level relative to the thump gain
        hitDur: 0.25,         // s — noise-hit length
        hitFilter: 420,      // Hz — low-pass on the noise hit
      },
      arc: {                 // FX.arc — crackle
        gain: 0.16,
        dur: 0.5,             // s — crackle span
        bursts: 5,            // sharp on/off noise bursts over the span
        band: 2400,           // Hz — band-pass center
        q: 0.8,
      },
      steam: {               // PARTS._spawnSteam — hiss
        gain: 0.05,
        dur: 1.2,             // s — hiss decay length
        band: 3200,           // Hz — band-pass center (air, not rumble)
        q: 0.7,
      },
      drone: {               // TRAFFIC._spawn — whir
        gain: 0.07,
        dur: 0.7,             // s — whir length
        band: [700, 1800],   // Hz — band-pass center rise (rotor spin-up)
        q: 1.2,
      },
    },

    /* ---- M11.4: spatial-ish mixing — a small pool of panner +
     * distance-gain channels for the few NEAREST emitters; everything
     * the pool cannot hold folds into the ambient master (no spatial
     * treatment). The listener is driven from CAMERA every frame
     * (position + look direction) — the only per-frame cost; each
     * channel holds its panner for reuse, so a fire allocates only
     * the one-shot itself. */
    spatial: {
      channels: 3,           // spatially-processed emitters (2–3)
      refDistance: 6,        // m — full level inside this radius
      rolloff: 1.0,          // inverse-model decay beyond refDistance
      minGain: 0.02,         // floor — distant emitters never vanish
      settle: 0.3,           // s — channel held a bit past its one-shot
    },
  },

  /* ---- M12: intro cinematic — beat 1 is a dark server corridor:
   * a near-black instanced tunnel of LED strips with a camera dolly
   * on the INTRO timeline runner. No async resources: the tunnel is
   * built synchronously at init. */
  intro: {
    corridor: {
      len: 120,            // m — tunnel length (axis -Z, centred 0)
      width: 10, height: 6, // m — tunnel cross-section
      bg: 0x010208,        // near-black (scene bg + fog colour)
      fogDensity: 0.022,   // the far end barely reads
      rackGap: 5,          // m between rack pairs (both walls)
      dashLines: 4,        // LED strip lines (2 per wall)
      dashesPerLine: 24,   // flowing dashes per line
      dashSpeed: 26,       // m/s — data flow along -Z
      dashSize: [0.25, 0.15, 1.4], // m — one dash box
      eyeY: 2.5,           // m — dolly eye height
    },
    beat1: { dur: 4.4 },  // s — corridor dolly length
    street: { pos: [0, 4, 18], look: [0, 2, 0] }, // M0 spawn handoff
  },

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const damp = (dt, rate) => 1 - Math.exp(-rate * dt);

/* ====================================================================
 * TIER — active LOD / detail tier (M6.2 seam, auto-detect is M14.1)
 *
 *  - TRAFFIC reads CFG.traffic.drone.tiers[TIER.name] every frame, so a
 *    tier change trims / grows the drone fleet smoothly (excess drones
 *    are released back to the pool, the fleet regrows on spawn ticks)
 *  - M14.1 replaces TIER.set with FPS-based auto-detection; nothing
 *    downstream needs to change for that
 * ==================================================================== */
const TIER = {
  order: ['low', 'med', 'high'],
  name: 'high',
  set(n) {
    if (TIER.order.includes(n)) TIER.name = n;
  },
  active() { return TIER.name; },
};

/* ------------------------------------------------------------------ *
 * BOOT — deterministic state machine: LOADER → INTRO → RUNNING (→ ERROR)
 * - guards against double-start
 * - the START click is the user gesture that unlocks audio (M11 beds
 *   attach to the same unlock in a later milestone); during the M12
 *   intro it is the skip affordance (INTRO → street camera → RUNNING)
 * ------------------------------------------------------------------ */
const BOOT = {
  state: 'LOADER',          // LOADER | INTRO | RUNNING | ERROR
  started: false,
  frames: 0,
  t0: 0,                    // s: RUNNING entry time — intro-end anchor (M9.6)
  looping: false,

  /* the rAF loop starts at the first state that renders (INTRO or,
   * without an intro, RUNNING) — never twice. */
  _startLoop() {
    if (BOOT.looping) return;
    BOOT.looping = true;
    lastNow = performance.now();
    requestAnimationFrame(frame);          // one and only one loop
  },

  enter(next) {
    if (BOOT.started && next === 'RUNNING') return;   // no double-init
    BOOT.state = next;
    if (next === 'INTRO') {
      /* M12: the cinematic auto-plays — no audio (no gesture yet); the
       * corridor scene renders instead of the city until skip/end. */
      document.getElementById('overlay').classList.add('intro');
      BOOT._startLoop();
      INTRO.play(INTRO._beat1(), INTRO._toStreet);
    }
    if (next === 'RUNNING') {
      BOOT.started = true;
      BOOT.t0 = performance.now() / 1000; // M9.6: intro-end anchor
      AUDIO.unlock();                       // audio gate (user gesture)
      document.getElementById('overlay').classList.add('hide');
      document.getElementById('hud').classList.add('on');
      document.getElementById('hint').classList.add('on');
      document.getElementById('awakeBtn').classList.add('on');
      BOOT._startLoop();
    }
  },

  fail(msg) {
    if (BOOT.state === 'ERROR') return;
    BOOT.state = 'ERROR';
    const el = document.getElementById('bootError');
    if (el) {
      el.textContent = msg;
      el.classList.add('show');
    }
  },
};

/* ------------------------------------------------------------------ *
 * AUDIO — Web Audio master graph (M11.1).
 *
 * Graph:  master (bus gain) → compressor → muteGain → destination
 *   - master:   one bus — M11.2 beds and M11.3 event sounds connect
 *               here, so everything the game makes flows through the
 *               same two choke points below.
 *   - comp:     a DynamicsCompressor glues the whole mix; one for the
 *               whole graph, never per-source.
 *   - muteGain: user mute (M key) — the LAST stage before destination,
 *               so muting silences everything at zero cost.
 *
 * Gesture gate: unlock() is only ever called from BOOT.enter('RUNNING')
 * on the START click — no AudioContext exists before that gesture
 * (no audio before gesture). Resume-safe: a context the browser
 * suspended (tab hidden/backgrounded) is resumed on the next gesture
 * or visibility; refresh / re-entry just rebuilds this module fresh
 * and hits the same path again.
 *
 * M11.2 looping beds (hum / fans / distant machinery) are built at
 * unlock and connect to `master` — never a second compressor or
 * destination path. Looped noise buffers + oscillators run forever;
 * the live parts are all in `update()` (a system in the fixed boot
 * order): the random low-thump scheduler + the slow deterministic
 * bed motion (hum swell, fan band-pass sweep).
 *
 * M11.3 event sounds (pulse thump / arc crackle / steam hiss / drone
 * whir) are fire-and-forget one-shots fired from the M6–M9 emitter
 * call sites into `master` — no per-frame work, self-stopping nodes.
 * ------------------------------------------------------------------ */
const AUDIO = {
  name: 'AUDIO',
  ctx: null,
  master: null,
  comp: null,
  muteGain: null,
  muted: false,
  wired: false,
  beds: null,                 // M11.2: { hum, fan, machine } sub-graphs
  events: { pulse: 0, arc: 0, steam: 0, drone: 0 },  // M11.3 fire counters
  eventsWired: { pulse: false, arc: false, steam: false, drone: false },
  _evNoise: null,             // M11.3: shared short noise buffer (one-shots)
  spatial: null,              // M11.4: channel pool (null = no panner here)
  spatialWired: false,        // M11.4: channel output → AUDIO.master
  spatialFolded: 0,           // M11.4: fires folded into the ambient master
  spatialLast: null,          // M11.4: last spatial assignment (smoke seam)
  _listener: null,            // M11.4: ctx.listener (pos/forward driven)
  _rng: null,
  _gestureWired: false,

  unlock() {
    if (AUDIO.ctx) {
      AUDIO._resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;                        // no WebAudio: silent, no crash
    try {
      AUDIO.ctx = new AC();
      AUDIO.master = AUDIO.ctx.createGain();
      AUDIO.master.gain.value = 0.8;
      AUDIO.comp = AUDIO.ctx.createDynamicsCompressor();
      AUDIO.muteGain = AUDIO.ctx.createGain();
      AUDIO.muteGain.gain.value = 1;
      /* connect() returns the destination node (spec) — capture the
       * wiring flag; the headless smoke build exposes no
       * inputs/outputs introspection on AudioNode. */
      const c1 = AUDIO.master.connect(AUDIO.comp);
      const c2 = AUDIO.comp.connect(AUDIO.muteGain);
      const c3 = AUDIO.muteGain.connect(AUDIO.ctx.destination);
      AUDIO.wired = c1 === AUDIO.comp && c2 === AUDIO.muteGain &&
        c3 === AUDIO.ctx.destination;
      AUDIO._startBeds();
      /* M11.3: shared short noise buffer for every noise one-shot
       * (pulse hit, arc crackle, steam hiss, drone whir) — one
       * buffer, looped where needed, so an event allocates only its
       * self-stopping one-shot nodes. */
      AUDIO._evNoise = AUDIO._noise(2);
      AUDIO._startSpatial();
    } catch (_) {
      AUDIO.ctx = null;
    }
    AUDIO._wireResume();
  },

  /* ---- M11.4: spatial-ish mixing — a small pool of panner +
   * distance-gain channels for the few nearest emitters. Each channel
   * = a GainNode (distance gain, set at fire time) → a PannerNode
   * (equalpower panning; distanceModel 'none' because the explicit
   * distance gain does the attenuation — its value is directly
   * observable, unlike PannerNode-internal attenuation). Channel
   * output → AUDIO.master (M11.1 choke point ⇒ the M key mutes
   * spatial events too). The listener (position + look direction)
   * is driven from CAMERA in update() — the only per-frame cost;
   * channels are reused, so a spatial fire allocates only the
   * one-shot itself. No PannerNode support ⇒ spatial stays null and
   * every fire folds into the ambient master. */
  _startSpatial() {
    if (AUDIO.spatial || !AUDIO.ctx) return;
    const ctx = AUDIO.ctx;
    if (typeof ctx.createPanner !== 'function') return;
    AUDIO._listener = ctx.listener || null;
    const C = CFG.audio.spatial;
    const chs = [];
    try {
      for (let i = 0; i < C.channels; i++) {
        const panner = ctx.createPanner();
        panner.panningModel = 'equalpower';
        panner.distanceModel = 'none';      // gain node does attenuation
        const g = ctx.createGain();
        g.gain.value = 1;
        g.connect(panner);
        if (panner.connect(AUDIO.master) === AUDIO.master) {
          AUDIO.spatialWired = true;
        }
        chs.push({ g, panner, free: true, x: 0, y: 0, z: 0, d: 0, until: 0 });
      }
      AUDIO.spatial = chs;
    } catch (_) {
      AUDIO.spatial = null;                 // master graph stays intact
    }
  },

  /* Position helper — modern AudioParams, legacy fallback. */
  _setPos(node, x, y, z) {
    if (node.positionX) {
      node.positionX.value = x;
      node.positionY.value = y;
      node.positionZ.value = z;
    } else if (node.setPosition) {
      node.setPosition(x, y, z);
    }
  },

  /* Route the next one-shot: pick a free channel (or steal the
   * farthest-held one when the new emitter is nearer — the pool
   * always keeps the 2–3 NEAREST emitters spatial); if the pool
   * cannot take it, fold into the ambient master (no spatial
   * treatment). Returns the channel gain node, or null = master. */
  _spatialSink(type, x, y, z, dur) {
    if (!AUDIO.spatial) { AUDIO.spatialFolded++; return null; }
    const C = CFG.audio.spatial;
    const P = CAMERA.pos;
    const dx = x - P.x, dy = y - P.y, dz = z - P.z;
    const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
    let ch = null;
    for (let i = 0; i < AUDIO.spatial.length; i++) {
      if (AUDIO.spatial[i].free) { ch = AUDIO.spatial[i]; break; }
    }
    if (!ch) {
      let worst = null, worstD = -1;
      for (let i = 0; i < AUDIO.spatial.length; i++) {
        const c = AUDIO.spatial[i];
        if (c.d > worstD) { worstD = c.d; worst = c; }
      }
      if (d >= worstD) { AUDIO.spatialFolded++; return null; }
      ch = worst;
    }
    /* distance gain — Web Audio inverse model, floored: full level
     * inside refDistance, then ref / (ref + rolloff · (d − ref)). */
    const dg = d <= C.refDistance
      ? 1
      : Math.max(C.minGain,
        C.refDistance / (C.refDistance + C.rolloff * (d - C.refDistance)));
    ch.free = false;
    ch.x = x; ch.y = y; ch.z = z; ch.d = d;
    ch.until = performance.now() / 1000 + dur + C.settle;
    ch.g.gain.value = dg;
    AUDIO._setPos(ch.panner, x, y, z);
    /* the channel output reaches master ⇒ this type IS wired */
    AUDIO.eventsWired[type] = true;
    let idx = 0;
    for (let i = 0; i < AUDIO.spatial.length; i++) {
      if (AUDIO.spatial[i] === ch) { idx = i; break; }
    }
    AUDIO.spatialLast = { type, x, y, z, d, gain: dg, ch: idx };
    return ch.g;
  },

  /* ---- M11.2: looping beds (reactor hum / fans / distant machinery)
   * Built once at unlock, run forever: looped noise buffers (long
   * enough that no repeat is audible) + oscillators. Every bed
   * connects to AUDIO.master (M11.1) — the compressor and the mute
   * gain are the only choke points, so the M key mutes the beds at
   * zero cost. A failed bed build never breaks the master graph. */
  _noise(sec) {
    const ctx = AUDIO.ctx;
    const buf = ctx.createBuffer(
      1, Math.max(1, Math.floor(ctx.sampleRate * sec)), ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  },

  _startBeds() {
    if (AUDIO.beds || !AUDIO.ctx) return;
    const ctx = AUDIO.ctx;
    const C = CFG.audio;
    const beds = {};
    try {
      /* reactor hum: 2 detuned sines (slow beat) + sub sine, slow LFO
       * swell on the bed gain. */
      const hum = {};
      hum.osc1 = ctx.createOscillator();
      hum.osc1.type = 'sine';
      hum.osc1.frequency.value = C.hum.f1;
      hum.osc2 = ctx.createOscillator();
      hum.osc2.type = 'sine';
      hum.osc2.frequency.value = C.hum.f2;
      hum.sub = ctx.createOscillator();
      hum.sub.type = 'sine';
      hum.sub.frequency.value = C.hum.sub;
      hum.subGain = ctx.createGain();
      hum.subGain.gain.value = C.hum.subGain;
      hum.gain = ctx.createGain();
      hum.gain.gain.value = C.hum.gain;
      hum.osc1.connect(hum.gain);
      hum.osc2.connect(hum.gain);
      hum.sub.connect(hum.subGain);
      hum.subGain.connect(hum.gain);
      hum.gain.connect(AUDIO.master);
      hum.osc1.start();
      hum.osc2.start();
      hum.sub.start();
      /* the slow swell on hum.gain is driven in update() — see below */
      beds.hum = hum;

      /* fans: looped noise through a band-pass whose center is swept
       * by a slow LFO (the air of a city of cooling fans). */
      const fan = {};
      fan.src = ctx.createBufferSource();
      fan.src.buffer = AUDIO._noise(C.fan.noiseSec);
      fan.src.loop = true;
      fan.filter = ctx.createBiquadFilter();
      fan.filter.type = 'bandpass';
      fan.filter.frequency.value = C.fan.band.f;
      fan.filter.Q.value = C.fan.band.q;
      fan.gain = ctx.createGain();
      fan.gain.gain.value = C.fan.gain;
      fan.src.connect(fan.filter);
      fan.filter.connect(fan.gain);
      fan.gain.connect(AUDIO.master);
      fan.src.start();
      /* the band-pass sweep is driven in update() — see below */
      beds.fan = fan;

      /* distant machinery: looped muffled noise + random low thumps
       * (scheduled in update — the only live part of the beds). */
      const machine = {};
      machine.src = ctx.createBufferSource();
      machine.src.buffer = AUDIO._noise(C.machine.noiseSec);
      machine.src.loop = true;
      machine.filter = ctx.createBiquadFilter();
      machine.filter.type = 'lowpass';
      machine.filter.frequency.value = C.machine.lowpass;
      machine.gain = ctx.createGain();
      machine.gain.gain.value = C.machine.gain;
      machine.src.connect(machine.filter);
      machine.filter.connect(machine.gain);
      machine.gain.connect(AUDIO.master);
      machine.src.start();
      machine.thumpCount = 0;
      machine.nextThumpAt =
        performance.now() / 1000 +
        C.machine.thump.every[0] +
        (AUDIO._rng = mulberry32(0x51A7C3))() *
        (C.machine.thump.every[1] - C.machine.thump.every[0]);
      beds.machine = machine;

      AUDIO.beds = beds;
    } catch (_) {
      AUDIO.beds = null;      // master graph stays intact
    }
  },

  /* One random low thump: sine with a pitch drop + exponential
   * decay, into the machine bed gain. Fire-and-forget — the
   * oscillator stops itself and is collected. */
  _thump() {
    if (!AUDIO.ctx || !AUDIO.beds) return;
    const ctx = AUDIO.ctx;
    const m = AUDIO.beds.machine;
    const C = CFG.audio.machine.thump;
    const t0 = ctx.currentTime + 0.01;
    const f0 = C.f[0] + AUDIO._rng() * (C.f[1] - C.f[0]);
    const dur = C.dur[0] + AUDIO._rng() * (C.dur[1] - C.dur[0]);
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(f0, t0);
    osc.frequency.exponentialRampToValueAtTime(f0 * 0.55, t0 + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(C.gain, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g);
    g.connect(m.gain);
    osc.start(t0);
    osc.stop(t0 + dur + 0.1);
    /* drop the one-shot from the graph when it ends so it is
     * collected (a node wired into the bed gain stays reachable
     * from the graph forever). */
    osc.onended = () => { g.disconnect(); };
    m.thumpCount++;
  },

  /* System update (fixed boot order, after ATMOS / before HUD):
   * the M11.4 listener drive + channel expiry, the random low-thump
   * scheduler + the slow bed motion (hum swell, fan band-pass sweep)
   * — driven from the central loop as deterministic sinusoids
   * (ground rule: everything animated is driven by update(dt, t);
   * and — unlike oscillator LFOs wired into AudioParams — the values
   * are directly observable). Everything else in the beds is
   * set-and-forget (looped buffers + oscillators): a handful of
   * param writes + the thump check per frame (bounded). */
  update(dt, t) {
    if (!AUDIO.ctx) return;
    /* M11.4: drive the listener from CAMERA — position + look
     * direction (the panner pans against this) — and release expired
     * channels. This is the whole per-frame cost of the spatial
     * pool: 9 param writes + 3 comparisons. */
    if (AUDIO._listener) {
      const L = AUDIO._listener;
      const P = CAMERA.pos;
      const cp = Math.cos(CAMERA.pitch), sp = Math.sin(CAMERA.pitch);
      const sy = Math.sin(CAMERA.yaw), cy = Math.cos(CAMERA.yaw);
      /* free-fly forward from yaw/pitch (same convention as
       * CAMERA.update: yaw=0 ⇒ −Z, pitch up ⇒ +Y) */
      const fx = -sy * cp, fy = sp, fz = -cy * cp;
      if (L.positionX) {
        L.positionX.value = P.x;
        L.positionY.value = P.y;
        L.positionZ.value = P.z;
        L.forwardX.value = fx;
        L.forwardY.value = fy;
        L.forwardZ.value = fz;
        L.upX.value = 0;
        L.upY.value = 1;
        L.upZ.value = 0;
      } else if (L.setPosition) {
        L.setPosition(P.x, P.y, P.z);
        L.setOrientation(fx, fy, fz, 0, 1, 0);
      }
    }
    if (AUDIO.spatial) {
      const now = performance.now() / 1000;
      for (let i = 0; i < AUDIO.spatial.length; i++) {
        const c = AUDIO.spatial[i];
        if (!c.free && now > c.until) c.free = true;
      }
    }
    if (!AUDIO.beds) return;
    const C = CFG.audio;
    const beds = AUDIO.beds;
    beds.hum.gain.gain.value =
      C.hum.gain * (1 + C.hum.lfoDepth *
        Math.sin(t * 2 * Math.PI * C.hum.lfo));
    const s = C.fan.sweep;
    beds.fan.filter.frequency.value =
      (s.range[0] + s.range[1]) / 2 +
      (s.range[1] - s.range[0]) / 2 *
      Math.sin(t * 2 * Math.PI * s.speed);
    const m = beds.machine;
    if (t < m.nextThumpAt) return;
    AUDIO._thump();
    const e = C.machine.thump.every;
    m.nextThumpAt = t + e[0] + AUDIO._rng() * (e[1] - e[0]);
  },

  /* ---- M11.3: event sounds — fire-and-forget one-shots fired from
   * the M6–M9 emitter call sites (FX.pulse / FX.arc /
   * PARTS._spawnSteam / TRAFFIC._spawn). Every one-shot connects to
   * AUDIO.master — the M11.1 choke point — so the M key mutes all of
   * them at zero cost and nothing here costs anything when idle:
   * no per-frame work (update() is untouched), each one-shot stops its
   * own sources and is collected. eventsWired is captured from
   * connect() return values (the headless smoke build exposes no
   * graph introspection); the counters serve the smoke harness. */
  _evGain(type, level, node) {
    const ctx = AUDIO.ctx;
    const g = ctx.createGain();
    g.gain.value = level;
    const to = node || AUDIO.master;     // channel gain (M11.4) or master
    if (to === AUDIO.master && g.connect(AUDIO.master) === AUDIO.master) {
      AUDIO.eventsWired[type] = true;
    } else {
      g.connect(to);
    }
    return g;
  },

  /* pulse thump: sine pitch drop + short low-passed noise hit
   * (FX.pulse — the M7.2 seam). pos: emitter {x,y,z} — routed through
   * the M11.4 spatial pool (panner + distance gain) or folded into
   * the ambient master. */
  pulseThump(pos) {
    if (!AUDIO.ctx) return;
    const ctx = AUDIO.ctx;
    const C = CFG.audio.events.pulse;
    const t0 = ctx.currentTime + 0.01;
    const sink = pos ? AUDIO._spatialSink('pulse', pos.x, pos.y, pos.z, C.dur) : null;
    const g = AUDIO._evGain('pulse', C.gain, sink);
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(C.f[0], t0);
    osc.frequency.exponentialRampToValueAtTime(C.f[1], t0 + C.dur);
    const og = ctx.createGain();
    og.gain.setValueAtTime(0.0001, t0);
    og.gain.exponentialRampToValueAtTime(1, t0 + 0.03);
    og.gain.exponentialRampToValueAtTime(0.0001, t0 + C.dur);
    osc.connect(og);
    og.connect(g);
    osc.start(t0);
    osc.stop(t0 + C.dur + 0.1);
    const src = ctx.createBufferSource();
    src.buffer = AUDIO._evNoise;
    src.loop = true;
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = C.hitFilter;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.0001, t0);
    ng.gain.exponentialRampToValueAtTime(C.hit, t0 + 0.015);
    ng.gain.exponentialRampToValueAtTime(0.0001, t0 + C.hitDur);
    src.connect(lp);
    lp.connect(ng);
    ng.connect(g);
    src.start(t0);
    src.stop(t0 + C.hitDur + 0.05);
    /* the last source (the oscillator) stops last — drop the whole
     * one-shot from the graph so it is collected (a node wired into
     * master stays reachable from the graph forever). */
    osc.onended = () => { g.disconnect(); };
    AUDIO.events.pulse++;
  },

  /* arc crackle: a few sharp band-passed noise bursts (FX.arc — the
   * M7.3 seam). pos: emitter {x,y,z} (see pulseThump). */
  arcCrackle(pos) {
    if (!AUDIO.ctx) return;
    const ctx = AUDIO.ctx;
    const C = CFG.audio.events.arc;
    const t0 = ctx.currentTime + 0.01;
    const sink = pos ? AUDIO._spatialSink('arc', pos.x, pos.y, pos.z, C.dur) : null;
    const g = AUDIO._evGain('arc', C.gain, sink);
    const src = ctx.createBufferSource();
    src.buffer = AUDIO._evNoise;
    src.loop = true;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = C.band;
    bp.Q.value = C.q;
    const eg = ctx.createGain();
    const gap = C.dur / C.bursts;
    eg.gain.setValueAtTime(0.0001, t0);
    for (let k = 0; k < C.bursts; k++) {
      const s = t0 + k * gap;
      eg.gain.setValueAtTime(1, s);
      eg.gain.setValueAtTime(0.0001, s + gap * 0.55);
    }
    src.connect(bp);
    bp.connect(eg);
    eg.connect(g);
    src.start(t0);
    src.stop(t0 + C.dur + 0.05);
    /* drop the one-shot from the graph when it ends (see pulseThump) */
    src.onended = () => { g.disconnect(); };
    AUDIO.events.arc++;
  },

  /* steam hiss: band-passed noise, fast attack, long decay
   * (PARTS._spawnSteam — one per puff). pos: emitter {x,y,z}
   * (see pulseThump). */
  steamHiss(pos) {
    if (!AUDIO.ctx) return;
    const ctx = AUDIO.ctx;
    const C = CFG.audio.events.steam;
    const t0 = ctx.currentTime + 0.01;
    const sink = pos ? AUDIO._spatialSink('steam', pos.x, pos.y, pos.z, C.dur) : null;
    const g = AUDIO._evGain('steam', C.gain, sink);
    const src = ctx.createBufferSource();
    src.buffer = AUDIO._evNoise;
    src.loop = true;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = C.band;
    bp.Q.value = C.q;
    const eg = ctx.createGain();
    eg.gain.setValueAtTime(0.0001, t0);
    eg.gain.exponentialRampToValueAtTime(1, t0 + 0.08);
    eg.gain.exponentialRampToValueAtTime(0.0001, t0 + C.dur);
    src.connect(bp);
    bp.connect(eg);
    eg.connect(g);
    src.start(t0);
    src.stop(t0 + C.dur + 0.05);
    /* drop the one-shot from the graph when it ends (see pulseThump) */
    src.onended = () => { g.disconnect(); };
    AUDIO.events.steam++;
  },

  /* drone whir: band-passed noise with a rising center sweep (rotor
   * spin-up) — TRAFFIC._spawn, one per drone launch. pos: emitter
   * {x,y,z} (see pulseThump). */
  droneWhir(pos) {
    if (!AUDIO.ctx) return;
    const ctx = AUDIO.ctx;
    const C = CFG.audio.events.drone;
    const t0 = ctx.currentTime + 0.01;
    const sink = pos ? AUDIO._spatialSink('drone', pos.x, pos.y, pos.z, C.dur) : null;
    const g = AUDIO._evGain('drone', C.gain, sink);
    const src = ctx.createBufferSource();
    src.buffer = AUDIO._evNoise;
    src.loop = true;
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.Q.value = C.q;
    bp.frequency.setValueAtTime(C.band[0], t0);
    bp.frequency.linearRampToValueAtTime(C.band[1], t0 + C.dur);
    const eg = ctx.createGain();
    eg.gain.setValueAtTime(0.0001, t0);
    eg.gain.exponentialRampToValueAtTime(1, t0 + 0.1);
    eg.gain.exponentialRampToValueAtTime(0.0001, t0 + C.dur);
    src.connect(bp);
    bp.connect(eg);
    eg.connect(g);
    src.start(t0);
    src.stop(t0 + C.dur + 0.05);
    /* drop the one-shot from the graph when it ends (see pulseThump) */
    src.onended = () => { g.disconnect(); };
    AUDIO.events.drone++;
  },

  setMuted(on) {
    AUDIO.muted = !!on;
    if (AUDIO.ctx && AUDIO.muteGain) {
      const t = AUDIO.ctx.currentTime;
      AUDIO.muteGain.gain.setTargetAtTime(AUDIO.muted ? 0 : 1, t, 0.02);
    }
  },

  toggleMute() { AUDIO.setMuted(!AUDIO.muted); },

  /* Resume a context the browser suspended (tab hidden/backgrounded).
   * It was created inside a user gesture (START click), so Chrome keeps
   * activation for resume(); if a gesture is still required the call
   * simply waits — never an error. */
  _resume() {
    if (AUDIO.ctx && AUDIO.ctx.state === 'suspended') {
      const p = AUDIO.ctx.resume();
      if (p && p.catch) p.catch(() => {});
    }
  },

  /* Cheap gesture hooks, wired once at unlock — zero cost before the
   * first gesture (nothing exists yet). */
  _wireResume() {
    if (AUDIO._gestureWired) return;
    AUDIO._gestureWired = true;
    window.addEventListener('pointerdown', () => AUDIO._resume());
    window.addEventListener('keydown', () => AUDIO._resume());
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) AUDIO._resume();
    });
  },
};

/* ------------------------------------------------------------------ *
 * Renderer / scene / camera (ACES tone mapping, sRGB output)
 * ------------------------------------------------------------------ */
const canvas = document.getElementById('gl');

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  powerPreference: 'high-performance',
});
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
/* M7.4: the frame may render a second (flash-overlay) scene — with the
 * default autoReset the 2nd render would zero the reported call count,
 * so reset once per frame and let the counts accumulate over both. */
renderer.info.autoReset = false;

const scene = new THREE.Scene();
scene.background = new THREE.Color(CFG.color.void);
scene.fog = new THREE.FogExp2(CFG.color.fog, CFG.atmos.fog.density);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  3000,
);
// M0 spawn — M1 hands ownership to the CAMERA system (pos synced in init).
camera.position.set(0, 4, 18);
camera.lookAt(0, 2, 0);

function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, CFG.maxPixelRatio));
  renderer.setSize(w, h, false);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);
onResize();

/* ==================================================================== *
 * INPUT — keyboard / mouse / pointer-lock / wheel / middle-mouse / gamepad
 *
 * Physical key codes (e.code), so WASD and AZERTY (ZQSD) map to the same
 * movement without layout sniffing. Intent state here is consumed by
 * CAMERA once per frame; INPUT never drives the camera itself.
 * --------------------------------------------------------------------- */
const INPUT = {
  name: 'INPUT',

  keys: new Set(),
  pointerLocked: false,
  orbitHeld: false,
  _lastMouse: null,
  _padModePrev: false,

  // consumed + cleared by CAMERA every frame:
  move: { f: 0, s: 0, u: 0 },   // forward / strafe / up, -1..1
  look: { x: 0, y: 0 },         // accumulated px (mouse) — px equiv (gamepad)
  zoom: 0,                     // accumulated wheel notches
  sprint: false,
  modeSwitch: false,           // V / gamepad A-button edge
  rainTrigger: false,         // P edge — dev trigger: rain all particles
  pulseTrigger: false,        // R edge — dev trigger: FX.pulse ahead
  arcTrigger: false,          // T edge — dev trigger: FX arcs (sub↔sub, creature→ring)
  flashTrigger: false,        // B edge — dev trigger: FX.flash (screen flash)
  shakeTrigger: false,        // N edge — dev trigger: CAMERA.shake impulse
  lightningTrigger: false,    // L edge — distant lightning event (M8.4)
  wakeTrigger: false,         // F edge — manual awaken trigger (M9.6)

  pad: {
    connected: false,
    move: { f: 0, s: 0, u: 0 },
    look: { x: 0, y: 0 },
    zoom: 0,
    btnA: false,
  },

  init() {
    /* --- keyboard (physical codes: WASD == AZERTY ZQSD) --- */
    window.addEventListener('keydown', e => {
      if (BOOT.state !== 'RUNNING') return;
      if (e.code === 'KeyV' && !e.repeat) INPUT.modeSwitch = true;
      if (e.code === 'KeyP' && !e.repeat) INPUT.rainTrigger = true;
      if (e.code === 'KeyR' && !e.repeat) INPUT.pulseTrigger = true;
      if (e.code === 'KeyT' && !e.repeat) INPUT.arcTrigger = true;
      if (e.code === 'KeyB' && !e.repeat) INPUT.flashTrigger = true;
      if (e.code === 'KeyN' && !e.repeat) INPUT.shakeTrigger = true;
      if (e.code === 'KeyL' && !e.repeat) INPUT.lightningTrigger = true;
      if (e.code === 'KeyF' && !e.repeat) INPUT.wakeTrigger = true;
      if (e.code === 'KeyM' && !e.repeat) AUDIO.toggleMute();   // M11.1
      INPUT.keys.add(e.code);
      if (e.code === 'Space') e.preventDefault();
    });
    window.addEventListener('keyup', e => INPUT.keys.delete(e.code));
    window.addEventListener('blur', () => {
      INPUT.keys.clear();          // never stick a key across focus loss
      INPUT.orbitHeld = false;
    });

    /* --- mouse look (pointer lock preferred; fallback deltas) --- */
    window.addEventListener('pointerlockchange', () => {
      INPUT.pointerLocked = document.pointerLockElement === canvas;
      if (!INPUT.pointerLocked) INPUT.orbitHeld = false;
      INPUT._lastMouse = null;
    });
    window.addEventListener('mousemove', e => {
      if (INPUT.pointerLocked) {
        INPUT.look.x += e.movementX;
        INPUT.look.y += e.movementY;
      } else if (INPUT.orbitHeld) {
        const last = INPUT._lastMouse;
        if (last) {
          INPUT.look.x += e.clientX - last.x;
          INPUT.look.y += e.clientY - last.y;
        }
        INPUT._lastMouse = { x: e.clientX, y: e.clientY };
      }
    });

    /* --- wheel: zoom (fov) --- */
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const notches = e.deltaMode === 1 ? 1 : e.deltaMode === 2 ? 40 : e.deltaY / 100;
      INPUT.zoom += notches;
    }, { passive: false });

    /* --- middle mouse: orbit (DOM button: 0=left, 1=middle, 2=right) --- */
    window.addEventListener('mousedown', e => {
      if (e.button === 1 && BOOT.state === 'RUNNING') {
        e.preventDefault();          // kill auto-scroll
        INPUT.orbitHeld = true;
        INPUT._lastMouse = { x: e.clientX, y: e.clientY };
      }
    });
    window.addEventListener('mouseup', e => {
      if (e.button === 1) INPUT.orbitHeld = false;
    });

    /* --- click canvas: (re)capture the mouse --- */
    canvas.addEventListener('click', () => {
      if (BOOT.state === 'RUNNING' && !INPUT.pointerLocked) {
        try {
          const p = canvas.requestPointerLock
            ? canvas.requestPointerLock()
            : null;
          if (p && p.catch) p.catch(() => {});   // headless/denied: fine
        } catch (_) { /* pointer lock unavailable: keep going */ }
      }
    });
  },

  /* Poll the (optional) gamepad. Never throws, no-op without one. */
  _pollPad() {
    const p = INPUT.pad;
    p.connected = false;
    p.zoom = 0;
    if (typeof navigator === 'undefined' || !navigator.getGamepads) return;
    let g = null;
    try {
      const pads = navigator.getGamepads();
      for (let i = 0; i < pads.length; i++) {
        const c = pads[i];
        if (c && c.connected !== false) { g = c; break; }
      }
    } catch (_) { g = null; }
    if (!g) return;
    p.connected = true;
    const dz = CFG.input.padDeadzone;
    const ax = i => {
      const v = g.axes && g.axes[i] !== undefined ? g.axes[i] : 0;
      if (Math.abs(v) < dz) return 0;
      return (v - Math.sign(v) * dz) / (1 - dz);
    };
    p.move.f = -ax(1);              // left stick up = forward
    p.move.s = ax(0);
    p.look.x = g.axes && g.axes[2] !== undefined ? g.axes[2] : 0;
    p.look.y = g.axes && g.axes[3] !== undefined ? g.axes[3] : 0;
    const lt = g.buttons && g.buttons[6] ? g.buttons[6].value : 0;
    const rt = g.buttons && g.buttons[7] ? g.buttons[7].value : 0;
    p.zoom = rt - lt;               // triggers: R-in / L-out (consumed *dt)
    p.btnA = !!(g.buttons && g.buttons[0] && g.buttons[0].pressed);
  },

  update(dt) {
    const k = INPUT.keys;
    let f = 0, s = 0, u = 0;
    if (k.has('KeyW')) f += 1;
    if (k.has('KeyS')) f -= 1;
    if (k.has('KeyA')) s -= 1;
    if (k.has('KeyD')) s += 1;
    if (k.has('Space')) u += 1;
    if (k.has('KeyC')) u -= 1;
    INPUT.sprint = k.has('ShiftLeft') || k.has('ShiftRight');

    INPUT._pollPad();
    const p = INPUT.pad;
    INPUT.move.f = clamp(f + p.move.f, -1, 1);
    INPUT.move.s = clamp(s + p.move.s, -1, 1);
    INPUT.move.u = clamp(u, -1, 1);

    // gamepad look stick → pseudo-px (same pipeline as mouse)
    INPUT.look.x += p.look.x * CFG.input.padLookGain * dt;
    INPUT.look.y += p.look.y * CFG.input.padLookGain * dt;

    // gamepad A-button: camera mode switch (edge-detected)
    if (p.connected && p.btnA && !INPUT._padModePrev) INPUT.modeSwitch = true;
    INPUT._padModePrev = p.connected && p.btnA;
  },

  dispose() { /* listeners live on window/canvas; page lifetime only */ },
};

/* ==================================================================== *
 * CAMERA — ground/exploration + cinematic free-fly, orbit, shake
 *
 *  - one persistent pose (pos / yaw / pitch / fov), one camera object
 *  - mode blend lerp: movement basis + clamps cross-fade, so switching
 *    never snaps
 *  - middle-mouse orbit owns the pose while held, hands back seamlessly
 *  - shake: impulse-decay energy → fresh transient offset each frame
 *    (nothing accumulates into the pose)
 * --------------------------------------------------------------------- */
const _camDir = new THREE.Vector3();
const _fwd = new THREE.Vector3();
const _right = new THREE.Vector3();
const _wish = new THREE.Vector3();
const _up = new THREE.Vector3(0, 1, 0);
const _off = new THREE.Vector3();
const _tmp = new THREE.Vector3();

const CAMERA = {
  name: 'CAMERA',
  mode: 'GROUND',              // GROUND | CINE
  blend: 0,                   // 0 = ground behaviour, 1 = cine behaviour
  blendTarget: 0,
  pos: new THREE.Vector3(0, 4, 18),
  vel: new THREE.Vector3(),
  yaw: 0,
  pitch: 0,
  fov: 60,
  shakeEnergy: 0,
  orbit: null,                 // { target, az, el, radius } while held

  init() {
    // sync from the M0 seed pose so the spawn is identical
    CAMERA.pos.copy(camera.position);
    camera.getWorldDirection(_camDir);
    // convention: fwd(yaw) = (-sin(yaw), 0, -cos(yaw)) → yaw=0 looks at −Z
    CAMERA.yaw = Math.atan2(-_camDir.x, -_camDir.z);
    CAMERA.pitch = Math.asin(clamp(_camDir.y, -1, 1));
    CAMERA.fov = camera.fov;
  },

  /* Public shake API: impulse decay, consumed inside update.
   * M7.5 — energy clamps to CFG.input.shakeCap ⇒ repeated triggers
   * accumulate up to the cap and then hold (never run away). */
  shake(intensity = 0.5) {
    CAMERA.shakeEnergy =
      Math.min(CFG.input.shakeCap, CAMERA.shakeEnergy + Math.max(0, intensity));
  },

  setMode(mode) {
    if (mode !== 'GROUND' && mode !== 'CINE') return;
    CAMERA.mode = mode;
    CAMERA.blendTarget = mode === 'CINE' ? 1 : 0;
  },

  _startOrbit() {
    camera.getWorldDirection(_camDir);
    const L = CFG.input;
    const target = CAMERA.pos.clone().add(_tmp.copy(_camDir).multiplyScalar(L.orbitRadius));
    CAMERA.orbit = {
      target,
      az: CAMERA.yaw,
      el: -CAMERA.pitch,    // elevation: camera above target ⇒ pitch is negative
      radius: L.orbitRadius,
    };
  },

  _endOrbit() {
    if (!CAMERA.orbit) return;
    const o = CAMERA.orbit;
    // recover yaw/pitch from the orbited pose (camera looks at target)
    _tmp.copy(o.target).sub(CAMERA.pos).normalize();
    CAMERA.yaw = Math.atan2(-_tmp.x, -_tmp.z);
    CAMERA.pitch = Math.asin(clamp(_tmp.y, -1, 1));
    CAMERA.orbit = null;
  },

  update(dt, t) {
    const L = CFG.input;

    /* ---- consume INPUT (cleared every frame) ---- */
    // look (mouse px + gamepad pseudo-px)
    const lookX = INPUT.look.x, lookY = INPUT.look.y, zoomN = INPUT.zoom;
    INPUT.look.x = 0; INPUT.look.y = 0; INPUT.zoom = 0;

    /* dev trigger (Key N edge from INPUT): strong shake impulse —
     * M7.5. The system itself is the impulse-decay energy below:
     * _applyShake adds a fresh transient offset each frame (never
     * written into the pose), _decayShake drains it to exactly 0. */
    if (INPUT.shakeTrigger) {
      INPUT.shakeTrigger = false;
      CAMERA.shake(L.shakeImpulse);
    }

    if (INPUT.modeSwitch) {
      INPUT.modeSwitch = false;
      CAMERA.setMode(CAMERA.mode === 'CINE' ? 'GROUND' : 'CINE');
    }

    /* ---- mode blend (smooth lerp between behaviours) ---- */
    CAMERA.blend += (CAMERA.blendTarget - CAMERA.blend)
      * damp(dt, 8 / L.modeBlendTime);
    if (Math.abs(CAMERA.blendTarget - CAMERA.blend) < 1e-3) {
      CAMERA.blend = CAMERA.blendTarget;
    }

    /* ---- fov zoom (wheel notches + gamepad triggers) ---- */
    CAMERA.fov = clamp(
      CAMERA.fov + zoomN * L.fovZoomRate + INPUT.pad.zoom * L.padZoomRate * dt,
      L.fovMin, L.fovMax);
    camera.fov = CAMERA.fov;
    camera.updateProjectionMatrix();

    /* ---- middle-mouse orbit (owns the pose while held) ---- */
    if (INPUT.orbitHeld && !CAMERA.orbit) CAMERA._startOrbit();
    if (CAMERA.orbit) {
      const o = CAMERA.orbit;
      o.az -= lookX * L.orbitSens;
      o.el = clamp(o.el - lookY * L.orbitSens, L.orbitElevMin, L.orbitElevMax);
      if (!INPUT.orbitHeld) {
        CAMERA._endOrbit();
      } else {
        o.radius = clamp(o.radius * Math.exp(zoomN * 0.12), L.orbitRadiusMin, L.orbitRadiusMax);
        const cp = Math.cos(o.el), sp = Math.sin(o.el);
        CAMERA.pos.set(
          o.target.x + o.radius * cp * Math.sin(o.az),
          o.target.y + o.radius * sp,
          o.target.z + o.radius * cp * Math.cos(o.az),
        );
        camera.position.copy(CAMERA.pos);
        camera.lookAt(o.target);
        CAMERA._applyShake(t);                  // shake, then return
        CAMERA._decayShake(dt);
        return;
      }
    }

    /* ---- movement basis ---- */
    const sy = Math.sin(CAMERA.yaw), cy = Math.cos(CAMERA.yaw);
    _fwd.set(-sy, 0, -cy);                     // ground-plane forward (yaw=0 ⇒ −Z)
    _right.set(cy, 0, -sy);                   // ground-plane right
    _tmp.set(
      -sy * Math.cos(CAMERA.pitch),
      Math.sin(CAMERA.pitch),
      -cy * Math.cos(CAMERA.pitch),
    );                                         // free-fly forward (from yaw/pitch)

    const M = INPUT.move;
    const sprint = INPUT.sprint ? 1 : 0;
    const speedG = CFG.input.groundSpeed * (1 + sprint);
    const speedC = CFG.input.cineSpeed * (1 + sprint);

    // ground wish: XZ from yaw basis + free vertical
    _wish.copy(_fwd).multiplyScalar(M.f)
      .addScaledVector(_right, M.s)
      .addScaledVector(_up, M.u)
      .multiplyScalar(speedG);
    // cine wish: full camera basis
    _off.copy(_tmp).multiplyScalar(M.f)
      .addScaledVector(_right, M.s)
      .addScaledVector(_up, M.u)
      .multiplyScalar(speedC);
    // blend the wishes (smooth mode transition)
    _wish.lerp(_off, CAMERA.blend);

    // velocity smoothing (accelerates/decelerates instead of snapping)
    const v = CAMERA.vel;
    if (_wish.lengthSq() > 0) {
      v.lerp(_wish, damp(dt, L.accel));
    } else {
      v.multiplyScalar(Math.max(0, 1 - damp(dt, L.accel * 1.6)));
      if (v.lengthSq() < 1e-6) v.set(0, 0, 0);
    }
    CAMERA.pos.addScaledVector(v, dt);

    /* ---- look ---- */
    const pitchMax = L.pitchClamp.ground + (L.pitchClamp.cine - L.pitchClamp.ground) * CAMERA.blend;
    CAMERA.yaw -= lookX * L.lookSens;
    CAMERA.pitch = clamp(CAMERA.pitch - lookY * L.lookSens, -pitchMax, pitchMax);

    /* ---- collision-lite: ground height clamp (void for now) ----
     * cross-fade: full clamp in GROUND, none in CINE */
    {
      const clampedY = clamp(CAMERA.pos.y, L.groundMinY, L.groundMaxY);
      CAMERA.pos.y += (clampedY - CAMERA.pos.y) * (1 - CAMERA.blend);
    }

    /* ---- write pose to camera + shake ---- */
    camera.position.copy(CAMERA.pos);
    const cp = Math.cos(CAMERA.pitch);
    _camDir.set(-sy * cp, Math.sin(CAMERA.pitch), -cy * cp).normalize();
    camera.lookAt(_tmp.copy(CAMERA.pos).add(_camDir));
    CAMERA._applyShake(t);
    CAMERA._decayShake(dt);
  },

  /* transient view offset — recomputed fresh, never accumulates */
  _applyShake(t) {
    if (CAMERA.shakeEnergy <= 1e-4) return;
    const e = CAMERA.shakeEnergy * CFG.input.shakeAmp;
    _off.set(
      Math.sin(t * 43.7) * e * 0.55,
      Math.cos(t * 51.3) * e * 0.35,
      Math.sin(t * 37.1) * e * 0.55,
    );
    camera.position.add(_off);
  },

  _decayShake(dt) {
    if (CAMERA.shakeEnergy > 0) {
      CAMERA.shakeEnergy = Math.max(0, CAMERA.shakeEnergy - dt * CFG.input.shakeDecay);
    }
  },

  dispose() { },
};

/* ==================================================================== *
 * KIT — procedural voxel material kit (M2)
 *
 *  - shared material library (MATS): emissive server faces, dark metal,
 *    glass, glow panels, cable + one Standard material reserved for hero
 *    parts — mostly Lambert/Basic, cheap forward-lit
 *  - canvas-texture factory: makeCanvasTexture / LED grid / holo sign /
 *    soft glow sprite; "QWEN" + "UNSLOTH" sign faces
 *  - instancing helpers: InstancedBox / InstancedCylinder builders
 *    (capacity up front, per-instance pos/scale/color, zero per-frame
 *    allocation)
 *  - merged-geometry batcher: mergeGeometries(parts) → one static mesh
 *  - lighting rig: hemi + one directional "moon" key light; two point
 *    lights reserved for hero moments (intensity 0 until claimed)
 *  - test rig: gate demo — test wall/tower with animated LED faces and
 *    signs, rendered at < 10 draw calls. Temporary until M3's city
 *    generator absorbs the plaza.
 * --------------------------------------------------------------------- */

/* ---- canvas texture factory ---- */

/* One canvas + one CanvasTexture behind a redraw(t) handle.
 * `frame` counts redraws (smoke-test seam for "it animates"). */
function makeCanvasTexture(w, h, draw) {
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  const T = { canvas, ctx, tex, w, h, frame: 0 };
  T.redraw = u => {
    draw(ctx, w, h, u);
    tex.needsUpdate = true;
    T.frame++;
  };
  T.redraw(0);
  return T;
}

/* deterministic cheap hash → [0,1) for per-cell flicker */
function _hash2(i, j, s) {
  const x = Math.sin(i * 127.1 + j * 311.7 + s * 74.7) * 43758.5453;
  return x - Math.floor(x);
}

/* animated LED grid face: per-cell on/off flicker + travelling scan line */
function makeLedGrid(cols, rows, seed, palette) {
  const cell = 10, gap = 2;
  const W = cols * cell, H = rows * cell;
  return makeCanvasTexture(W, H, (ctx, w, h, t) => {
    ctx.fillStyle = '#04060c';
    ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < cols; i++) {
      for (let j = 0; j < rows; j++) {
        const n = _hash2(i, j, seed);
        const wave = 0.5 + 0.5 * Math.sin(
          t * (1.2 + n * 2.4) + n * 12.6 + i * 0.35 + j * 0.21);
        const on = n * 0.72 + wave * 0.52;         // 0..~1.24
        if (on < 0.34) continue;                  // dark cell
        ctx.globalAlpha = Math.min(1, (on - 0.34) * 1.7);
        ctx.fillStyle = palette[Math.floor(n * palette.length) % palette.length];
        ctx.fillRect(i * cell + gap, j * cell + gap, cell - gap * 2, cell - gap * 2);
      }
    }
    // travelling scan line (cheap "data" feel)
    const sy = (t * H * 0.14) % H;
    const g = ctx.createLinearGradient(0, sy - 10, 0, sy + 10);
    g.addColorStop(0, 'rgba(120,220,255,0)');
    g.addColorStop(0.5, 'rgba(120,220,255,0.22)');
    g.addColorStop(1, 'rgba(120,220,255,0)');
    ctx.fillStyle = g;
    ctx.globalAlpha = 1;
    ctx.fillRect(0, sy - 10, w, 20);
  });
}

/* neon holo sign face; `sub` may be a string or a function (tagline cycle) */
function makeHoloSign(text, sub, color, w = 256, h = 96) {
  return makeCanvasTexture(w, h, (ctx, ww, hh, t) => {
    ctx.clearRect(0, 0, ww, hh);
    const flicker = 0.84 + 0.16 * Math.sin(t * 7.3) * Math.sin(t * 2.9);
    ctx.globalAlpha = flicker;
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    ctx.strokeRect(4, 4, ww - 8, hh - 8);
    ctx.globalAlpha = flicker * 0.25;
    ctx.strokeRect(10, 10, ww - 20, hh - 20);
    ctx.globalAlpha = flicker;
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 18;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `700 ${Math.floor(hh * 0.34)}px ui-monospace, monospace`;
    ctx.fillText(text, ww / 2, hh * 0.42);
    if (sub) {
      ctx.shadowBlur = 8;
      ctx.font = `400 ${Math.floor(hh * 0.15)}px ui-monospace, monospace`;
      ctx.globalAlpha = flicker * 0.9;
      const s = typeof sub === 'function' ? sub() : sub;
      ctx.fillText(s, ww / 2, hh * 0.78);
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  });
}

/* soft radial glow sprite (additive) */
function makeGlowTexture(size = 128, rgb = '150,235,255') {
  return makeCanvasTexture(size, size, (ctx, w, h) => {
    ctx.clearRect(0, 0, w, h);
    const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    g.addColorStop(0, `rgba(${rgb},1)`);
    g.addColorStop(0.35, `rgba(${rgb},0.35)`);
    g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  });
}

/* M10.2: a relaxed sloth silhouette hanging on an antenna arm — a soft
 * additive holo projection (rendered as a billboard sprite). The canvas
 * is a STATIC silhouette; the slow breathing is a per-frame sprite scale
 * in WORLD._updateMonument, not a canvas redraw. */
function makeSlothHolo(color = '#ffb3d9') {
  const W = 140, H = 176;
  return makeCanvasTexture(W, H, (ctx, w, h) => {
    ctx.clearRect(0, 0, w, h);
    const cx = w / 2;
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 14;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    /* the antenna arm — vertical mast + a short horizontal crossbar */
    ctx.globalAlpha = 0.7;
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(cx, 8); ctx.lineTo(cx, h - 8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - 40, 44); ctx.lineTo(cx + 40, 44); ctx.stroke();
    /* front limbs wrapped over the crossbar */
    ctx.lineWidth = 11;
    ctx.beginPath(); ctx.moveTo(cx - 22, 44); ctx.lineTo(cx - 18, 76); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + 22, 44); ctx.lineTo(cx + 18, 76); ctx.stroke();
    /* body — relaxed, drooping */
    ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.ellipse(cx, 108, 27, 42, 0, 0, 6.2832); ctx.fill();
    /* head — resting on the front, below the limbs */
    ctx.beginPath(); ctx.arc(cx, 66, 20, 0, 6.2832); ctx.fill();
    /* hind legs hanging down */
    ctx.lineWidth = 10;
    ctx.globalAlpha = 0.8;
    ctx.beginPath(); ctx.moveTo(cx - 15, 138); ctx.lineTo(cx - 20, 164); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + 15, 138); ctx.lineTo(cx + 20, 164); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
  });
}

/* ---- shared material library (cheap: mostly Lambert/Basic) ---- */

const MATS = {
  metalDark: new THREE.MeshLambertMaterial({ color: 0x2a3344 }),   // dark metal body
  server: new THREE.MeshLambertMaterial({
    color: 0x0d1524,
    emissive: 0x0d3142,        // emissive server face
  }),
  glass: new THREE.MeshLambertMaterial({
    color: 0x8fd8ff,
    emissive: 0x173f58,
    transparent: true,
    opacity: 0.4,
  }),
  glow: new THREE.MeshBasicMaterial({
    color: 0x7fe6ff,
    transparent: true,
    opacity: 0.85,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  }),
  cable: new THREE.MeshLambertMaterial({ color: 0x12161e }),
  metalHero: new THREE.MeshStandardMaterial({
    color: 0x6b7c94, roughness: 0.42, metalness: 0.75,
  }),
  /* M4: shared additive glow for beacons / sparks / fiber light dashes
   * (white base colour — per-instance colour drives the look). */
  pulseGlow: new THREE.MeshBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0.95,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }),
  /* M4: holo-sign billboard faces — one material per shared texture

  signMat: {
    qwen: new THREE.MeshBasicMaterial({
      transparent: true, side: THREE.FrontSide,
